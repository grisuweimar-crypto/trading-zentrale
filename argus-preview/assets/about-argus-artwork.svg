<title id="t">ARGUS – Eule und klassische Architektur</title><desc id="d">Eine symmetrisch gezeichnete Eule mit angelegten Flügeln auf einem Felsen. Rechts ein vollständig ausgeführter antiker Säulentempel in einer ruhigen Berglandschaft. Dunkelblaue und warme Goldtöne.</desc>
