<title id="title">ARGUS – Eule und Säulentempel für schmale Bildschirme</title><desc id="desc">Vollständig sichtbare Eule mit angelegten Flügeln links, proportionaler antiker Tempel rechts und durchgehende Berglandschaft.</desc>
