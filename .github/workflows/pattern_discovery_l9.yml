name: Pattern Discovery L9 Confirmation

on:
  push:
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "src/scanner/research/governance/**"
      - "tests/pattern_discovery/**"
      - "tests/test_qm_c*.py"
      - "tests/test_price_pipeline.py"
      - "tests/test_selection_timing.py"
      - "docs/pattern_discovery/**"
      - "scripts/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l9.yml"
  pull_request:
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "src/scanner/research/governance/**"
      - "tests/pattern_discovery/**"
      - "tests/test_qm_c*.py"
      - "tests/test_price_pipeline.py"
      - "tests/test_selection_timing.py"
      - "docs/pattern_discovery/**"
      - "scripts/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l9.yml"
  workflow_dispatch:

jobs:
  l9-confirmation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Pattern Discovery L0-L9 tests
        run: python -m pytest -q tests/pattern_discovery/test_l0_boundary.py tests/pattern_discovery/test_l1_run_contract.py tests/pattern_discovery/test_l2_feature_library.py tests/pattern_discovery/test_l3_search_engine.py tests/pattern_discovery/test_l4_statistical_guard.py tests/pattern_discovery/test_l5_candidate_registry.py tests/pattern_discovery/test_l6_dependency_graph.py tests/pattern_discovery/test_l7_prospective_capture.py tests/pattern_discovery/test_l8_outcome_maturation.py tests/pattern_discovery/test_l9_confirmation_engine.py
      - name: Run QM-C confirmation-chain compatibility
        run: PYTHONPATH=src python -m pytest -q tests/test_qm_c_hypothesis_registry.py tests/test_qm_c_analysis_plan.py tests/test_qm_c_six_step_structure.py
      - name: Run upstream price/session integrity compatibility
        run: python -m pytest -q tests/test_price_pipeline.py tests/test_selection_timing.py
