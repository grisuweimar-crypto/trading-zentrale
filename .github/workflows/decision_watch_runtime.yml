name: Decision Watch Runtime Publish

on:
  workflow_run:
    workflows: ['Decision Watch Integration Pipeline']
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/decision_watch_runtime.yml'
      - 'scripts/build_watch_runtime_w10.py'
      - 'scripts/run_depot_watch_orchestrated.py'
      - 'scripts/run_depot_watch_e2e_w11.py'
      - 'src/scanner/research/decision_layer/watch_runtime.py'
      - 'tests/test_watch_runtime_transport.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('decision-watch-runtime-pr-{0}', github.event.pull_request.number) || 'decision-watch-runtime-main' }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Prove compact transport preserves Decision semantics
        run: >-
          pytest -q
          tests/test_watch_runtime_transport.py
          tests/test_decision_depot_watch_orchestration.py
          tests/test_w11_end_to_end_acceptance.py
          tests/test_w12_ferrari_regression.py

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[test]'

      - name: Validate sealed W10 and authoritative scanner snapshot
        run: |
          python scripts/generate_daily_research.py --validate-only
          python scripts/run_w10_snapshot_orchestration.py validate

      - name: Build compact sharded Watch runtime from sealed W10 evidence
        run: python scripts/build_watch_runtime_w10.py

      - name: Validate runtime identity, privacy and transport size
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.decision_layer.watch_runtime import validate_runtime_manifest
          from scanner.research.decision_layer.w10_orchestration import validate_sealed_manifest

          root = Path('.')
          runtime_dir = root / 'artifacts/research/watch_runtime'
          runtime = json.loads((runtime_dir / 'manifest.json').read_text(encoding='utf-8'))
          w10 = json.loads((root / 'artifacts/research/decision_snapshot_w10.json').read_text(encoding='utf-8'))
          sealed = validate_sealed_manifest(w10)
          validated = validate_runtime_manifest(runtime, w10_manifest=sealed, expected_snapshot_id=sealed['snapshot_id'])
          shard_paths = sorted(runtime_dir.glob('shard_*.json'))
          assert len(shard_paths) == 16
          assert validated['private_position_data_included'] is False
          assert validated['decision_logic_changed'] is False
          assert validated['symbol_count'] > 0
          assert validated['packet_count'] >= validated['symbol_count']
          max_size = max(path.stat().st_size for path in shard_paths)
          assert max_size < 2_000_000, f'runtime shard too large for pragmatic transport: {max_size}'
          print(json.dumps({
              'snapshot_id': validated['snapshot_id'],
              'symbol_count': validated['symbol_count'],
              'packet_count': validated['packet_count'],
              'max_shard_bytes': max_size,
              'private_position_data_included': False,
          }, sort_keys=True))
          PY

      - name: Refuse stale publication if main advanced during runtime build
        run: |
          git fetch origin main --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main advanced while Watch runtime was being built; refuse stale publication'
            exit 1
          }

      - name: Persist public runtime transport only
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action Bot'
          git add artifacts/research/watch_runtime
          if ! git diff --cached --quiet; then
            git commit -m '🧭 Publish compact Decision Watch runtime [skip ci]'
            git push origin HEAD:main
          fi
