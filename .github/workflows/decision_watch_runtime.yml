name: Decision Watch Runtime Publish

on:
  workflow_run:
    workflows: ['Decision Watch Integration Pipeline']
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/decision_watch_runtime.yml'
      - 'scripts/build_watch_runtime_w10.py'
      - 'scripts/build_elliott_w6_source.py'
      - 'scripts/run_depot_watch_orchestrated.py'
      - 'scripts/run_depot_watch_e2e_w11.py'
      - 'src/scanner/research/decision_layer/watch_runtime.py'
      - 'src/scanner/research/decision_layer/public_long_reference.py'
      - 'src/scanner/research/decision_layer/public_flat_reference.py'
      - 'src/scanner/research/decision_layer/phase6_elliott.py'
      - 'src/scanner/research/decision_layer/w11_end_to_end.py'
      - 'tests/test_watch_runtime_transport.py'
      - 'tests/test_public_long_reference.py'
      - 'tests/test_w6_elliott_6h_to_7f.py'
      - 'tests/test_w11_end_to_end_acceptance.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('decision-watch-runtime-pr-{0}', github.event.pull_request.number) || 'decision-watch-runtime-main' }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Prove compact transport and public position references preserve Decision semantics
        run: >-
          pytest -q
          tests/test_watch_runtime_transport.py
          tests/test_public_long_reference.py
          tests/test_w6_elliott_6h_to_7f.py
          tests/test_decision_depot_watch_orchestration.py
          tests/test_w11_end_to_end_acceptance.py
          tests/test_w12_ferrari_regression.py


  capacity-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Record original persisted transport size without altering audit baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('artifacts/research/watch_runtime')
          sizes = {p.name: p.stat().st_size for p in sorted(root.glob('shard_*.json'))}
          assert len(sizes) == 64
          largest = max(sizes, key=sizes.get)
          print({'baseline_persisted_max_shard': largest, 'bytes': sizes[largest], 'reserve': (2_000_000 - sizes[largest]) / 2_000_000})
          PY
      - name: Rebuild all compact shards from the unmodified sealed W10 source
        run: |
          python scripts/generate_daily_research.py --validate-only
          python scripts/run_w10_snapshot_orchestration.py validate
          python scripts/build_watch_runtime_w10.py
      - name: Verify actual 20 percent reserve, full packet inventory, writer and reader
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.decision_layer.watch_runtime import PARTITION_STRATEGY, load_runtime_packets_for_symbols, validate_runtime_manifest
          from scanner.research.decision_layer.w10_orchestration import validate_sealed_manifest

          root = Path('artifacts/research/watch_runtime')
          w10 = validate_sealed_manifest(json.loads(Path('artifacts/research/decision_snapshot_w10.json').read_text(encoding='utf-8')))
          manifest = validate_runtime_manifest(json.loads((root / 'manifest.json').read_text(encoding='utf-8')), w10_manifest=w10, expected_snapshot_id=w10['snapshot_id'])
          assert manifest['partition_strategy'] == PARTITION_STRATEGY
          assert manifest['private_position_data_included'] is False
          assert manifest['decision_logic_changed'] is False
          paths = sorted(root.glob('shard_*.json'))
          assert len(paths) == 64 and manifest['shard_count'] == 64
          payloads = [json.loads(p.read_text(encoding='utf-8')) for p in paths]
          assert sum(s['packet_count'] for s in payloads) == manifest['packet_count']
          assert sum(len(s['symbols']) for s in payloads) == manifest['symbol_count']
          assert len(manifest['symbol_shards']) == manifest['symbol_count']
          assert set().union(*(set(s['symbols']) for s in payloads)) == set(manifest['symbol_shards'])
          for file, shard in zip(paths, payloads, strict=True):
              assert file.name == f"shard_{shard['shard_id']}.json"
              assert shard['snapshot_id'] == manifest['snapshot_id']
              assert shard['private_position_data_included'] is False
          sizes = {p.name: p.stat().st_size for p in paths}
          top = sorted(sizes.items(), key=lambda kv: kv[1], reverse=True)[:5]
          max_bytes = top[0][1]
          headroom = (2_000_000 - max_bytes) / 2_000_000
          samples = sorted(manifest['symbol_shards'])
          for cohort in (samples[:8], samples[-8:], ['NOW', 'HL', 'MRNA', 'ROL', 'RHM.DE']):
              wanted = [name for name in cohort if name in manifest['symbol_shards']]
              packets, meta = load_runtime_packets_for_symbols(root, wanted, w10_manifest=w10, expected_snapshot_id=w10['snapshot_id'])
              assert meta['mapped_symbol_count'] == len(wanted)
              assert {p['symbol'] for p in packets} == set(wanted)
          reference_long = json.loads((root / 'public_long_reference.json').read_text(encoding='utf-8'))
          reference_flat = json.loads((root / 'public_flat_reference.json').read_text(encoding='utf-8'))
          assert reference_long['snapshot_id'] == reference_flat['snapshot_id'] == manifest['snapshot_id']
          assert reference_long['row_count'] == reference_flat['row_count'] == manifest['symbol_count']
          assert reference_long['position_assumption']['actual_holdings_included'] is False
          assert reference_flat['position_assumption']['actual_holdings_included'] is False
          print(json.dumps({'capacity_preview': 'PASS' if headroom >= 0.20 else 'REVIEW_REQUIRED', 'snapshot_id': manifest['snapshot_id'], 'symbols': manifest['symbol_count'], 'packets': manifest['packet_count'], 'max_shard_bytes': max_bytes, 'headroom_ratio': headroom, 'largest_shards': top, 'projection_sha256': manifest['runtime_projection_sha256'], 'reader_roundtrip': 'PASS', 'public_references': 'PASS'}, sort_keys=True))
          assert headroom >= 0.20, f'BA-QM-REPAIR-01 requires >=20% real headroom: {headroom:.4%}'
          PY

  readiness:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Check current W10 runtime readiness
        id: check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          daily = json.loads(Path('artifacts/research/daily_research.json').read_text(encoding='utf-8'))
          w10_path = Path('artifacts/research/decision_snapshot_w10.json')
          ready = False
          reason = 'w10_manifest_missing'
          if w10_path.exists():
              w10 = json.loads(w10_path.read_text(encoding='utf-8'))
              current = str(daily.get('snapshot_id') or '')
              sealed = str(w10.get('snapshot_id') or '')
              status = str(w10.get('status') or '')
              ready = bool(current) and sealed == current and status == 'sealed'
              reason = 'same_snapshot_sealed_ready' if ready else f'w10_not_ready:{sealed}:{status}:{current}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
              handle.write(f"reason={reason}\n")
          print({'ready': ready, 'reason': reason})
          PY
      - name: Report deferred runtime trigger
        if: steps.check.outputs.ready != 'true'
        run: echo "Runtime publication deferred safely; ${{ steps.check.outputs.reason }}"

  publish:
    needs: readiness
    if: >-
      needs.readiness.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[test]'

      - name: Validate sealed W10 and authoritative scanner snapshot
        run: |
          python scripts/generate_daily_research.py --validate-only
          python scripts/run_w10_snapshot_orchestration.py validate

      - name: Reconstruct the exact W10-frozen Elliott W6 source when available
        id: elliott
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FILE="$RUNNER_TEMP/decision_elliott_6h_source_v1.json"
          CAPTURE_FILE="$RUNNER_TEMP/elliott_vnext_prospective_current_6h.json"
          echo "source_path=" >> "$GITHUB_OUTPUT"

          python - <<'PY' > "$RUNNER_TEMP/phase6_runtime.env"
          import json
          from pathlib import Path
          manifest = json.loads(Path('artifacts/research/decision_snapshot_w10.json').read_text(encoding='utf-8'))
          stage = manifest['stages']['phase6_elliott']
          print('STATUS=' + str(stage.get('status') or ''))
          print('SOURCE_COMMIT=' + str(stage.get('source_commit') or ''))
          print('AVAILABLE_FROM=' + str(stage.get('available_from') or ''))
          print('SOURCE_CAPTURE_ID=' + str(stage.get('source_capture_id') or ''))
          PY
          source "$RUNNER_TEMP/phase6_runtime.env"

          if [[ "$STATUS" == "not_supplied" ]]; then
            echo 'W10 froze Phase 6 as not_supplied; runtime must not add Elliott later.'
            exit 0
          fi
          test "$STATUS" = "available" || { echo "Unsupported W10 Phase 6 status: $STATUS"; exit 1; }
          test -n "$SOURCE_COMMIT"
          test -n "$AVAILABLE_FROM"
          test -n "$SOURCE_CAPTURE_ID"

          CAPTURE_PATH='artifacts/research/elliott_vnext_prospective_current_6h.json'
          git fetch origin elliott-vnext-shadow-data:refs/remotes/origin/elliott-vnext-shadow-data --force
          git cat-file -e "origin/elliott-vnext-shadow-data:$CAPTURE_PATH"
          git show "origin/elliott-vnext-shadow-data:$CAPTURE_PATH" > "$CAPTURE_FILE"

          CAPTURE_FILE="$CAPTURE_FILE" SOURCE_CAPTURE_ID="$SOURCE_CAPTURE_ID" python - <<'PY'
          import json
          import os
          from pathlib import Path
          daily = json.loads(Path('artifacts/research/daily_research.json').read_text(encoding='utf-8'))
          capture = json.loads(Path(os.environ['CAPTURE_FILE']).read_text(encoding='utf-8'))
          assert str(capture.get('capture_id') or '') == os.environ['SOURCE_CAPTURE_ID']
          assert str(capture.get('snapshot_id') or '') == str(daily.get('snapshot_id') or '')
          assert str(capture.get('as_of') or '') == str(daily.get('as_of') or '')
          PY

          EVIDENCE_AVAILABLE_FROM=$(git show -s --format=%cI "$SOURCE_COMMIT")
          python scripts/build_elliott_w6_source.py             --capture "$CAPTURE_FILE"             --source-commit "$SOURCE_COMMIT"             --evidence-available-from "$EVIDENCE_AVAILABLE_FROM"             --available-from "$AVAILABLE_FROM"             --output "$SOURCE_FILE"
          echo "source_path=$SOURCE_FILE" >> "$GITHUB_OUTPUT"

      - name: Build compact sharded Watch runtime from sealed W10 evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.elliott.outputs.source_path }}" ]]; then
            python scripts/build_watch_runtime_w10.py               --elliott-6h-source "${{ steps.elliott.outputs.source_path }}"
          else
            python scripts/build_watch_runtime_w10.py
          fi

      - name: Validate runtime identity, privacy, public position references and transport size
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.decision_layer.watch_runtime import SHARD_IDS, validate_runtime_manifest
          from scanner.research.decision_layer.w10_orchestration import validate_sealed_manifest

          root = Path('.')
          runtime_dir = root / 'artifacts/research/watch_runtime'
          runtime = json.loads((runtime_dir / 'manifest.json').read_text(encoding='utf-8'))
          public_long = json.loads((runtime_dir / 'public_long_reference.json').read_text(encoding='utf-8'))
          public_flat = json.loads((runtime_dir / 'public_flat_reference.json').read_text(encoding='utf-8'))
          w10 = json.loads((root / 'artifacts/research/decision_snapshot_w10.json').read_text(encoding='utf-8'))
          sealed = validate_sealed_manifest(w10)
          validated = validate_runtime_manifest(runtime, w10_manifest=sealed, expected_snapshot_id=sealed['snapshot_id'])
          shard_paths = sorted(runtime_dir.glob('shard_*.json'))
          assert len(shard_paths) == len(SHARD_IDS)
          assert validated['private_position_data_included'] is False
          assert validated['decision_logic_changed'] is False
          assert validated['symbol_count'] > 0
          assert validated['packet_count'] >= validated['symbol_count']
          assert public_long['schema_version'] == 'decision_watch_public_long_reference_v1'
          assert public_long['snapshot_id'] == sealed['snapshot_id']
          assert public_long['row_count'] == validated['symbol_count']
          assert public_long['position_assumption']['hypothetical'] is True
          assert public_long['position_assumption']['actual_holdings_included'] is False
          assert public_long['position_assumption']['private_position_data_included'] is False
          assert public_long['semantics']['decision_logic_changed'] is False
          assert public_flat['schema_version'] == 'decision_watch_public_flat_reference_v1'
          assert public_flat['snapshot_id'] == sealed['snapshot_id']
          assert public_flat['row_count'] == validated['symbol_count']
          assert public_flat['position_assumption']['position_state'] == 'flat'
          assert public_flat['position_assumption']['hypothetical'] is True
          assert public_flat['position_assumption']['actual_holdings_included'] is False
          assert public_flat['position_assumption']['private_position_data_included'] is False
          assert public_flat['semantics']['decision_logic_changed'] is False
          phase6 = sealed['stages']['phase6_elliott']
          expected_elliott = phase6['status'] == 'available'
          assert public_long['semantics']['elliott_review_context_integration_enabled'] is expected_elliott
          assert public_long['semantics']['elliott_direction_used_as_vote'] is False
          assert public_long['semantics']['elliott_changed_universal_stance'] is False
          assert public_flat['semantics']['elliott_review_context_integration_enabled'] is expected_elliott
          assert public_flat['semantics']['elliott_direction_used_as_vote'] is False
          assert public_flat['semantics']['elliott_changed_universal_stance'] is False
          if expected_elliott:
              assert public_long['diagnostics']['elliott_6h_source_status'] == 'available'
              assert public_flat['diagnostics']['elliott_6h_source_status'] == 'available'
          assert all(row['availability'] == 'decision_available' for row in public_long['rows'])
          assert all(row['availability'] == 'decision_available' for row in public_flat['rows'])
          max_size = max(path.stat().st_size for path in shard_paths)
          assert max_size < 2_000_000, f'runtime shard too large for pragmatic transport: {max_size}'
          headroom_ratio = (2_000_000 - max_size) / 2_000_000
          if headroom_ratio < 0.20:
              print(f'::warning::Watch runtime capacity REVIEW_REQUIRED: headroom={headroom_ratio:.4%}, max_shard_bytes={max_size}')
          else:
              print(f'Watch runtime capacity PASS: headroom={headroom_ratio:.4%}')
          public_long_csv = runtime_dir / 'public_long_reference.csv'
          public_flat_csv = runtime_dir / 'public_flat_reference.csv'
          assert public_long_csv.exists() and public_long_csv.stat().st_size < 1_000_000
          assert public_flat_csv.exists() and public_flat_csv.stat().st_size < 1_000_000
          print(json.dumps({
              'snapshot_id': validated['snapshot_id'],
              'symbol_count': validated['symbol_count'],
              'packet_count': validated['packet_count'],
              'public_long_reference_rows': public_long['row_count'],
              'public_flat_reference_rows': public_flat['row_count'],
              'max_shard_bytes': max_size,
              'headroom_ratio': headroom_ratio,
              'capacity_review_recommended': headroom_ratio < 0.20,
              'public_long_csv_bytes': public_long_csv.stat().st_size,
              'public_flat_csv_bytes': public_flat_csv.stat().st_size,
              'private_position_data_included': False,
          }, sort_keys=True))
          PY

      - name: Refuse stale publication if main advanced during runtime build
        run: |
          git fetch origin main --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main advanced while Watch runtime was being built; refuse stale publication'
            exit 1
          }

      - name: Persist public runtime transport only
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action Bot'
          git add artifacts/research/watch_runtime
          if ! git diff --cached --quiet; then
            git commit -m '🧭 Publish compact Decision Watch runtime [skip ci]'
            git push origin HEAD:main
          fi

      - name: Dispatch symbol views after runtime publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run decision_watch_symbol_views.yml --ref main
