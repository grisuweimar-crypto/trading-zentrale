name: ARGUS multi-year and four-hour research
on:
  pull_request:
    paths:
      - 'src/scanner/research/zone_timeframes.py'
      - 'scripts/prefetch_argus_timeframes.py'
      - 'scripts/generate_argus_zone_watch.py'
      - 'tests/test_argus_multiscale_zone_watch.py'
      - '.github/workflows/argus_multiscale.yml'
      - 'scripts/audit_radar_zone_bridge.py'
      - 'tests/test_radar_zone_bridge.py'
      - 'argus-preview/observations/external_thesis_watch_candidates.json'
  push:
    branches: [main]
    paths:
      - 'src/scanner/research/zone_timeframes.py'
      - 'scripts/prefetch_argus_timeframes.py'
      - '.github/workflows/argus_multiscale.yml'
  schedule:
    - cron: '35 22 * * *'
      timezone: Europe/Berlin
    - cron: '15 3 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-daily-publication
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install project dependencies
        run: python -m pip install -e '.[test]'
      - name: Causal monthly, four-hour and scanner regression gates
        run: |
          python -m py_compile scripts/prefetch_argus_timeframes.py src/scanner/research/zone_timeframes.py scripts/generate_argus_zone_watch.py
          python -m pytest -q tests/test_argus_multiscale_zone_watch.py tests/test_argus_daily_zone_watch.py tests/test_argus_zones_v01.py tests/test_elliott_vnext_scenarios.py tests/test_radar_zone_bridge.py
      - name: Existing archived daily cache smoke, optional new timeframes
        run: |
          python scripts/generate_argus_zone_watch.py --json /tmp/zones.json --html /tmp/zones.html --history /tmp/argus-zones
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/zones.json').read_text())
          assert d['count'] == len(d['assets'])
          assert 'monthly_available' in d and 'four_hour_available' in d
          assert all('monthly' in a['multiscale'] and 'four_hour' in a['multiscale'] for a in d['assets'])
          assert 'Mehrjährige Elliott' in Path('/tmp/zones.html').read_text()
          print('coverage',d['available'],d['monthly_available'],d['four_hour_available'])
          PY

  multiscale-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install project dependencies
        run: python -m pip install -e '.[test]'
      - name: Cache and close-bar preflight
        run: |
          test -s artifacts/watchlist/watchlist_full.csv
          test -s artifacts/market_data/yahoo_ohlcv.csv
          python -m pytest -q tests/test_argus_multiscale_zone_watch.py tests/test_argus_daily_zone_watch.py tests/test_radar_zone_bridge.py
      - name: Collect provider long-horizon and RTH hourly history, independently from scanner
        run: python -m scripts.prefetch_argus_timeframes --workers 8
      - name: Rebuild documented research-only multi-timeframe outputs
        run: python scripts/generate_argus_zone_watch.py
      - name: Radar-Zonen-Brücke als separate Forschungsausgabe erzeugen
        run: python scripts/audit_radar_zone_bridge.py
      - name: Verify complete explicit availability and unaltered scanner scores
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/reports/argus_zones_all.json').read_text())
          assert d['count'] == len(d['assets']) and d['count'] >= 1
          assert not d['score_modified'] and d['research_only']
          assert all(a['multiscale']['monthly']['empirical_probability'] is None and
                     a['multiscale']['four_hour']['empirical_probability'] is None
                     for a in d['assets'])
          assert all((a['multiscale'][tf]['status'] == 'RESEARCH_ONLY' or
                      not a['multiscale'][tf]['zones']) for a in d['assets']
                      for tf in ('monthly','four_hour'))
          print('coverage monthly / 4h:',d['monthly_available'],d['four_hour_available'],'/',d['count'])
          for ticker in ('UEC','XPEV','WPM.TO'):
              a=next((x for x in d['assets'] if x['symbol']==ticker),None)
              if a is not None:
                  print(ticker,[(tf,a['multiscale'][tf]['status'],
                                a['multiscale'][tf].get('reason'),
                                len(a['multiscale'][tf]['zones']))
                                for tf in ('monthly','four_hour')])
          PY
      - name: Commit separate research evidence; do not touch scanner scores
        run: |
          git config user.email 'action@github.com'
          git config user.name 'GitHub Action Bot'
          git add artifacts/market_data/argus_multiscale.csv \
            artifacts/reports/argus_multiscale_fetch.json \
            artifacts/reports/argus_zones_all.json \
            artifacts/ui/zones.html artifacts/zones/history/ \
            artifacts/reports/radar_zone_bridge.json artifacts/ui/radar-zones.html \
            artifacts/research/radar_zone_bridge_history/
          if ! git diff --cached --quiet; then
            git commit -m '📈 ARGUS multi-year and four-hour research snapshot [skip ci]'
            git push origin HEAD:main
          fi
