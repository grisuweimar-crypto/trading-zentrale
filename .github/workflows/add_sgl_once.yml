name: Add SGL Carbon once

on:
  push:
    paths:
      - '.github/workflows/add_sgl_once.yml'

permissions:
  contents: write

jobs:
  add-sgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add SGL Carbon to universe master if missing
        shell: python
        run: |
          from pathlib import Path

          p = Path('data/inputs/universe_master.csv')
          text = p.read_text(encoding='utf-8')
          if not text.endswith('\n'):
              text += '\n'

          symbol = 'SGL.DE'
          isin = 'DE0007235301'
          row = '1,SGL.DE,SGL Carbon SE,DE0007235301,stock,Fundament,Basic Materials,Chemicals,Germany,EUR,S4 Fundament,pillar,84.0,manual addition via ChatGPT,"materials, mining, metals"'

          symbol_exists = any(line.startswith(f'1,{symbol},') for line in text.splitlines())
          isin_exists = any(f',{isin},' in line for line in text.splitlines())
          if symbol_exists or isin_exists:
              print('SGL Carbon already present; nothing to do.')
          else:
              p.write_text(text + row + '\n', encoding='utf-8')
              print('Added SGL Carbon')
      - name: Commit addition if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/inputs/universe_master.csv; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inputs/universe_master.csv
          git commit -m "Add SGL Carbon to scanner universe"
          git push origin HEAD:main
