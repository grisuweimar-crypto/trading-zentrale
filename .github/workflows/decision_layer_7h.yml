name: Phase 7H Depot Watch Integration

on:
  pull_request:
    paths:
      - "configs/decision_depot_watch_v1.json"
      - "src/scanner/research/decision_layer/**"
      - "tests/test_decision_depot_watch_7h.py"
      - "tests/test_w1_daily_context_7h.py"
      - "tests/test_decision_depot_watch_orchestration.py"
      - "tests/test_decision_depot_watch_prospective_gate.py"
      - "tests/test_decision_reliability_explainability_7g.py"
      - "tests/test_decision_portfolio_action_7f.py"
      - "tests/test_decision_state_transitions_7e.py"
      - "tests/test_decision_universal_stance_7d.py"
      - "scripts/run_depot_watch_7h.py"
      - "scripts/run_depot_watch_orchestrated.py"
      - "scripts/build_current_decision_evidence_7a.py"
      - "docs/decision_layer_7h.md"
      - "docs/decision_depot_watch_orchestration.md"
      - "docs/decision_depot_watch_prospective_boundary.md"
      - ".github/workflows/decision_layer_7h.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 7D through 7H regression tests
        run: >-
          pytest -q
          tests/test_decision_universal_stance_7d.py
          tests/test_decision_state_transitions_7e.py
          tests/test_decision_portfolio_action_7f.py
          tests/test_decision_reliability_explainability_7g.py
          tests/test_decision_depot_watch_7h.py
          tests/test_w1_daily_context_7h.py
          tests/test_decision_depot_watch_orchestration.py
          tests/test_decision_depot_watch_prospective_gate.py
      - name: Smoke-test 7H CLIs
        run: |
          python scripts/run_depot_watch_7h.py --help
          python scripts/run_depot_watch_orchestrated.py --help
          python scripts/build_current_decision_evidence_7a.py --help
      - name: Validate current productive daily research snapshot
        run: python scripts/generate_daily_research.py --validate-only
