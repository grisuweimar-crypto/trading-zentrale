name: QM-B Identity Reconciliation

on:
  pull_request:
    paths:
      - "configs/qm_b_identity_reconciliation_v1.json"
      - "src/scanner/research/governance/qm_b_identity_reconciliation.py"
      - "scripts/qm_b_identity_reconciliation.py"
      - "tests/test_qm_b_identity_reconciliation.py"
      - "docs/qm_b_identity_reconciliation.md"
      - ".github/workflows/qm_b_identity_reconciliation.yml"
      - "artifacts/research/history_analysis.csv"
      - "data/inputs/universe_master.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b-identity-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run identity reconciliation tests
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_qm_b_identity_reconciliation.py \
            tests/test_qm_b_observed_membership.py \
            tests/test_qm_b_crypto_identifier.py
      - name: Reconcile real history against immutable repository snapshots
        run: |
          PYTHONPATH=src python scripts/qm_b_identity_reconciliation.py \
            --history artifacts/research/history_analysis.csv \
            --current-universe data/inputs/universe_master.csv \
            --repo-root . \
            --output /tmp/qm_b_identity_reconciliation.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/qm_b_identity_reconciliation.json', encoding='utf-8'))
          print(json.dumps({
              'scanner_observation_count': p['scanner_observation_count'],
              'unique_observed_identifier_count': p['unique_observed_identifier_count'],
              'candidate_class_counts': p['candidate_class_counts'],
              'identity_status_counts': p['identity_status_counts'],
              'pit_verified_observation_count': p['pit_verified_observation_count'],
              'pit_unverified_observation_count': p['pit_unverified_observation_count'],
              'candidate_instrument_count': p['candidate_instrument_count'],
              'pit_alias_seed_count': p['pit_alias_seed_count'],
              'conflicting_snapshot_alias_count': p['conflicting_snapshot_alias_count'],
              'unresolved_or_ambiguous_identifiers': p['unresolved_or_ambiguous_identifiers'],
          }, indent=2, sort_keys=True))
          assert p['strict_alias_ledger'] is False
          assert p['strict_membership_ledger'] is False
          assert p['absence_interpreted_as_out_of_scope'] is False
          assert p['current_only_match_verifies_historical_identity'] is False
          assert p['historical_snapshot_count'] == 2
          assert p['scanner_observation_count'] > 0
          assert p['unique_observed_identifier_count'] > 0
          assert p['pit_alias_seed_count'] > 0
          assert p['candidate_class_counts'].get('HISTORICAL_ISIN_SNAPSHOT_MATCH', 0) > 0
          assert p['candidate_class_counts'].get('HISTORICAL_SYMBOL_SNAPSHOT_MATCH', 0) > 0
          assert p['candidate_class_counts'].get('CRYPTO_BASE_LINEAGE', 0) > 0
          print('QM-B identity reconciliation safeguards verified on real repository history.')
          PY
