name: ARGUS External Thesis Follow-up

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/argus_external_followup.py"
      - "scripts/argus_external_scanner_checkpoint.py"
      - "argus-preview/observations/external_thesis_source_notes.json"
      - ".github/workflows/argus_external_thesis_followup.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/argus_external_followup.py"
      - "tests/test_argus_external_followup.py"
      - "tests/test_argus_external_scanner_checkpoint.py"
      - ".github/workflows/argus_external_thesis_followup.yml"

permissions:
  contents: write

concurrency:
  group: argus-external-thesis-observations
  cancel-in-progress: false

jobs:
  evaluate-external-theses:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -e ".[test]"
      - name: Check external thesis evaluation boundaries
        run: python -m pytest -q tests/test_argus_external_followup.py tests/test_argus_external_scanner_checkpoint.py
      - name: Evaluate completed original-currency sessions
        if: github.event_name != 'pull_request'
        run: |
          python scripts/argus_external_followup.py \
            --notes argus-preview/observations/external_thesis_source_notes.json \
            --output /tmp/external_thesis_latest.json
      - name: Capture point-in-time scanner evidence without changing production
        if: github.event_name != 'pull_request'
        run: |
          python scripts/argus_external_scanner_checkpoint.py \
            --metadata artifacts/research/history_metadata.json \
            --scanner artifacts/research/latest_scanner.csv \
            --output /tmp/argus_external_scanner_checkpoint.json
          cp scripts/argus_external_scanner_checkpoint.py /tmp/argus_external_scanner_checkpoint.py
      - name: Publish research-only archive on isolated branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          branch=external-thesis-research-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"; then
            git switch -C "$branch" "origin/$branch"
          else
            git switch --orphan "$branch"
            git rm -rf . >/dev/null || true
          fi
          python - <<'PY'
          import json, pathlib, shutil, sys
          sys.path.insert(0,'/tmp')
          from argus_external_scanner_checkpoint import attach
          data=json.loads(pathlib.Path('/tmp/external_thesis_latest.json').read_text())
          if data.get('schema_version')!='argus_external_thesis_followup_v1' or data.get('research_only') is not True:
              raise RuntimeError('external_thesis_invalid_research_only_schema')
          if data.get('scanner_changed') is not False or data.get('qm_changed') is not False:
              raise RuntimeError('external_thesis_productive_boundary_violation')
          base=pathlib.Path('artifacts/research/external_thesis')
          checkpoint=json.loads(pathlib.Path('/tmp/argus_external_scanner_checkpoint.json').read_text())
          if checkpoint['schema_version']!='argus_external_scanner_checkpoint_v1' or checkpoint['research_only'] is not True:
              raise RuntimeError('scanner_checkpoint_invalid')
          checkpoints_dir=base/'scanner_snapshots'
          checkpoints_dir.mkdir(parents=True,exist_ok=True)
          point=checkpoints_dir/(checkpoint['snapshot_id']+'.json')
          if point.exists():
              older=json.loads(point.read_text())
              if older.get('csv_sha256')!=checkpoint['csv_sha256']:
                  raise RuntimeError('scanner_checkpoint_immutable_conflict')
          else:
              point.write_text(json.dumps(checkpoint,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          history=[json.loads(p.read_text()) for p in checkpoints_dir.glob('*.json')]
          data=attach(data,history)
          archive=base/'snapshots'/f"{data['as_of']}.json"
          if archive.exists():
              old=json.loads(archive.read_text())
              if old.get('source_notes_sha256')!=data.get('source_notes_sha256'):
                  raise RuntimeError('same_date_source_note_revision_requires_new_review')
              print('Research day already archived; preserving original observation.')
          else:
              archive.parent.mkdir(parents=True, exist_ok=True)
              archive.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
              shutil.copyfile(archive,base/'latest.json')
          PY
          git add artifacts/research/external_thesis
          if git diff --cached --quiet; then
            echo "No new completed research day."
            exit 0
          fi
          git commit -m "research(external): publish independent dated thesis follow-up"
          git push origin "HEAD:refs/heads/$branch"
