name: Phase 4 Confidence vNext Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/scanner/reports/confidence_vnext.py'
      - 'scripts/run_confidence_vnext_4.py'
      - 'tests/test_confidence_vnext.py'
      - 'docs/confidence_vnext_4.md'
      - '.github/workflows/confidence_vnext_4.yml'
      - 'artifacts/research/history_analysis.csv'
      - 'artifacts/research/history_metadata.json'

permissions:
  contents: read

concurrency:
  group: phase4-confidence-vnext-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Phase 4 tests
        run: python -m pytest -q tests/test_confidence_vnext.py tests/test_confidence.py
      - name: Run Phase 4 audit
        run: python scripts/run_confidence_vnext_4.py
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/research/confidence_vnext_4.json').read_text(encoding='utf-8'))
          assert report['phase'] == '4_confidence_vnext_audit'
          semantics = report['semantics']
          assert semantics['research_only'] is True
          assert semantics['production_confidence_changed'] is False
          assert semantics['production_score_changed'] is False
          assert semantics['opportunity_weights_changed'] is False
          assert semantics['risk_weights_changed'] is False
          assert semantics['r_codes_changed'] is False
          assert semantics['portfolio_logic_changed'] is False
          assert semantics['missing_evidence'] == 'unknown_or_insufficient_not_neutral'

          aggregate = report['history_audit']['aggregate_confidence']
          assert aggregate['component_breakdown_archived'] is False
          assert aggregate['normalized_factor_payload_archived_by_default'] is False
          assert set(aggregate['formula_epochs']) == {
              'pre_alias_fix', 'transition_unknown', 'post_alias_fix'
          }

          testability = report['testability']
          assert testability['legacy_component_breakdown']['status'] == 'not_directly_testable'
          assert testability['statistical_confidence']['status'] == 'testable_only_as_of'

          statistical = report['research_contract']['pillars']['statistical_confidence']
          assert statistical['uncertainty']['effective_block_length'] == '2_x_forward_horizon'
          assert statistical['uncertainty']['minimum_support_regions_for_robust_interval'] == 2

          print('FIRST_CONFIDENCE', aggregate['first_observed_non_null_date'])
          print('FORMULA_EPOCHS', json.dumps(aggregate['formula_epochs'], sort_keys=True))
          print('RAW_PRESENCE_PROXY', json.dumps(report['history_audit']['raw_presence_proxy'], sort_keys=True))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: confidence-vnext-4
          path: artifacts/research/confidence_vnext_4.json
          if-no-files-found: error
