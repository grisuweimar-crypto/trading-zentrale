name: Phase 8G-F Holdout OOS

on:
  push:
    branches:
      - phase8g-incremental-evidence-research
    paths:
      - "configs/external_evidence_8g_evaluation_protocol_v1.json"
      - "configs/external_evidence_8g_holdout_protocol_v1.json"
      - "artifacts/research/external_evidence_8g_holdout_consumption_v1.json"
      - "src/scanner/research/external_evidence/evaluation_8g.py"
      - "src/scanner/research/external_evidence/holdout_8g.py"
      - "tests/test_external_evidence_8g_evaluation.py"
      - "tests/test_external_evidence_8g_holdout.py"
      - ".github/workflows/external_evidence_8g_holdout.yml"
  pull_request:
    paths:
      - "configs/external_evidence_8g_evaluation_protocol_v1.json"
      - "configs/external_evidence_8g_holdout_protocol_v1.json"
      - "artifacts/research/external_evidence_8g_holdout_consumption_v1.json"
      - "src/scanner/research/external_evidence/evaluation_8g.py"
      - "src/scanner/research/external_evidence/holdout_8g.py"
      - "tests/test_external_evidence_8g_evaluation.py"
      - "tests/test_external_evidence_8g_holdout.py"
      - ".github/workflows/external_evidence_8g_holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Re-verify Phase 8G-E Validation boundary
        run: python -m pytest -q tests/test_external_evidence_8g_evaluation.py

      - name: Validate Phase 8G-F one-shot Holdout OOS governance
        run: python -m pytest -q tests/test_external_evidence_8g_holdout.py

# 8G-F owns Holdout/OOS governance.
# Candidate selection is frozen from Validation only, before any Holdout value is opened.
# Non-candidates may not access Holdout and remain SEALED in the consumption ledger.
# Candidates may consume Holdout once only and may not refit models, alter features,
# thresholds, variants or horizons after Validation.
# Holm multiplicity retains all 12 frozen factor x horizon hypotheses even if only a
# subset enters Holdout; non-candidates and underpowered candidates contribute p=1.
# 8G-F does not enable cross-factor research, Decision-Layer integration or production.
# The next planned 8G subphase is 8G-G Prospective Confirmation.
