name: Phase 8C-J Offline SEC Bulk Import

on:
  pull_request:
    paths:
      - "configs/external_evidence_8c_transport_status_v1.json"
      - "src/scanner/research/external_evidence/sec_bulk_import.py"
      - "scripts/import_external_evidence_8c_sec_bulk.py"
      - "tests/test_external_evidence_8c_sec_bulk_import.py"
      - "docs/external_evidence_8c_j_offline_sec_bulk_import.md"
      - ".github/workflows/external_evidence_8c_j_offline_sec_bulk_import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 8C-J offline bulk import tests
        run: python -m pytest -q tests/test_external_evidence_8c_sec_bulk_import.py
      - name: Verify bulk import CLI
        run: python scripts/import_external_evidence_8c_sec_bulk.py --help

# This workflow is intentionally network-free. It validates archive semantics only.
