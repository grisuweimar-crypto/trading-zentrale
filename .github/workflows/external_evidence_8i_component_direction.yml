name: Phase 8I-D Component Direction State Engine

on:
  workflow_dispatch:
  push:
    paths:
      - "configs/external_evidence_8i_component_direction_state_engine_v1.json"
      - "src/scanner/research/external_evidence/component_direction_8i.py"
      - "tests/test_external_evidence_8i_component_direction.py"
      - "docs/external_evidence_8i_component_direction_state_engine.md"
      - ".github/workflows/external_evidence_8i_component_direction.yml"
      - "configs/external_evidence_8i_promotion_provenance_binding_v1.json"
      - "src/scanner/research/external_evidence/decision_binding_8i.py"
      - "configs/external_evidence_8i_external_aggregation_design_v1.json"
      - "src/scanner/research/external_evidence/external_aggregation_8i.py"
      - "configs/external_evidence_8g_challenger_specs_v1.json"
      - "src/scanner/research/external_evidence/discovery_fit_8g.py"
      - "configs/external_evidence_8h_interaction_model_construction_v1.json"
      - "src/scanner/research/external_evidence/interaction_model_8h.py"
      - "configs/external_evidence_8h_interaction_discovery_evaluation_v1.json"
      - "src/scanner/research/external_evidence/interaction_discovery_8h.py"
  pull_request:
    paths:
      - "configs/external_evidence_8i_component_direction_state_engine_v1.json"
      - "src/scanner/research/external_evidence/component_direction_8i.py"
      - "tests/test_external_evidence_8i_component_direction.py"
      - "docs/external_evidence_8i_component_direction_state_engine.md"
      - ".github/workflows/external_evidence_8i_component_direction.yml"
      - "configs/external_evidence_8i_promotion_provenance_binding_v1.json"
      - "src/scanner/research/external_evidence/decision_binding_8i.py"
      - "configs/external_evidence_8i_external_aggregation_design_v1.json"
      - "src/scanner/research/external_evidence/external_aggregation_8i.py"
      - "configs/external_evidence_8g_challenger_specs_v1.json"
      - "src/scanner/research/external_evidence/discovery_fit_8g.py"
      - "configs/external_evidence_8h_interaction_model_construction_v1.json"
      - "src/scanner/research/external_evidence/interaction_model_8h.py"
      - "configs/external_evidence_8h_interaction_discovery_evaluation_v1.json"
      - "src/scanner/research/external_evidence/interaction_discovery_8h.py"

permissions:
  contents: read

jobs:
  direction-state-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Guard Phase 8I-A baseline
        run: pytest -q tests/test_external_evidence_8i_decision_extension_contract.py

      - name: Guard Phase 8I-B binding boundary
        run: pytest -q tests/test_external_evidence_8i_promotion_provenance_binding.py

      - name: Guard Phase 8I-C aggregation boundary
        run: pytest -q tests/test_external_evidence_8i_external_aggregation.py

      - name: Validate Phase 8I-D direction preregistration
        run: pytest -q tests/test_external_evidence_8i_component_direction.py

      - name: Prove current fail-closed state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.external_evidence.component_direction_8i import current_direction_status

          contract = json.loads(Path("configs/external_evidence_8i_component_direction_state_engine_v1.json").read_text())
          binding = json.loads(Path("configs/external_evidence_8i_promotion_provenance_binding_v1.json").read_text())
          aggregation = json.loads(Path("configs/external_evidence_8i_external_aggregation_design_v1.json").read_text())
          state = current_direction_status(contract, binding, aggregation)
          assert state["state"] == "BLOCKED_BY_8I_B_UPSTREAM_SOURCE_IDENTITY_CONTRACT"
          assert state["real_bound_component_ids"] == []
          assert state["real_bound_component_direction_generation_authorized"] is False
          assert state["external_direction_state"] == "INSUFFICIENT_EXTERNAL"
          assert state["external_evidence_state"] == "INSUFFICIENT_EXTERNAL"
          assert state["decision_effect"] == "NO_CHANGE_TO_PHASE7_DECISION"
          assert state["external_decision_influence_enabled"] is False
          assert state["extended_reliability_enabled"] is False
          assert state["extended_stance_enabled"] is False
          assert state["portfolio_action_change_authorized"] is False
          assert state["orders_or_trades_authorized"] is False
          print("8I-D current fail-closed invariant verified")
          PY

      - name: Guard real direction and decision activation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("configs/external_evidence_8i_component_direction_state_engine_v1.json").read_text())
          assert contract["scope"]["real_bound_component_direction_generation_enabled_now"] is False
          assert contract["productive_integration_enabled"] is False
          assert contract["phase7_mutation_enabled"] is False
          assert contract["extended_reliability_enabled"] is False
          assert contract["extended_stance_enabled"] is False
          assert contract["portfolio_action_change_enabled"] is False
          assert contract["orders_or_trades_enabled"] is False
          assert contract["real_decision_outcome_read_allowed"] is False
          assert contract["direction_adapter"]["zero_deadband"] is None
          assert contract["direction_adapter"]["absolute_or_relative_threshold"] is None
          print("8I-D real direction and decision boundaries remain closed")
          PY

      - name: Guard production namespace
        run: |
          set -euo pipefail
          refs=$(grep -R -l --exclude-dir=research \
            -e "external_evidence_8i_component_direction_state_engine_v1" \
            -e "component_direction_8i" \
            src/scanner 2>/dev/null || true)
          if [ -n "$refs" ]; then
            echo "8I-D referenced outside research namespace:"
            echo "$refs"
            exit 1
          fi
          echo "No production-facing 8I-D references found."
