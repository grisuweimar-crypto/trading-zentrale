name: CYCLE-DIR CY-03 Prospective History
on:
  pull_request:
    paths:
      - "src/scanner/reports/cycle_history.py"
      - "scripts/record_cycle_history.py"
      - "tests/test_cycle_history_cy03.py"
      - ".github/workflows/run_scanner.yml"
      - ".github/workflows/cycle_dir_cy03.yml"
      - "docs/cycle_direction/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cy03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src/scanner scripts/record_cycle_history.py
      - name: CY-03 and adjacent regression suites
        run: |
          python -m pytest -q \
            tests/test_cycle_history_cy03.py \
            tests/test_cycle_audit_cy02.py \
            tests/test_cycle_oscillator_cy02.py \
            tests/test_cycle_quality_cy01.py \
            tests/test_research_views.py \
            tests/test_daily_research.py \
            tests/test_history_delta_completion.py \
            tests/pattern_discovery/test_l2_feature_library.py \
            tests/pattern_discovery/test_l3_search_engine.py
      - name: Read-only dry-run against published real snapshot
        run: python scripts/record_cycle_history.py --dry-run
