name: CY-03 client vintage evidence audit
on:
  pull_request:
    paths:
      - "scripts/audit_cycle_client_vintage.py"
      - "tests/test_cycle_client_vintage.py"
      - ".github/workflows/cycle_client_vintage_audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_cycle_client_vintage.py
      - run: python scripts/audit_cycle_client_vintage.py --output /tmp/client-vintage.json
      - uses: actions/upload-artifact@v4
        with:
          name: client-vintage-evidence
          path: /tmp/client-vintage.json
          retention-days: 30
