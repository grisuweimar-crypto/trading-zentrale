name: QM-B Historical Taxonomy Integrity

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/qm_b_historical_taxonomy_*"
      - "configs/qm_b_historical_taxonomy_*"
      - "docs/qm_b_historical_taxonomy_*"
      - "tests/test_qm_b_historical_taxonomy_*"
      - ".github/workflows/qm_b_historical_taxonomy_integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b-historical-taxonomy-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run taxonomy integrity unit tests
        run: PYTHONPATH=src python -m pytest -q tests/test_qm_b_historical_taxonomy_integrity.py
      - name: Scan taxonomy/historical co-occurrence candidates
        run: python scripts/qm_b_historical_taxonomy_scan.py --output /tmp/qm_b_historical_taxonomy_scan.json
      - name: Enforce frozen dispositions
        run: |
          PYTHONPATH=src python scripts/qm_b_historical_taxonomy_integrity.py \
            --scan /tmp/qm_b_historical_taxonomy_scan.json \
            --output /tmp/qm_b_historical_taxonomy_integrity.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qm_b_historical_taxonomy_integrity.json'))
          assert p['gate_status'] == 'PASS'
          assert p['candidate_count'] == p['safe_count']
          assert p['unreviewed_candidates'] == []
          assert p['review_required'] == []
          assert p['confirmed_current_taxonomy_dependencies'] == []
          assert p['confirmed_current_metadata_retrojections'] == []
          assert p['historical_retrojection_permitted'] is False
          print(json.dumps(p, indent=2, sort_keys=True))
          PY
