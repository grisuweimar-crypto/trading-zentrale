name: Phase 8E Structured Events and News

on:
  pull_request:
    paths:
      - "configs/external_evidence_8e_structured_events_v1.json"
      - "configs/external_evidence_8e_completion_v1.json"
      - "configs/external_evidence_8e_fda_approval_v1.json"
      - "configs/external_evidence_8e_doj_antitrust_rss_v1.json"
      - "configs/external_evidence_8e_news_discovery_v1.json"
      - "configs/external_evidence_8e_primary_release_v1.json"
      - "src/scanner/research/external_evidence/structured_events_8e.py"
      - "src/scanner/research/external_evidence/structured_events_8e_phase8c_adapter.py"
      - "src/scanner/research/external_evidence/fda_drugsatfda_8e.py"
      - "src/scanner/research/external_evidence/doj_antitrust_rss_8e.py"
      - "src/scanner/research/external_evidence/news_discovery_8e.py"
      - "src/scanner/research/external_evidence/primary_release_8e.py"
      - "src/scanner/research/external_evidence/structured_events_8e_completion.py"
      - "scripts/run_external_evidence_8e_event_ledger.py"
      - "scripts/run_external_evidence_8e_phase8c_reuse.py"
      - "scripts/import_external_evidence_8e_fda_drugsatfda.py"
      - "scripts/import_external_evidence_8e_doj_antitrust_rss.py"
      - "scripts/import_external_evidence_8e_news_discovery.py"
      - "scripts/import_external_evidence_8e_primary_release.py"
      - "scripts/run_external_evidence_8e_completion_gate.py"
      - "tests/test_external_evidence_8e_structured_events.py"
      - "tests/test_external_evidence_8e_phase8c_adapter.py"
      - "tests/test_external_evidence_8e_fda_drugsatfda.py"
      - "tests/test_external_evidence_8e_doj_antitrust_rss.py"
      - "tests/test_external_evidence_8e_news_discovery.py"
      - "tests/test_external_evidence_8e_primary_release.py"
      - "tests/test_external_evidence_8e_completion.py"
      - "docs/external_evidence_8e_structured_events.md"
      - "docs/external_evidence_8e_completion.md"
      - ".github/workflows/external_evidence_8e_structured_events.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate Phase 8E source hierarchy, PIT adapters, discovery boundary and completion gate
        run: >-
          python -m pytest -q
          tests/test_external_evidence_8e_structured_events.py
          tests/test_external_evidence_8e_phase8c_adapter.py
          tests/test_external_evidence_8e_fda_drugsatfda.py
          tests/test_external_evidence_8e_doj_antitrust_rss.py
          tests/test_external_evidence_8e_news_discovery.py
          tests/test_external_evidence_8e_primary_release.py
          tests/test_external_evidence_8e_completion.py
      - name: Verify Phase 8E CLIs
        run: |
          python scripts/run_external_evidence_8e_event_ledger.py --help
          python scripts/run_external_evidence_8e_phase8c_reuse.py --help
          python scripts/import_external_evidence_8e_fda_drugsatfda.py --help
          python scripts/import_external_evidence_8e_doj_antitrust_rss.py --help
          python scripts/import_external_evidence_8e_news_discovery.py --help
          python scripts/import_external_evidence_8e_primary_release.py --help
          python scripts/run_external_evidence_8e_completion_gate.py --help
      - name: Validate frozen Phase 8E completion contract
        run: python scripts/run_external_evidence_8e_completion_gate.py --output /tmp/external_evidence_8e_completion.json

# CI intentionally performs no live SEC/FDA/FTC/DOJ/news requests.
# Current-source snapshots are acquired outside CI and then imported with explicit ingested_at.
# Historical publication dates never backdate valid_from unless independently proven.
# Generic sentiment, market outcomes, Phase-7 integration and production enablement remain disabled.
