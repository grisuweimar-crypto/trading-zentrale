name: W11 Real End-to-End Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/decision_watch_w11.yml'
      - 'scripts/run_depot_watch_e2e_w11.py'
      - 'src/scanner/research/decision_layer/w11_end_to_end.py'
      - 'tests/test_w11_end_to_end_acceptance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run W11 acceptance regressions
        run: >-
          pytest -q
          tests/test_w11_end_to_end_acceptance.py
          tests/test_w10_snapshot_orchestration.py
          tests/test_decision_depot_watch_orchestration.py
          tests/test_decision_depot_watch_7h.py

      - name: Confirm real W11 run remains private and fail-closed
        run: |
          python scripts/run_depot_watch_e2e_w11.py --help >/dev/null
          test ! -e artifacts/research/w11_acceptance_receipt.json
          test ! -e artifacts/research/depot_watch_7h.json
