name: BA-QM10 Production Operations QM
# QM-2 verification trigger: workflow semantics unchanged.

on:
  pull_request:
    paths:
      - "configs/ba_qm10_production_operations_qm_v1.json"
      - "src/scanner/research/governance/ba_qm10_production_operations.py"
      - "tests/test_ba_qm10_production_operations.py"
      - ".github/workflows/ba_qm10_production_operations.yml"
      - ".github/workflows/run_scanner.yml"
      - ".github/workflows/probability_calibration_2.yml"
      - ".github/workflows/decision_watch_pipeline.yml"
      - ".github/workflows/decision_watch_runtime.yml"
      - ".github/workflows/decision_watch_symbol_views.yml"
      - "scripts/autorun_state.py"
      - "scripts/check_publication_base.py"
      - "scripts/check_decision_watch_readiness.py"
      - "tests/test_publication_base_guard.py"
      - "tests/test_decision_watch_readiness_gate.py"
      - "src/scanner/research/decision_layer/watch_runtime.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ba-qm10-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run BA-QM10 operations audit and operational regressions
        run: |
          python -m pytest -q             tests/test_ba_qm10_production_operations.py             tests/test_autorun_state.py             tests/test_publication_base_guard.py             tests/test_decision_watch_readiness_gate.py             tests/test_watch_runtime_transport.py             tests/test_w10_snapshot_orchestration.py             tests/test_w10_scanner_publication_identity.py             tests/test_ba_qm8_end_to_end.py             tests/test_ba_qm9_end_application_audit.py

      - name: Emit current BA-QM10 operations receipt
        run: |
          python - <<'PY'
          from scanner.research.decision_layer.watch_runtime import SHARD_IDS
          from scanner.research.governance.ba_qm10_production_operations import (
              EXPECTED_CHECKS,
              EXPECTED_FINDINGS,
              audit_current_operations,
              audit_current_runtime_capacity,
              evaluate_ba_qm10_closure,
              load_contract,
          )

          contract = load_contract()
          assert contract["status"] == "COMPLETE"
          assert contract["engineering_status"] == "COMPLETE"
          assert contract["closure_claimed"] is True
          assert contract["scope"] == "QUALITY_MANAGEMENT_ONLY"
          assert tuple(contract["required_checks"]) == EXPECTED_CHECKS
          assert tuple(row["finding_id"] for row in contract["findings"]) == EXPECTED_FINDINGS

          result = audit_current_operations()
          assert result["status"] == "BA_QM10_ENGINEERING_COMPLETE"
          assert result["required_check_count"] == 13
          assert result["all_required_checks_passed"] is True
          assert result["all_required_guards_passed"] is True
          assert result["open_finding_count"] == 0
          assert result["implemented_capa_pending_verification_count"] == 0
          assert result["open_static_risk_count"] == 0
          assert result["runtime_matches_current_snapshot"] is True
          assert result["symbol_views_match_current_snapshot"] is True
          assert result["symbol_views_runtime_projection_matches"] is True
          assert result["false_decision_observed"] is False
          assert result["all_observed_failures_fail_closed"] is True
          assert result["lag1_evidence_impact"] == "PROMOTION_BLOCKED"
          assert result["ba_qm10_may_release_lag1_block"] is False
          assert result["closure_eligible"] is True
          capacity = audit_current_runtime_capacity()
          assert capacity["status"] == "PASS"
          assert capacity["health_status"] == "PASS"
          assert capacity["headroom_ratio"] >= 0.20
          assert capacity["capacity_review_recommended"] is False
          assert capacity["configured_shard_count"] == len(SHARD_IDS)
          assert capacity["shard_count"] == capacity["configured_shard_count"]
          assert capacity["max_shard_bytes"] < capacity["hard_limit_bytes"] == 2_000_000
          assert capacity["decision_logic_changed"] is False
          assert capacity["writes_performed"] is False
          closure = evaluate_ba_qm10_closure()
          assert closure["status"] == "BA_QM10_ENGINEERING_COMPLETE"
          assert closure["required_check_count"] == 13
          assert closure["all_required_checks_passed"] is True
          assert closure["all_required_guards_passed"] is True
          assert closure["open_finding_count"] == 0
          assert closure["open_static_risk_count"] == 0
          assert closure["runtime_shard_count"] == len(SHARD_IDS)
          assert closure["runtime_max_shard_bytes"] < closure["runtime_hard_limit_bytes"] == 2_000_000
          assert closure["engineering_closure_performed"] is True
          assert closure["lag1_evidence_impact"] == "PROMOTION_BLOCKED"
          assert closure["ba_qm10_may_release_lag1_block"] is False
          assert closure["next_mandatory_work_package"] == "BA-QM11 – Gesamtsystem-Audit"
          print(result)
          print(capacity)
          print(closure)
          PY
