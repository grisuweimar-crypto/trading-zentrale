name: Add Energy Fuels UUUU once

on:
  push:
    paths:
      - '.github/workflows/add_uuuu_once.yml'

permissions:
  contents: write

jobs:
  add-uuuu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add UUUU to universe master if missing
        shell: bash
        run: |
          set -euo pipefail
          FILE="data/inputs/universe_master.csv"
          if grep -q '^1,UUUU,' "$FILE"; then
            echo "UUUU already present; nothing to do."
            exit 0
          fi
          printf '%s\n' '1,UUUU,Energy Fuels Inc.,CA2926717083,stock,Energie,Energy,Uranium,Canada,USD,S3 Energie,pillar,82.0,manual addition via ChatGPT,"energy, grid, electrification"' >> "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Add Energy Fuels (UUUU) to scanner universe"
          git push origin HEAD:main
