name: QM-B Listing Metadata Evidence

on:
  pull_request:
    paths:
      - "configs/qm_b_listing_metadata_sources_v1.json"
      - "src/scanner/research/governance/qm_b_listing_metadata_evidence.py"
      - "scripts/qm_b_listing_metadata_evidence.py"
      - "tests/test_qm_b_listing_metadata_evidence.py"
      - "docs/qm_b_listing_metadata_sources.md"
      - ".github/workflows/qm_b_listing_metadata_evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b-listing-metadata-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run listing metadata evidence tests
        run: |
          PYTHONPATH=src python -m pytest -q tests/test_qm_b_listing_metadata_evidence.py
      - name: Materialize source assessment
        run: |
          PYTHONPATH=src python scripts/qm_b_listing_metadata_evidence.py \
            --output /tmp/qm_b_listing_metadata_source_assessment.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/qm_b_listing_metadata_source_assessment.json', encoding='utf-8'))
          summary = {
              'source_count': p['source_count'],
              'source_class_counts': p['source_class_counts'],
              'pit_status_counts': p['pit_status_counts'],
              'access_status_counts': p['access_status_counts'],
              'license_status_counts': p['license_status_counts'],
              'blocked_required_fields': p['blocked_required_fields'],
              'strict_listing_ledger_ready': p['strict_listing_ledger_ready'],
              'prospective_collection_sources': p['prospective_collection_sources'],
              'event_date_challenger_sources': p['event_date_challenger_sources'],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert p['source_count'] == 7
          assert p['blocked_required_fields'] == ['venue_assignment', 'listing_start', 'listing_end']
          assert p['strict_listing_ledger_ready'] is False
          assert p['global_strict_listing_source_available_and_cleared'] is False
          assert p['prospective_collection_sources'] == ['nasdaq_symbol_directory']
          assert p['event_date_challenger_sources'] == ['eodhd_exchange_symbol_delisted', 'fmp_delisted_companies']
          assert all(not values for values in p['strict_ready_sources_by_field'].values())
          assert p['project_investability_requires_separate_project_rule'] is True
          print('QM-B listing metadata source gate passed; retrospective strict promotion remains blocked.')
          PY
