name: Repair Phase 2 positive support fixture

on:
  push:
    branches: [phase2-uncertainty-hotfix]
    paths:
      - '.github/workflows/fix_phase2_positive_test_v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase2-uncertainty-hotfix
      - name: Expand positive support fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_probability_calibration.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('dates = pd.bdate_range("2026-05-01", periods=10)', 'dates = pd.bdate_range("2026-05-01", periods=20)'),
              ('"symbol": [f"S{i}" for i in range(20)]', '"symbol": [f"S{i}" for i in range(40)]'),
              ('"peer_excess_5t": [-0.2, 0.1] * 10', '"peer_excess_5t": [-0.2, 0.1] * 20'),
              ('assert out["bootstrap_block_count"] == 10', 'assert out["bootstrap_block_count"] == 20\n    assert out["bootstrap_occurrence_block_count"] >= 2'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected test text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          for helper in (
              '.github/workflows/fix_phase2_positive_test.yml',
              '.github/workflows/fix_phase2_positive_test_v2.yml',
          ):
              Path(helper).unlink(missing_ok=True)
          PY
      - name: Commit fix
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          git commit -m "Fix Phase 2 positive moving-block fixture"
          git push origin HEAD:phase2-uncertainty-hotfix
