name: QM-B Execution Channel Evidence

on:
  pull_request:
    paths:
      - "configs/qm_b_execution_channel_v1.json"
      - "src/scanner/research/governance/qm_b_execution_channel.py"
      - "scripts/qm_b_execution_channel.py"
      - "tests/test_qm_b_execution_channel.py"
      - "docs/qm_b_execution_channel.md"
      - ".github/workflows/qm_b_execution_channel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b-execution-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run execution-channel tests
        run: PYTHONPATH=src python -m pytest -q tests/test_qm_b_execution_channel.py
      - name: Audit current durable membership without execution-channel evidence
        run: |
          MEMBERSHIP="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/research/qm/qm_b_membership/latest.json').read_text())
          print(p['normalized_snapshot_path'])
          PY
          )"
          AS_OF="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('artifacts/research/qm/qm_b_membership/latest.json').read_text())['observed_at'])
          PY
          )"
          PYTHONPATH=src python scripts/qm_b_execution_channel.py \
            --membership "$MEMBERSHIP" \
            --as-of "$AS_OF" \
            --output /tmp/qm_b_execution_gap.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qm_b_execution_gap.json'))
          from pathlib import Path
          latest=json.loads(Path('artifacts/research/qm/qm_b_membership/latest.json').read_text(encoding='utf-8'))
          membership=json.loads(Path(latest['normalized_snapshot_path']).read_text(encoding='utf-8'))
          expected=len(membership['claims'])
          assert expected==membership['stable_instrument_claim_count']
          assert p['instrument_count']==expected
          assert p['status_counts']=={'UNKNOWN':expected}
          assert p['registered_channel_count']==0
          assert p['current_gap_status']=='BLOCKED_NO_EXECUTION_CHANNEL_EVIDENCE'
          print(json.dumps({
            'instrument_count':p['instrument_count'],
            'status_counts':p['status_counts'],
            'registered_channel_count':p['registered_channel_count'],
            'current_gap_status':p['current_gap_status'],
          },indent=2,sort_keys=True))
          PY
