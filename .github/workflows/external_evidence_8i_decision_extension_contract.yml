name: Phase 8I-A Decision Extension Contract

on:
  workflow_dispatch:
  push:
    paths:
      - "configs/external_evidence_8i_decision_extension_contract_v1.json"
      - "docs/external_evidence_8i_decision_extension_contract.md"
      - "tests/test_external_evidence_8i_decision_extension_contract.py"
      - ".github/workflows/external_evidence_8i_decision_extension_contract.yml"
      - "configs/decision_layer_input_contract_v1.json"
      - "configs/decision_universal_stance_v1.json"
      - "configs/decision_reliability_explainability_v1.json"
      - "configs/decision_state_transition_v1.json"
      - "configs/decision_portfolio_action_v1.json"
      - "configs/decision_validation_promotion_v1.json"
      - "configs/decision_research_dataset_v1.json"
      - "configs/external_evidence_8_contract_v1.json"
      - "configs/external_conflict_matrix_v1.json"
      - "configs/external_evidence_8g_research_contract_v1.json"
      - "configs/external_evidence_8g_promotion_review_v1.json"
      - "configs/external_evidence_8h_interaction_research_contract_v1.json"
      - "configs/external_evidence_8h_interaction_promotion_review_v1.json"
  pull_request:
    paths:
      - "configs/external_evidence_8i_decision_extension_contract_v1.json"
      - "docs/external_evidence_8i_decision_extension_contract.md"
      - "tests/test_external_evidence_8i_decision_extension_contract.py"
      - ".github/workflows/external_evidence_8i_decision_extension_contract.yml"
      - "configs/decision_layer_input_contract_v1.json"
      - "configs/decision_universal_stance_v1.json"
      - "configs/decision_reliability_explainability_v1.json"
      - "configs/decision_state_transition_v1.json"
      - "configs/decision_portfolio_action_v1.json"
      - "configs/decision_validation_promotion_v1.json"
      - "configs/decision_research_dataset_v1.json"
      - "configs/external_evidence_8_contract_v1.json"
      - "configs/external_conflict_matrix_v1.json"
      - "configs/external_evidence_8g_research_contract_v1.json"
      - "configs/external_evidence_8g_promotion_review_v1.json"
      - "configs/external_evidence_8h_interaction_research_contract_v1.json"
      - "configs/external_evidence_8h_interaction_promotion_review_v1.json"

permissions:
  contents: read

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Guard frozen Phase-7 decision boundaries
        run: |
          pytest -q \
            tests/test_decision_layer_input_contract.py \
            tests/test_decision_universal_stance_7d.py \
            tests/test_decision_reliability_explainability_7g.py \
            tests/test_decision_portfolio_action_7f.py \
            tests/test_decision_validation_promotion_7i.py

      - name: Guard upstream 8G and 8H promotion scopes
        run: |
          pytest -q \
            tests/test_external_evidence_8g_promotion_review.py \
            tests/test_external_evidence_8h_interaction_research_contract.py \
            tests/test_external_evidence_8h_interaction_promotion.py

      - name: Validate Phase 8I-A contract
        run: pytest -q tests/test_external_evidence_8i_decision_extension_contract.py

      - name: Prove current fail-closed state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("configs/external_evidence_8i_decision_extension_contract_v1.json").read_text())
          state = contract["current_empirical_entry_state"]
          assert state["state"] == "NO_PROMOTED_EXTERNAL_EVIDENCE"
          assert state["external_evidence_state"] == "INSUFFICIENT_EXTERNAL"
          assert state["decision_effect"] == "NO_CHANGE_TO_PHASE7_DECISION"
          assert state["decision_active_8g_main_effect_ids"] == []
          assert state["decision_active_8h_interaction_ids"] == []
          assert contract["productive_integration_enabled"] is False
          assert contract["portfolio_action_change_enabled"] is False
          assert contract["orders_or_trades_enabled"] is False
          print("8I-A fail-closed invariant verified")
          PY

      - name: Guard production boundary
        run: |
          set -euo pipefail
          refs=$(grep -R -l --exclude-dir=research \
            "external_evidence_8i_decision_extension_contract_v1" src/scanner 2>/dev/null || true)
          if [ -n "$refs" ]; then
            echo "8I-A contract referenced outside research namespace:"
            echo "$refs"
            exit 1
          fi
          echo "No production-facing 8I-A contract references found."
