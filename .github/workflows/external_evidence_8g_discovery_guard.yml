name: Phase 8G-D Discovery Guard

on:
  push:
    branches:
      - phase8g-incremental-evidence-research
    paths:
      - "configs/external_evidence_8g_research_contract_v1.json"
      - "configs/external_evidence_8g_challenger_specs_v1.json"
      - "configs/external_evidence_8g_split_plan_v1.json"
      - "configs/external_evidence_8g_model_construction_v1.json"
      - "configs/external_evidence_8g_discovery_protocol_v1.json"
      - "artifacts/research/external_evidence_8g_split_manifest_v1.json"
      - "src/scanner/research/external_evidence/research_8g.py"
      - "src/scanner/research/external_evidence/research_8g_binding_guard.py"
      - "src/scanner/research/external_evidence/model_8g.py"
      - "src/scanner/research/external_evidence/discovery_8g.py"
      - "tests/test_external_evidence_8g_research_contract.py"
      - "tests/test_external_evidence_8g_challenger_freeze.py"
      - "tests/test_external_evidence_8g_binding_guard.py"
      - "tests/test_external_evidence_8g_model_construction.py"
      - "tests/test_external_evidence_8g_discovery_guard.py"
      - ".github/workflows/external_evidence_8g_discovery_guard.yml"
  pull_request:
    paths:
      - "configs/external_evidence_8g_research_contract_v1.json"
      - "configs/external_evidence_8g_challenger_specs_v1.json"
      - "configs/external_evidence_8g_split_plan_v1.json"
      - "configs/external_evidence_8g_model_construction_v1.json"
      - "configs/external_evidence_8g_discovery_protocol_v1.json"
      - "artifacts/research/external_evidence_8g_split_manifest_v1.json"
      - "src/scanner/research/external_evidence/research_8g.py"
      - "src/scanner/research/external_evidence/research_8g_binding_guard.py"
      - "src/scanner/research/external_evidence/model_8g.py"
      - "src/scanner/research/external_evidence/discovery_8g.py"
      - "tests/test_external_evidence_8g_research_contract.py"
      - "tests/test_external_evidence_8g_challenger_freeze.py"
      - "tests/test_external_evidence_8g_binding_guard.py"
      - "tests/test_external_evidence_8g_model_construction.py"
      - "tests/test_external_evidence_8g_discovery_guard.py"
      - ".github/workflows/external_evidence_8g_discovery_guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Re-verify Phase 8G-A through 8G-C contracts
        run: >-
          python -m pytest -q
          tests/test_external_evidence_8g_research_contract.py
          tests/test_external_evidence_8g_challenger_freeze.py
          tests/test_external_evidence_8g_binding_guard.py
          tests/test_external_evidence_8g_model_construction.py

      - name: Validate Phase 8G-D Discovery-only outcome gates
        run: python -m pytest -q tests/test_external_evidence_8g_discovery_guard.py

# 8G-D may open only matured, usable DISCOVERY peer-excess labels.
# Validation and Holdout remain sealed.
# Reserved split-boundary buffer slots remain sealed.
# Exact split-boundary purge is structural and must pass before label values are read.
# The 8G-B/C frozen feature/search space is not reopened in Discovery.
# Ridge coefficient directions may be learned from Discovery only; sign flips, thresholds,
# transforms, hyperparameter search and cross-factor interactions remain forbidden.
# No Phase-7 production integration or automatic Phase-8H promotion is enabled here.
