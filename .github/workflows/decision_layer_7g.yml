name: Phase 7G Reliability and Explainability

on:
  pull_request:
    paths:
      - "configs/decision_reliability_explainability_v1.json"
      - "src/scanner/research/decision_layer/**"
      - "tests/test_decision_reliability_explainability_7g.py"
      - "tests/test_decision_portfolio_action_7f.py"
      - "tests/test_decision_state_transitions_7e.py"
      - "tests/test_decision_universal_stance_7d.py"
      - "tests/test_decision_layer_input_contract.py"
      - "scripts/run_reliability_explainability_7g.py"
      - "docs/decision_layer_7g.md"
      - ".github/workflows/decision_layer_7g.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 7A 7D 7E 7F and 7G regression tests
        run: >-
          pytest -q
          tests/test_decision_layer_input_contract.py
          tests/test_decision_universal_stance_7d.py
          tests/test_decision_state_transitions_7e.py
          tests/test_decision_portfolio_action_7f.py
          tests/test_decision_reliability_explainability_7g.py
      - name: Smoke-test 7G CLI
        run: python scripts/run_reliability_explainability_7g.py --help
