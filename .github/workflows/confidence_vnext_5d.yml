name: Phase 5D Walk-forward Evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/confidence_vnext_5d.yml'
      - 'docs/confidence_vnext_5d.md'
      - 'scripts/run_confidence_vnext_walkforward_5d.py'
      - 'src/scanner/reports/confidence_vnext_walkforward_v2.py'
      - 'tests/test_confidence_vnext_walkforward_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Non-PR runs share the complete Phase-4E/5B/5C shadow transaction lock.
# The archive is read, evaluated and published while holding one lock so a
# concurrent catch-up cannot overwrite a newer append-only 5D evaluation chain.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('phase5d-pr-{0}', github.event.pull_request.number) || 'phase4e-shadow-publication' }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      shadow_available: ${{ steps.restore.outputs.shadow_available }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Verify Phase 5D PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          allowed = {
              '.github/workflows/confidence_vnext_5d.yml',
              'docs/confidence_vnext_5d.md',
              'scripts/run_confidence_vnext_walkforward_5d.py',
              'src/scanner/reports/confidence_vnext_walkforward_v2.py',
              'tests/test_confidence_vnext_walkforward_v2.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BASE_SHA'], os.environ['HEAD_SHA']],
              text=True,
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected Phase 5D paths: {unexpected}')
          if not changed:
              raise SystemExit('Phase 5D PR has no changed files')
          print('Phase 5D scope ok:', sorted(changed))
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Phase 5D and inherited contract tests
        run: |
          python -m pytest -q \
            tests/test_confidence_vnext_walkforward_v2.py \
            tests/test_confidence_vnext_progressive.py \
            tests/test_confidence_vnext_prospective_v2.py \
            tests/test_confidence_vnext_frozen_baseline.py \
            tests/test_confidence_vnext_walkforward.py

      - name: Restore prospective evidence, 5C versions and existing 5D archive
        id: restore
        run: |
          git fetch origin phase4e-shadow-data:refs/remotes/origin/phase4e-shadow-data --force || true
          SHADOW_AVAILABLE=false
          if git show-ref --verify --quiet refs/remotes/origin/phase4e-shadow-data; then
            for path in \
              artifacts/research/confidence_vnext_shadow_claims_5b_v2.csv \
              artifacts/research/confidence_vnext_shadow_outcomes_5b_v2.csv \
              artifacts/research/confidence_vnext_model_versions_5c.jsonl \
              artifacts/research/confidence_vnext_walkforward_evaluations_5d.jsonl \
              artifacts/research/confidence_vnext_walkforward_5d.json
            do
              if git cat-file -e "origin/phase4e-shadow-data:$path" 2>/dev/null; then
                mkdir -p "$(dirname "$path")"
                git show "origin/phase4e-shadow-data:$path" > "$path"
              else
                rm -f "$path"
              fi
            done
            if git cat-file -e "origin/phase4e-shadow-data:artifacts/research/confidence_vnext_shadow_claims_5b_v2.csv" 2>/dev/null; then
              SHADOW_AVAILABLE=true
            fi
          fi
          echo "shadow_available=$SHADOW_AVAILABLE" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from scanner.reports.confidence_vnext_prospective_v2 import CLAIM_COLUMNS_V2, OUTCOME_COLUMNS_V2

          for path, columns in (
              (Path('artifacts/research/confidence_vnext_shadow_claims_5b_v2.csv'), CLAIM_COLUMNS_V2),
              (Path('artifacts/research/confidence_vnext_shadow_outcomes_5b_v2.csv'), OUTCOME_COLUMNS_V2),
          ):
              if not path.exists() or path.stat().st_size == 0:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  pd.DataFrame(columns=columns).to_csv(path, index=False)
          PY

      - name: Run prospective walk-forward evaluator
        run: |
          python scripts/run_confidence_vnext_walkforward_5d.py

      - name: Validate Phase 5D fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/research/confidence_vnext_walkforward_5d.json').read_text(encoding='utf-8'))
          assert report['phase'] == '5D_walkforward_evaluation'
          assert report['schema_version'] == 'phase5d_walkforward_evaluation_v1'
          assert report['status'] in {'awaiting_phase5c_candidate_versions', 'walkforward_evaluation_active'}
          assert set(report['horizons']) == {'5', '20', '40', '60'}
          assert report['promotion']['status'] == 'insufficient_evidence'
          semantics = report['semantics']
          assert semantics['research_only'] is True
          assert semantics['strictly_future_claims_only'] is True
          assert semantics['same_version_training_rows_reused_for_evaluation'] is False
          assert semantics['finalized_epoch_boundary_is_next_same_horizon_training_cutoff'] is True
          assert semantics['epoch_boundary_selected_from_performance'] is False
          assert semantics['latest_version_evaluation_is_provisional'] is True
          assert semantics['provisional_counts_as_promotion_evidence'] is False
          assert semantics['shorter_horizon_labels_borrowed'] is False
          assert semantics['overlapping_forward_windows_treated_as_independent'] is False
          assert semantics['state_names_assumed_ordinal'] is False
          assert semantics['scalar_confidence_created'] is False
          assert semantics['adaptive_production_weights_created'] is False
          assert semantics['production_confidence_changed'] is False
          assert semantics['portfolio_or_depot_watch_changed'] is False
          assert semantics['evaluation_archive_hash_chained'] is True
          print('Phase 5D contract validated:', report['status'], report['new_finalized_evaluations'])
          PY

      - name: Upload Phase 5D diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-walkforward-diagnostics
          path: |
            artifacts/research/confidence_vnext_walkforward_5d.json
            artifacts/research/confidence_vnext_walkforward_evaluations_5d.jsonl
          if-no-files-found: error

      - name: Stage isolated Phase 5D publication
        if: github.event_name != 'pull_request' && steps.restore.outputs.shadow_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-walkforward-publication
          path: |
            artifacts/research/confidence_vnext_walkforward_5d.json
            artifacts/research/confidence_vnext_walkforward_evaluations_5d.jsonl
          if-no-files-found: error

  publish:
    needs: analyze
    if: needs.analyze.result == 'success' && needs.analyze.outputs.shadow_available == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout shadow branch seed
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare isolated shadow branch
        run: |
          git fetch origin phase4e-shadow-data:refs/remotes/origin/phase4e-shadow-data --force
          git checkout -B phase4e-shadow-data origin/phase4e-shadow-data

      - name: Restore Phase 5D payload
        uses: actions/download-artifact@v4
        with:
          name: phase5d-walkforward-publication
          path: artifacts/research

      - name: Publish Phase 5D without touching main, v2 claims/outcomes or 5C versions
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action Bot'
          git add \
            artifacts/research/confidence_vnext_walkforward_5d.json \
            artifacts/research/confidence_vnext_walkforward_evaluations_5d.jsonl
          if ! git diff --cached --quiet; then
            git commit -m '🧪 Phase 5D walk-forward evaluation update [skip ci]'
            git push origin HEAD:refs/heads/phase4e-shadow-data
          fi
