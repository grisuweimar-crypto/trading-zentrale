name: Pattern Discovery L0 Boundary

on:
  push:
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "tests/pattern_discovery/**"
      - "docs/pattern_discovery/**"
      - "artifacts/research/pattern_discovery/**"
      - "scripts/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l0.yml"
  pull_request:
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "tests/pattern_discovery/**"
      - "docs/pattern_discovery/**"
      - "artifacts/research/pattern_discovery/**"
      - "scripts/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l0.yml"
  workflow_dispatch:

jobs:
  l0-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Pattern Discovery L0 tests
        run: python -m pytest -q tests/pattern_discovery/test_l0_boundary.py
