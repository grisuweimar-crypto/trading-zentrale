name: Phase 7D Universal Stance

on:
  pull_request:
    paths:
      - "configs/decision_universal_stance_v1.json"
      - "src/scanner/research/decision_layer/**"
      - "tests/test_decision_universal_stance_7d.py"
      - "tests/test_decision_conflict_research_7c.py"
      - "tests/test_decision_layer_input_contract.py"
      - "scripts/run_universal_stance_7d.py"
      - "docs/decision_layer_7d.md"
      - ".github/workflows/decision_layer_7d.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 7A 7C and 7D regression tests
        run: >-
          pytest -q
          tests/test_decision_layer_input_contract.py
          tests/test_decision_conflict_research_7c.py
          tests/test_decision_universal_stance_7d.py
      - name: Smoke-test 7D CLI
        run: python scripts/run_universal_stance_7d.py --help
