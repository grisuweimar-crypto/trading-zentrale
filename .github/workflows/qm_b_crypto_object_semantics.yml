name: QM-B Crypto Object Semantics

on:
  pull_request:
    paths:
      - "configs/qm_b_crypto_object_semantics_v1.json"
      - "src/scanner/research/governance/qm_b_crypto_object_semantics.py"
      - "scripts/qm_b_crypto_object_semantics.py"
      - "tests/test_qm_b_crypto_object_semantics.py"
      - "docs/qm_b_crypto_object_semantics.md"
      - ".github/workflows/qm_b_crypto_object_semantics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b-crypto-object-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest -q tests/test_qm_b_crypto_object_semantics.py
      - name: Run frozen crypto semantics audit
        run: |
          PYTHONPATH=src python scripts/qm_b_crypto_object_semantics.py --output /tmp/qm_b_crypto_object_semantics.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qm_b_crypto_object_semantics.json'))
          assert p['audit_gate_status'] == 'PASS'
          assert p['remaining_identity_status'] == 'PARTIAL_BY_DESIGN'
          assert p['scanner_crypto_row_count'] > 0
          assert p['identifier_form_count'] > 0
          assert p['stable_asset_identity_promoted'] is False
          assert p['provider_instrument_identity_promoted'] is False
          assert p['quote_pair_equivalence_promoted'] is False
          assert p['membership_promoted'] is False
          assert p['listing_promoted'] is False
          assert p['tradability_promoted'] is False
          assert p['investability_promoted'] is False
          assert p['semantic_invariants']['internal_base_reference_is_quote_pair'] is False
          assert p['semantic_invariants']['quote_currency_is_semantically_material'] is True
          print(json.dumps({
              'rows': p['scanner_crypto_row_count'],
              'bases': p['base_count'],
              'identifier_forms': p['identifier_form_count'],
              'current_crypto_symbols': p['current_crypto_symbols'],
              'row_object_class_counts': p['row_object_class_counts'],
              'cross_class_bases': p['cross_class_bases'],
              'multiple_quote_bases': p['multiple_quote_bases'],
              'identifiers': p['identifiers'],
          }, indent=2, sort_keys=True))
          PY
