name: Closed daily bar research checks
on:
  pull_request:
    paths:
      - 'src/scanner/data/enrich/yahoo_prices.py'
      - 'tests/test_closed_daily_bar_gate.py'
      - 'tests/test_closed_daily_score_gate.py'
      - 'tests/test_closed_short_history.py'
      - 'tests/test_closed_bar_production_cutover.py'
      - 'tests/test_price_pipeline.py'
      - 'scripts/prefetch_market_history.py'
      - '.github/workflows/run_scanner.yml'
      - 'scripts/prefetch_closed_bar_inputs.py'
      - 'src/scanner/app/score_step.py'
      - '.github/workflows/closed_daily_bar_checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_closed_daily_bar_gate.py tests/test_closed_daily_score_gate.py tests/test_closed_short_history.py tests/test_closed_bar_production_cutover.py tests/test_price_pipeline.py -q
