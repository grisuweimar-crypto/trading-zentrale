name: Private ZERO Import and ARGUS Journal Tests
on:
  pull_request:
    paths:
      - 'scripts/import_zero_private_positions.py'
      - 'scripts/import_zero_private_ledger.py'
      - 'scripts/record_argus_private_decision.py'
      - 'src/scanner/research/decision_layer/private_decision_journal.py'
      - 'tests/test_import_zero_private_positions.py'
      - 'tests/test_import_zero_private_ledger.py'
      - 'tests/test_private_decision_journal.py'
      - 'tests/test_execution_quality.py'
      - 'src/scanner/research/decision_layer/execution_quality.py'
      - '.github/workflows/zero_private_research_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-private-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test private import, historical reconciliation and research journal
        run: |
          PYTHONPATH=. pytest -q tests/test_import_zero_private_positions.py tests/test_import_zero_private_ledger.py tests/test_private_decision_journal.py tests/test_execution_quality.py
