name: ARGUS Pattern Research – first registered L1-L4 discovery

on:
  pull_request:
    paths:
      - 'scripts/pattern_discovery/run_initial_real_discovery.py'
      - 'tests/pattern_discovery/test_initial_real_discovery.py'
      - '.github/workflows/pattern_discovery_initial_real.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/pattern_discovery/run_initial_real_discovery.py'
      - 'tests/pattern_discovery/test_initial_real_discovery.py'
      - '.github/workflows/pattern_discovery_initial_real.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: initial-pattern-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  initial-real-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing governed laboratory and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Test immutable upfront plan and source restrictions
        run: python -m pytest -q tests/pattern_discovery/test_initial_real_discovery.py
      - name: Execute preregistration, real discovery and negative controls
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/pattern_discovery/run_initial_real_discovery.py --dry-run | tee /tmp/initial_result.json
          else
            python scripts/pattern_discovery/run_initial_real_discovery.py | tee /tmp/initial_result.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("/tmp/initial_result.json").read_text())
          assert j["sources"]["research_rows"]>=1000
          assert j["sources"]["no_scanner_score_or_rank"] is True
          assert j["l3_counts"]["tested"]>=1
          assert j["l4_counts"]["l3_tested_candidates"]==j["l3_counts"]["tested"]
          assert j["l5_freeze_performed"] is False
          if j["l4_counts"]["eligible_for_l5"] == 0:
            assert j["l5_empty_closeout_performed"] is True
            assert j["l5_frozen_pattern_count"] == 0
          assert j["prospective_confirmation"] is False
          assert j["models_are_trade_signals"] is False
          print("L1-L4 real discovery complete; negative L4 rejections preserved")
          PY
      - name: Preserve initial evidence for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ARGUS-Initial-Pattern-Discovery-L1-L4
          path: |
            artifacts/research/pattern_discovery/discovery_runs/
            artifacts/research/pattern_discovery/inputs/
          retention-days: 30
      - name: Publish immutable L1-L4 and zero-candidate L5 evidence (without registry)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never rebase a speculative local L14 hash-chain event.
          # The registry is append-only and MUST be re-derived against latest main.
          git restore -- artifacts/research/pattern_discovery/operations/operations_registry.jsonl
          git add -A -- artifacts/research/pattern_discovery/discovery_runs/ artifacts/research/pattern_discovery/inputs/
          if ! git diff --cached --quiet; then
            git commit -m 'research(patterns): initial immutable discovery evidence [skip ci]'
            published=0
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                published=1
                break
              fi
              echo "Concurrent main change; retrying append-only evidence publication"
              sleep 2
            done
            test "$published" -eq 1
          fi
      - name: Recreate and publish L14 classification on current chain head
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          export ARGUS_RUN_ID="$(python -c 'import json;print(json.load(open("/tmp/initial_result.json"))["run_id"])')"
          export ARGUS_TRIGGER_HASH="$(python -c 'import json;print(json.load(open("/tmp/initial_result.json"))["l14_trigger_cycle_hash"])')"
          classified=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            # Recalculate event hash from the current operations ledger.
            # Never cherry-pick, rebase or force-push old hash-chain events.
            python scripts/pattern_discovery/run_l14_operations.py classify-run \
              --manifest "artifacts/research/pattern_discovery/discovery_runs/$ARGUS_RUN_ID/manifest.json" \
              --mode INITIAL \
              --trigger-cycle-hash "$ARGUS_TRIGGER_HASH" \
              --recorded-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --actor-id "github-actions-initial-research" \
              --actor-role research_automation \
              --repo-root .
            git add -- artifacts/research/pattern_discovery/operations/operations_registry.jsonl
            if git diff --cached --quiet; then
              classified=1
              break
            fi
            git commit -m 'research(patterns): classify initial run on fresh L14 hash chain [skip ci]'
            if git push origin HEAD:main; then
              classified=1
              break
            fi
            echo "L14 chain advanced concurrently, rebuilding event on fresh chain"
            sleep 2
          done
          test "$classified" -eq 1
          python scripts/pattern_discovery/run_initial_real_discovery.py --dry-run > /tmp/final_verified.json
          python - <<'PY'
          import json
          a=json.load(open("/tmp/initial_result.json"))
          b=json.load(open("/tmp/final_verified.json"))
          assert a["run_id"]==b["run_id"]
          assert b["l4_counts"]["eligible_for_l5"]==0
          print("ARGUS E2E: immutable discovery evidence and L14 chain classification verified")
          PY
