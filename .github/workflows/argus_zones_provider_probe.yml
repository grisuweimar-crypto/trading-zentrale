name: ARGUS zones provider coverage probe (read-only)
on:
  pull_request:
    paths:
      - 'scripts/probe_argus_zone_symbols.py'
      - '.github/workflows/argus_zones_provider_probe.yml'
  workflow_dispatch:
jobs:
  optional-market-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only market adapter dependencies
        run: python -m pip install pandas numpy "yfinance>=0.2.36,<1" requests
      - name: Request OHLCV for missing five-symbol research coverage
        env:
          PYTHONPATH: 'src:.'
        run: |
          python scripts/probe_argus_zone_symbols.py \
            --asof 2026-10-21 \
            --base-cache artifacts/market_data/yahoo_ohlcv.csv \
            --output-dir /tmp/argus-zones-provider
      - name: Publish source receipt and isolated research zones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-zones-provider-probe-2026-10-21
          path: /tmp/argus-zones-provider/*
          retention-days: 7
          if-no-files-found: warn
