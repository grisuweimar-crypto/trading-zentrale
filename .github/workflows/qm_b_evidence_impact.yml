name: QM-B Evidence Impact

on:
  pull_request:
    paths:
      - "configs/qm_b_evidence_impact_v1.json"
      - "src/scanner/research/governance/qm_b_evidence_impact.py"
      - "scripts/qm_b_evidence_impact.py"
      - "tests/test_qm_b_evidence_impact.py"
      - "docs/qm_b_evidence_impact.md"
      - "docs/qm_b_alias_listing_boundaries.md"
      - "docs/qm_b_survivorship_sample_audit.md"
      - "docs/qm_b_provider_outcome_availability.md"
      - "docs/qm_b_historical_taxonomy_integrity.md"
      - "docs/qm_b_crypto_object_semantics.md"
      - ".github/workflows/qm_b_evidence_impact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b-evidence-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run evidence-impact unit tests
        run: PYTHONPATH=src python -m pytest -q tests/test_qm_b_evidence_impact.py
      - name: Run evidence-impact gate
        run: |
          PYTHONPATH=src python scripts/qm_b_evidence_impact.py --output /tmp/qm_b_evidence_impact.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qm_b_evidence_impact.json'))
          assert p['audit_gate_status'] == 'PASS_WITH_SCOPED_RESTRICTIONS'
          assert p['source_document_count'] == 5
          assert p['global_research_invalidation_required'] is False
          assert p['phase1_selection_timing_invalidation_required'] is False
          assert p['daily_research_historical_matcher_revalidation_required'] is True
          assert p['strict_asof_backtest_claim_allowed'] is False
          assert p['crypto_cross_namespace_merge_allowed'] is False
          assert p['historical_observations_deleted_or_neutralized'] is False
          assert p['strict_qm_b_promotion_ready'] is False
          print(json.dumps({
              'impact_class_counts': p['impact_class_counts'],
              'global_research_invalidation_required': p['global_research_invalidation_required'],
              'phase1_selection_timing_invalidation_required': p['phase1_selection_timing_invalidation_required'],
              'daily_research_historical_matcher_revalidation_required': p['daily_research_historical_matcher_revalidation_required'],
              'strict_asof_backtest_claim_allowed': p['strict_asof_backtest_claim_allowed'],
              'strict_qm_b_promotion_ready': p['strict_qm_b_promotion_ready'],
          }, indent=2, sort_keys=True))
          PY
