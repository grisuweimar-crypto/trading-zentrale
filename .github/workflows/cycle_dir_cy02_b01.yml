name: CYCLE-DIR CY02-B01 Currency Lineage
on:
  pull_request:
    paths:
      - "data/inputs/universe_master.csv"
      - "tests/test_cycle_quote_currencies_cy02_b01.py"
      - "src/scanner/data/enrich/yahoo_prices.py"
      - "docs/cycle_direction/CY-02_B01_13_WAEHRUNGEN_2026-10-10.md"
      - ".github/workflows/cycle_dir_cy02_b01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  currency-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scanner/test requirements
        run: python -m pip install -e ".[test]"
      - name: Verify curated provider quote identifiers and PIT/cycle regressions
        run: |
          python -m pytest -q \
            tests/test_cycle_quote_currencies_cy02_b01.py \
            tests/test_cycle_oscillator_cy02.py \
            tests/test_cycle_audit_cy02.py \
            tests/test_cycle_quality_cy01.py \
            tests/test_daily_research.py \
            tests/test_research_views.py
      - name: Verify expected active canonical universe unchanged
        run: |
          python - <<'PY'
          from scanner.app.build_watchlist import expected_master_universe_count
          from pathlib import Path
          n = expected_master_universe_count(Path("data/inputs/universe_master.csv"))
          assert n == 216, f"unexpected universe cardinality {n}; manual review required"
          print(f"CY02-B01 resolved dual-listing universe: {n}")
          PY
