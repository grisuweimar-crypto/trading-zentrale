name: Phase 8I-E Extended Reliability Research

on:
  workflow_dispatch:
  push:
    paths:
      - "configs/external_evidence_8i_reliability_extension_research_v1.json"
      - "src/scanner/research/external_evidence/reliability_extension_8i.py"
      - "tests/test_external_evidence_8i_reliability_extension.py"
      - "docs/external_evidence_8i_reliability_extension_research.md"
      - ".github/workflows/external_evidence_8i_reliability_extension.yml"
      - "configs/external_evidence_8i_component_direction_state_engine_v1.json"
      - "src/scanner/research/external_evidence/component_direction_8i.py"
      - "configs/external_evidence_8i_external_aggregation_design_v1.json"
      - "src/scanner/research/external_evidence/external_aggregation_8i.py"
      - "configs/decision_reliability_explainability_v1.json"
      - "src/scanner/research/decision_layer/reliability_explainability.py"
      - "configs/decision_research_dataset_v1.json"
      - "configs/external_conflict_matrix_v1.json"
  pull_request:
    paths:
      - "configs/external_evidence_8i_reliability_extension_research_v1.json"
      - "src/scanner/research/external_evidence/reliability_extension_8i.py"
      - "tests/test_external_evidence_8i_reliability_extension.py"
      - "docs/external_evidence_8i_reliability_extension_research.md"
      - ".github/workflows/external_evidence_8i_reliability_extension.yml"
      - "configs/external_evidence_8i_component_direction_state_engine_v1.json"
      - "src/scanner/research/external_evidence/component_direction_8i.py"
      - "configs/external_evidence_8i_external_aggregation_design_v1.json"
      - "src/scanner/research/external_evidence/external_aggregation_8i.py"
      - "configs/decision_reliability_explainability_v1.json"
      - "src/scanner/research/decision_layer/reliability_explainability.py"
      - "configs/decision_research_dataset_v1.json"
      - "configs/external_conflict_matrix_v1.json"

permissions:
  contents: read

jobs:
  reliability-extension-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Guard Phase 8I-A baseline
        run: pytest -q tests/test_external_evidence_8i_decision_extension_contract.py

      - name: Guard Phase 8I-B binding boundary
        run: pytest -q tests/test_external_evidence_8i_promotion_provenance_binding.py

      - name: Guard Phase 8I-C aggregation boundary
        run: pytest -q tests/test_external_evidence_8i_external_aggregation.py

      - name: Guard Phase 8I-D direction boundary
        run: pytest -q tests/test_external_evidence_8i_component_direction.py

      - name: Validate Phase 8I-E reliability research
        run: pytest -q tests/test_external_evidence_8i_reliability_extension.py

      - name: Prove current fail-closed state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.external_evidence.reliability_extension_8i import current_reliability_status

          def load(path):
              return json.loads(Path(path).read_text())

          state = current_reliability_status(
              load("configs/external_evidence_8i_reliability_extension_research_v1.json"),
              load("configs/decision_reliability_explainability_v1.json"),
              load("configs/external_evidence_8i_component_direction_state_engine_v1.json"),
              load("configs/external_evidence_8i_external_aggregation_design_v1.json"),
              load("configs/decision_research_dataset_v1.json"),
              load("configs/external_conflict_matrix_v1.json"),
          )
          assert state["state"] == "BLOCKED_BY_8I_B_UPSTREAM_SOURCE_IDENTITY_CONTRACT"
          assert state["real_bound_component_ids"] == []
          assert state["real_reliability_annotations_authorized"] is False
          assert state["real_outcomes_opened"] is False
          assert state["terminal_family_evaluation_complete"] is False
          assert state["phase7_reliability_preserved"] is True
          assert state["extended_reliability_enabled"] is False
          assert state["extended_stance_enabled"] is False
          assert state["decision_effect"] == "NO_CHANGE_TO_PHASE7_DECISION"
          assert state["portfolio_action_change_authorized"] is False
          assert state["orders_or_trades_authorized"] is False
          print("8I-E current fail-closed invariant verified")
          PY

      - name: Guard no real outcome or decision activation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("configs/external_evidence_8i_reliability_extension_research_v1.json").read_text())
          assert contract["real_decision_outcome_read_allowed"] is False
          assert contract["extended_reliability_enabled"] is False
          assert contract["extended_stance_enabled"] is False
          assert contract["phase7_mutation_enabled"] is False
          assert contract["portfolio_action_change_enabled"] is False
          assert contract["orders_or_trades_enabled"] is False
          assert contract["prospective_evidence"]["repeated_interim_significance_looks_allowed"] is False
          assert contract["annotation_model"]["numeric_reliability_score_allowed"] is False
          assert contract["annotation_model"]["ordinal_reliability_ranking_allowed"] is False
          assert contract["statistics"]["significance_is_automatic_promotion"] is False
          print("8I-E outcome and decision boundaries remain closed")
          PY

      - name: Guard production namespace
        run: |
          set -euo pipefail
          refs=$(grep -R -l --exclude-dir=research \
            -e "external_evidence_8i_reliability_extension_research_v1" \
            -e "reliability_extension_8i" \
            src/scanner 2>/dev/null || true)
          if [ -n "$refs" ]; then
            echo "8I-E referenced outside research namespace:"
            echo "$refs"
            exit 1
          fi
          echo "No production-facing 8I-E references found."
