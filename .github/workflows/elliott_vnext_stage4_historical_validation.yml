name: Elliott Stage 4 Historical Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/scanner/research/elliott_vnext/stage4_historical.py"
      - "src/scanner/research/elliott_vnext/validation.py"
      - "src/scanner/research/elliott_vnext/validation_replay.py"
      - "scripts/run_elliott_stage4_historical_validation.py"
      - "tests/test_elliott_vnext_stage4_historical.py"
      - "tests/test_elliott_vnext_validation.py"
      - "docs/elliott_vnext_stage4_historical_validation.md"
      - ".github/workflows/elliott_vnext_stage4_historical_validation.yml"
  push:
    branches: [main]
    paths:
      - "src/scanner/research/elliott_vnext/stage4_historical.py"
      - "scripts/run_elliott_stage4_historical_validation.py"
      - "tests/test_elliott_vnext_stage4_historical.py"
      - "docs/elliott_vnext_stage4_historical_validation.md"
      - ".github/workflows/elliott_vnext_stage4_historical_validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elliott-stage4-historical-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Stage 4 and frozen 6G regressions
        run: >-
          python -m pytest -q
          tests/test_elliott_vnext_stage4_historical.py
          tests/test_elliott_vnext_validation.py
          tests/test_elliott_vnext_validation_contract.py

      - name: Runner smoke test
        run: python scripts/run_elliott_stage4_historical_validation.py --help

      - name: Historical subset integration test
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SYMBOLS="$(python - <<'PY'
          import pandas as pd
          frame = pd.read_csv('artifacts/market_data/yahoo_ohlcv.csv', usecols=['symbol'])
          names = sorted(frame['symbol'].dropna().astype(str).unique())[:2]
          print(' '.join(names))
          PY
          )"
          test -n "$SYMBOLS"
          python scripts/run_elliott_stage4_historical_validation.py             --symbols $SYMBOLS             --bootstrap-reps 0             --output "$RUNNER_TEMP/stage4_subset.json"
          python - "$RUNNER_TEMP/stage4_subset.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert report['technical_stage_status'] == 'COMPLETE'
          assert report['empirical_promotion_status'] == 'NOT_PROMOTED'
          assert report['replay']['guard_review']['valid'] is True
          assert report['boundaries']['future_rows_used_for_replay'] is False
          assert report['boundaries']['automatic_promotion_allowed'] is False
          assert report['stage4_scope']['cross_system_incremental_value_deferred_to_stage5'] is True
          print(json.dumps({
              'symbols_requested': report['replay']['symbols_requested'],
              'symbols_with_snapshots': report['replay']['symbols_with_snapshots'],
              'snapshot_count': report['replay']['snapshot_count'],
              'coverage': report['coverage'],
          }, indent=2))
          PY

      - name: Run full Stage 4 historical validation
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/run_elliott_stage4_historical_validation.py
          --bootstrap-reps 1000

      - name: Validate full Stage 4 closure artifact
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path('artifacts/research/elliott_vnext_stage4_historical_validation.json')
              .read_text(encoding='utf-8')
          )
          assert report['schema_version'] == 'elliott_vnext_stage4_historical_validation_v1'
          assert report['stage'] == 'STAGE_4_HISTORICAL_VALIDATION'
          assert report['technical_stage_status'] == 'COMPLETE'
          assert report['empirical_promotion_status'] == 'NOT_PROMOTED'
          assert report['replay']['guard_review']['valid'] is True
          assert report['replay']['failures_are_missing_evidence_not_imputed'] is True
          assert report['boundaries']['legacy_data_can_support_promotion'] is False
          assert report['boundaries']['future_rows_used_for_replay'] is False
          assert report['boundaries']['performance_used_to_build_elliott_state'] is False
          assert report['boundaries']['automatic_promotion_allowed'] is False
          assert report['boundaries']['research_only'] is True
          print(json.dumps({
              'technical_stage_status': report['technical_stage_status'],
              'source': report['source'],
              'replay': report['replay'],
              'coverage': report['coverage'],
              'structure_resolution_counts': report['structure_summary']['resolution_counts'],
              'projection_summary_rows': len(report['projection_summary']),
              'route_summary_rows': len(report['route_summary']),
          }, indent=2))
          PY

      - name: Publish Stage 4 historical result to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/research/elliott_vnext_stage4_historical_validation.json
          if git diff --cached --quiet; then
            echo "Stage 4 artifact unchanged."
            exit 0
          fi
          git commit -m "Elliott Stage 4: publish historical validation [skip ci]"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
            echo "main advanced during Stage 4 run; refusing stale publication" >&2
            exit 1
          fi
          git push origin HEAD:main
