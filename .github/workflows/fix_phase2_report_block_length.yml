name: Fix Phase 2 block length reporting

on:
  push:
    branches: [phase2-uncertainty-hotfix]
    paths:
      - '.github/workflows/fix_phase2_report_block_length.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase2-uncertainty-hotfix
      - name: Fix diagnostic block length
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scanner/reports/probability_calibration.py')
          s = p.read_text(encoding='utf-8')
          old = '        "bootstrap_block_length_sessions": int(horizon),\n'
          new = '        "bootstrap_date_count": int(robust.get("date_count", 0)),\n        "bootstrap_block_length_sessions": int(robust.get("block_length", _effective_block_length(horizon))),\n'
          if old not in s:
              raise SystemExit('old report block length line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix_phase2_report_block_length.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          git commit -m "Fix Phase 2 moving-block diagnostics"
          git push origin HEAD:phase2-uncertainty-hotfix
