name: Elliott Stage 5 Aggregate Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/aggregate_elliott_stage5.py"
      - "tests/test_elliott_vnext_stage5_incremental.py"
      - ".github/workflows/elliott_stage5_aggregate_recovery.yml"
  push:
    branches: [main]
    paths:
      - "scripts/aggregate_elliott_stage5.py"
      - ".github/workflows/elliott_stage5_aggregate_recovery.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  SOURCE_STAGE5_RUN_ID: "37291784304"
  SOURCE_STAGE4_RUN_ID: "37231656936"
  SOURCE_STAGE4_COMMIT: "97ccabbe541e449e317d48c3c1f6d6b8823054c6"
  STAGE5_CHUNK_COUNT: "20"

concurrency:
  group: elliott-stage5-aggregate-recovery
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and tests
        run: python -m pip install -e ".[test]"

      - name: Verify optimized aggregation remains equivalent
        run: >-
          python -m pytest -q
          tests/test_elliott_vnext_stage5_incremental.py
          tests/test_elliott_vnext_validation.py
          tests/test_elliott_vnext_validation_contract.py

      - name: Aggregator smoke test
        run: python scripts/aggregate_elliott_stage5.py --help

  aggregate:
    if: github.event_name != 'pull_request'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Download completed Stage 5 chunks from successful chunk run
        uses: actions/download-artifact@v4
        with:
          pattern: elliott-stage5-chunk-*
          path: ${{ runner.temp }}/stage5_chunks
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_STAGE5_RUN_ID }}

      - name: Verify all 20 source chunks are present
        shell: bash
        run: |
          set -euo pipefail
          count="$(find "$RUNNER_TEMP/stage5_chunks" -maxdepth 1 -name 'stage5-chunk-*.json.gz' | wc -l)"
          test "$count" -eq 20

      - name: Aggregate Stage 5
        run: >-
          python scripts/aggregate_elliott_stage5.py
          --chunks-dir "$RUNNER_TEMP/stage5_chunks"
          --chunk-count ${{ env.STAGE5_CHUNK_COUNT }}
          --source-commit ${{ env.SOURCE_STAGE4_COMMIT }}
          --source-workflow-run-id ${{ env.SOURCE_STAGE4_RUN_ID }}
          --bootstrap-reps 1000

      - name: Validate canonical Stage 5 artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/research/elliott_vnext_stage5_incremental.json")
              .read_text(encoding="utf-8")
          )
          assert report["schema_version"] == "elliott_vnext_stage5_incremental_v1"
          assert report["stage"] == "STAGE_5_INCREMENTAL_CROSS_SYSTEM"
          assert report["technical_stage_status"] == "COMPLETE"
          assert report["empirical_promotion_status"] == "NOT_PROMOTED"
          assert report["source"]["source_commit"] == "97ccabbe541e449e317d48c3c1f6d6b8823054c6"
          assert report["source"]["source_workflow_run_id"] == 37231656936
          assert report["source"]["chunk_count"] == 20
          assert report["source"]["symbol_count"] == 211
          assert report["coverage"]["elliott_events"] > 0
          assert report["coverage"]["route_claims"] > 0
          assert report["coverage"]["route_outcome_rows"] > 0
          assert report["coverage"]["mature_route_outcomes"] > 0
          assert report["coverage"]["transition_incremental_rows"] > 0
          assert report["boundaries"]["present_day_model_claims_retrojected"] is False
          assert report["boundaries"]["post_event_scanner_rows_used_for_incremental_test"] is False
          assert report["boundaries"]["scanner_thresholds_reoptimized"] is False
          assert report["boundaries"]["elliott_recounted"] is False
          assert report["boundaries"]["legacy_data_can_support_promotion"] is False
          assert report["boundaries"]["automatic_promotion_allowed"] is False
          assert report["boundaries"]["changes_universal_stance"] is False
          assert report["boundaries"]["changes_portfolio_action"] is False
          assert report["boundaries"]["trade_decision"] is None
          assert report["boundaries"]["order_instruction"] is None
          assert report["boundaries"]["research_only"] is True
          assert report["interpretation"]["overlapping_forward_windows_are_iid"] is False
          assert report["model_relation_validation"]["claims_retrojected"] is False
          print(json.dumps({
              "technical_stage_status": report["technical_stage_status"],
              "empirical_promotion_status": report["empirical_promotion_status"],
              "source": report["source"],
              "coverage": report["coverage"],
              "lead_lag_summary_rows": len(report["lead_lag_summary"]),
              "transition_incremental_rows": len(report["transition_incremental_validation"]),
              "model_relation_status": report["model_relation_validation"]["status"],
          }, indent=2, sort_keys=True))
          PY

      - name: Publish Stage 5 artifact to main
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="artifacts/research/elliott_vnext_stage5_incremental.json"
          SAFE_COPY="$RUNNER_TEMP/elliott_vnext_stage5_incremental.json"
          cp "$ARTIFACT" "$SAFE_COPY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            BASE="$(git rev-parse origin/main)"

            if [ "$BASE" != "${GITHUB_SHA}" ]; then
              if ! git diff --quiet "${GITHUB_SHA}..${BASE}" --                 artifacts/research/history_analysis.csv                 artifacts/market_data/yahoo_ohlcv.csv                 src/scanner/research/elliott_vnext/cross_system.py                 src/scanner/research/elliott_vnext/validation.py                 src/scanner/research/elliott_vnext/stage5_incremental.py                 scripts/run_elliott_stage5_chunk.py                 scripts/aggregate_elliott_stage5.py                 configs/elliott_vnext_stage5_incremental_v1.json
              then
                echo "Stage 5 inputs changed during recovery; refusing stale publication" >&2
                exit 1
              fi
            fi

            git reset --hard "$BASE"
            mkdir -p "$(dirname "$ARTIFACT")"
            cp "$SAFE_COPY" "$ARTIFACT"
            git add "$ARTIFACT"

            if git diff --cached --quiet; then
              echo "Stage 5 artifact unchanged."
              exit 0
            fi

            git commit -m "Elliott Stage 5: publish incremental validation [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Stage 5 publication race unresolved after 3 attempts" >&2
          exit 1
