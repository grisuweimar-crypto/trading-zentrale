name: Operating Playbook Contract

on:
  pull_request:
    paths:
      - 'docs/OPERATING_PLAYBOOK.md'
      - 'tests/test_operating_playbook_contract.py'
      - '.github/workflows/operating_playbook_contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/OPERATING_PLAYBOOK.md'
      - 'tests/test_operating_playbook_contract.py'
      - '.github/workflows/operating_playbook_contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playbook-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate documented paths, scanner score and safe operating instructions
        run: python -m unittest discover -s tests -p 'test_operating_playbook_contract.py' -v
