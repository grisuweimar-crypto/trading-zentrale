name: QM-8 CAPA Finding Consolidation
on:
  pull_request:
    paths:
      - "configs/qm8_capa_finding_consolidation_v1.json"
      - "tests/test_qm8_capa_finding_consolidation.py"
      - "artifacts/research/qm/qm_h_capa_ledger.jsonl"
      - "configs/ba_qm10_production_operations_qm_v1.json"
      - ".github/workflows/qm8_capa_finding_consolidation.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qm8-consolidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_qm8_capa_finding_consolidation.py tests/test_qm_h_capa.py
