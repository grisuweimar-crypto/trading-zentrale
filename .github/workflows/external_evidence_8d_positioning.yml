name: Phase 8D Positioning and Crowding

on:
  pull_request:
    paths:
      - "configs/external_evidence_8d_positioning_crowding_v1.json"
      - "configs/external_evidence_8d_insider_validation_v1.json"
      - "src/scanner/research/external_evidence/finra_short_interest.py"
      - "src/scanner/research/external_evidence/finra_short_interest_acquisition.py"
      - "src/scanner/research/external_evidence/finra_short_interest_coverage.py"
      - "src/scanner/research/external_evidence/sec_insider_bulk.py"
      - "src/scanner/research/external_evidence/sec_insider_validation.py"
      - "src/scanner/research/external_evidence/sec_insider_raw_audit.py"
      - "scripts/import_external_evidence_8d_finra_short_interest.py"
      - "scripts/collect_external_evidence_8d_finra_short_interest.py"
      - "scripts/run_external_evidence_8d_finra_coverage.py"
      - "scripts/import_external_evidence_8d_sec_insider_bulk.py"
      - "scripts/run_external_evidence_8d_insider_validation.py"
      - "scripts/run_external_evidence_8d_b3_real_q2.py"
      - "scripts/export_external_evidence_8d_b3_raw_audit.py"
      - "docs/external_evidence_8d_positioning_crowding.md"
      - "tests/test_external_evidence_8d_positioning_contract.py"
      - "tests/test_external_evidence_8d_finra_short_interest.py"
      - "tests/test_external_evidence_8d_finra_coverage.py"
      - "tests/test_external_evidence_8d_sec_insider_bulk.py"
      - "tests/test_external_evidence_8d_sec_insider_cross_context.py"
      - "tests/test_external_evidence_8d_insider_validation.py"
      - "tests/test_external_evidence_8d_insider_raw_audit.py"
      - ".github/workflows/external_evidence_8d_positioning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate Phase 8D outcome-blind source, PIT and preregistration contracts
        run: >-
          python -m pytest -q
          tests/test_external_evidence_8d_positioning_contract.py
          tests/test_external_evidence_8d_finra_short_interest.py
          tests/test_external_evidence_8d_finra_coverage.py
          tests/test_external_evidence_8d_sec_insider_bulk.py
          tests/test_external_evidence_8d_sec_insider_cross_context.py
          tests/test_external_evidence_8d_insider_validation.py
          tests/test_external_evidence_8d_insider_raw_audit.py
      - name: Verify Phase 8D CLIs
        run: |
          python scripts/import_external_evidence_8d_finra_short_interest.py --help
          python scripts/collect_external_evidence_8d_finra_short_interest.py --help
          python scripts/run_external_evidence_8d_finra_coverage.py --help
          python scripts/import_external_evidence_8d_sec_insider_bulk.py --help
          python scripts/run_external_evidence_8d_insider_validation.py --help
          python scripts/run_external_evidence_8d_b3_real_q2.py --help
          python scripts/export_external_evidence_8d_b3_raw_audit.py --help

# CI intentionally performs no live FINRA or SEC requests.
# Real FINRA snapshots are collected prospectively outside CI.
# SEC insider quarterly bulk ZIPs are operator-provided official SEC downloads and
# are joined to the already operator-attested SEC submissions bundle by accession + issuer CIK.
# Cross-entity Form 4 accession appearances are expected and are not treated as snapshot corruption.
# B3 sampling, raw-source audit and validation remain outcome-blind until the preregistered audit is complete.
