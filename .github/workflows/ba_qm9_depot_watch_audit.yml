name: BA-QM9 Depot Watch Audit

on:
  pull_request:
    paths:
      - "configs/ba_qm9_depot_watch_audit_v1.json"
      - "src/scanner/research/governance/ba_qm9_depot_watch_audit.py"
      - "src/scanner/research/governance/ba_qm9_watch_runtime_audit.py"
      - "tests/test_ba_qm9_depot_watch_audit.py"
      - "tests/test_ba_qm9_watch_runtime_audit.py"
      - "src/scanner/research/decision_layer/depot_watch.py"
      - "src/scanner/research/decision_layer/depot_watch_orchestrator.py"
      - "src/scanner/research/decision_layer/portfolio_action.py"
      - "src/scanner/research/decision_layer/reliability_explainability.py"
      - "src/scanner/research/decision_layer/watch_runtime.py"
      - "scripts/run_depot_watch_orchestrated.py"
      - "tests/test_decision_depot_watch_7h.py"
      - "tests/test_decision_depot_watch_orchestration.py"
      - "tests/test_decision_depot_watch_prospective_gate.py"
      - "tests/test_watch_runtime_transport.py"
      - "tests/test_w11_end_to_end_acceptance.py"
      - "tests/test_w12_ferrari_regression.py"
      - ".github/workflows/ba_qm9_depot_watch_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ba-qm9-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate BA-QM9 foundation and existing Depot Watch contracts
        run: |
          python -m pytest -q             tests/test_ba_qm9_depot_watch_audit.py             tests/test_decision_depot_watch_7h.py             tests/test_decision_depot_watch_orchestration.py             tests/test_decision_depot_watch_prospective_gate.py             tests/test_watch_runtime_transport.py             tests/test_w11_end_to_end_acceptance.py             tests/test_w12_ferrari_regression.py
          python - <<'PY'
          from scanner.research.governance.ba_qm9_depot_watch_audit import validate_foundation_file

          result = validate_foundation_file()
          assert result["status"] == "PASSED_CONTRACT_FOUNDATION"
          assert result["engineering_status"] == "IN_PROGRESS"
          assert result["runtime_audit_status"] == "IMPLEMENTED_CANONICAL_7H"
          assert result["required_check_count"] == 11
          assert result["old_scanner_heuristic_fallback_forbidden"] is True
          assert result["depot_wall_clock_freshness_threshold_defined"] is False
          assert result["undefined_depot_age_may_not_be_claimed_fresh"] is True
          assert result["ba_qm9_closure_blocked_by_ba_qm8"] is True
          assert result["evidence_impact"] == "PROMOTION_BLOCKED"
          assert result["automatic_release_allowed"] is False
          assert result["closure_claimed"] is False
          print(result)
          PY
