name: Phase 8I-F Extended Stance Entry Gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase8i-decision-layer-extension
    paths:
      - "configs/external_evidence_8i_extended_stance_entry_gate_v1.json"
      - "src/scanner/research/external_evidence/extended_stance_entry_gate_8i.py"
      - "tests/test_external_evidence_8i_extended_stance_entry_gate.py"
      - "docs/external_evidence_8i_extended_stance_entry_gate.md"
      - ".github/workflows/external_evidence_8i_extended_stance_entry_gate.yml"
      - "configs/external_evidence_8i_reliability_extension_research_v1.json"
      - "configs/decision_universal_stance_v1.json"
      - "configs/decision_state_transition_v1.json"
      - "configs/decision_portfolio_action_v1.json"
  pull_request:
    paths:
      - "configs/external_evidence_8i_extended_stance_entry_gate_v1.json"
      - "src/scanner/research/external_evidence/extended_stance_entry_gate_8i.py"
      - "tests/test_external_evidence_8i_extended_stance_entry_gate.py"
      - "docs/external_evidence_8i_extended_stance_entry_gate.md"
      - ".github/workflows/external_evidence_8i_extended_stance_entry_gate.yml"
      - "configs/external_evidence_8i_reliability_extension_research_v1.json"
      - "configs/decision_universal_stance_v1.json"
      - "configs/decision_state_transition_v1.json"
      - "configs/decision_portfolio_action_v1.json"

permissions:
  contents: read

jobs:
  extended-stance-entry-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Guard upstream 8I-E reliability contract
        run: pytest -q tests/test_external_evidence_8i_reliability_extension.py

      - name: Validate Phase 8I-F entry gate
        run: pytest -q tests/test_external_evidence_8i_extended_stance_entry_gate.py

      - name: Prove current real gate is closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.external_evidence.extended_stance_entry_gate_8i import evaluate_entry_gate

          contract = json.loads(Path("configs/external_evidence_8i_extended_stance_entry_gate_v1.json").read_text())
          review = json.loads(Path("artifacts/research/external_evidence_8i_evaluation_review_latest.json").read_text())
          result = evaluate_entry_gate(contract, review)

          assert result["state"] == "BLOCKED_WAITING_FOR_8I_E_EMPIRICAL_REVIEW"
          assert result["eligible_to_begin_stance_preregistration"] is False
          assert result["extended_stance_enabled"] is False
          assert result["decision_effect"] == "NO_CHANGE_TO_PHASE7_DECISION"
          assert result["portfolio_action_change_authorized"] is False
          assert result["orders_or_trades_authorized"] is False
          assert result["real_outcome_values_read_by_8i_f_gate"] is False
          print(json.dumps({"state": result["state"], "blockers": result["blockers"]}, sort_keys=True))
          PY

      - name: Guard no premature stance or Portfolio Action activation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("configs/external_evidence_8i_extended_stance_entry_gate_v1.json").read_text())
          assert contract["extended_reliability_enabled"] is False
          assert contract["extended_stance_enabled"] is False
          assert contract["phase7_mutation_enabled"] is False
          assert contract["portfolio_action_change_enabled"] is False
          assert contract["orders_or_trades_enabled"] is False
          assert contract["real_decision_outcome_read_allowed"] is False
          assert contract["scope"]["stance_rule_family_frozen_now"] is False
          assert contract["scope"]["portfolio_action_bridge_in_scope_now"] is False
          assert contract["completion_gate"]["actual_8i_f_stance_preregistration_complete"] is False
          assert contract["completion_gate"]["8i_g_may_start_now"] is False
          print("8I-F remains a fail-closed entry gate only")
          PY

      - name: Guard production namespace
        run: |
          set -euo pipefail
          refs=$(grep -R -l --exclude-dir=research \
            -e "external_evidence_8i_extended_stance_entry_gate_v1" \
            -e "extended_stance_entry_gate_8i" \
            src/scanner 2>/dev/null || true)
          if [ -n "$refs" ]; then
            echo "8I-F entry gate referenced outside research namespace:"
            echo "$refs"
            exit 1
          fi
          echo "No production-facing 8I-F references found."
