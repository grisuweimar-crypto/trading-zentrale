name: CYCLE-DIR CY-01 Data Quality

on:
  pull_request:
    paths:
      - "src/scanner/app/build_watchlist.py"
      - "src/scanner/data/schema/cycle_quality.py"
      - "src/scanner/reports/**"
      - "src/scanner/ui/generator.py"
      - "tests/test_cycle_quality_cy01.py"
      - "docs/cycle_direction/**"
      - ".github/workflows/cycle_dir_cy01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycle-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Syntax compile
        run: python -m compileall -q src/scanner
      - name: Cycle / history / research / Pattern Discovery regression
        run: |
          python -m pytest -q \
            tests/test_cycle_quality_cy01.py \
            tests/test_history_delta_completion.py \
            tests/test_daily_research.py \
            tests/test_research_views.py \
            tests/test_recent_history.py \
            tests/pattern_discovery/test_l2_feature_library.py \
            tests/pattern_discovery/test_l3_search_engine.py
