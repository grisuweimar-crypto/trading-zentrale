name: BA-QM8 End-to-End Scanner Audit

on:
  pull_request:
    paths:
      - "configs/ba_qm8_scanner_e2e_audit_v1.json"
      - "src/scanner/research/governance/ba_qm8_end_to_end.py"
      - "src/scanner/research/governance/ba_qm8_transition_guard.py"
      - "src/scanner/research/governance/ba_qm8_real_stage_bindings.py"
      - "src/scanner/research/governance/ba_qm8_real_transitions.py"
      - "src/scanner/research/governance/ba_qm8_closure.py"
      - "src/scanner/reports/scanner_provenance.py"
      - "src/scanner/reports/daily_research.py"
      - "src/scanner/reports/research_validation.py"
      - "src/scanner/app/build_watchlist.py"
      - "src/scanner/research/decision_layer/w10_orchestration.py"
      - "tests/test_ba_qm8_end_to_end.py"
      - "tests/test_ba_qm8_transition_guard.py"
      - "tests/test_ba_qm8_real_stage_bindings.py"
      - "tests/test_ba_qm8_real_transitions.py"
      - "tests/test_ba_qm8_closure.py"
      - "tests/test_ba_qm8_workflow_trigger.py"
      - "tests/test_scanner_provenance.py"
      - "tests/test_w10_snapshot_orchestration.py"
      - "artifacts/research/daily_research.json"
      - "artifacts/research/current_decision_packets_7a.json"
      - "artifacts/research/decision_snapshot_w10.json"
      - "configs/ba_qm7_qm_j_closure_v1.json"
      - "src/scanner/research/governance/qm_j_closure.py"
      - "configs/qm_j_phase1a_selection_freshness_gate_v1.json"
      - "src/scanner/research/governance/qm_j_selection_freshness_gate.py"
      - "artifacts/research/qm/qm_h_capa_ledger.jsonl"
      - "configs/qm_i_evidence_lineage_v1.json"
      - "src/scanner/research/governance/qm_i_lineage.py"
      - "configs/qm_c3_families_multiplicity_v1.json"
      - "src/scanner/research/governance/qm_c_families_multiplicity.py"
      - "src/scanner/research/decision_layer/w11_end_to_end.py"
      - "tests/test_w11_end_to_end_acceptance.py"
      - "tests/test_w12_ferrari_regression.py"
      - "configs/external_evidence_8_contract_v1.json"
      - "artifacts/research/external_evidence_8c_completion.json"
      - ".github/workflows/run_scanner.yml"
      - ".github/workflows/ba_qm8_scanner_e2e_audit.yml"
  workflow_run:
    workflows: ['Decision Watch Integration Pipeline']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ba-qm8-pr-{0}', github.event.pull_request.number) || 'ba-qm8-main-prospective-audit' }}
  cancel-in-progress: true

jobs:
  ba-qm8-audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run full Scanner regression suite for provenance-sensitive core changes
        run: python -m pytest -q tests

      - name: Validate BA-QM8 provenance, guards, real bindings and predecessor regressions
        run: |
          python -m pytest -q \
            tests/test_scanner_provenance.py \
            tests/test_w10_snapshot_orchestration.py \
            tests/test_ba_qm8_end_to_end.py \
            tests/test_ba_qm8_transition_guard.py \
            tests/test_ba_qm8_real_stage_bindings.py \
            tests/test_ba_qm8_real_transitions.py \
            tests/test_ba_qm8_closure.py \
            tests/test_qm_j_closure.py \
            tests/test_qm_j_selection_freshness_gate.py \
            tests/test_w11_end_to_end_acceptance.py \
            tests/test_w12_ferrari_regression.py
          python - <<'PY'
          from scanner.research.governance.ba_qm8_end_to_end import validate_foundation_file
          from scanner.research.governance.ba_qm8_real_stage_bindings import audit_real_stage_bindings
          from scanner.research.governance.ba_qm8_real_transitions import audit_real_transitions
          from scanner.research.governance.ba_qm8_closure import evaluate_ba_qm8_closure

          foundation = validate_foundation_file()
          assert foundation["status"] == "PASSED_CONTRACT_FOUNDATION"
          assert foundation["engineering_status"] == "IN_PROGRESS"
          assert foundation["transition_guard_status"] == "IMPLEMENTED_FAIL_CLOSED_ENGINE"
          assert foundation["real_stage_adapter_status"] == "IMPLEMENTED_WITH_OPEN_GAPS"
          assert foundation["data_scanner_provenance_status"] == "IMPLEMENTED_AWAITING_FIRST_PROSPECTIVE_SNAPSHOT"
          assert foundation["real_transition_observation_status"] == "IMPLEMENTED_CURRENT_SNAPSHOT_9_OF_10_DATA_BLOCKED"
          assert foundation["closure_gate_status"] == "IMPLEMENTED_PENDING_PROSPECTIVE_10_OF_10"
          assert foundation["evidence_impact"] == "PROMOTION_BLOCKED"
          assert foundation["effectiveness_verification_pending"] is True
          assert foundation["automatic_release_allowed"] is False
          assert foundation["closure_claimed"] is False

          # Stage 4 must accept both legitimate audit states:
          # - historical/pre-provenance snapshots remain fail-closed at 9/10;
          # - the first prospective provenance-bound snapshot must pass 10/10.
          real = audit_real_stage_bindings()
          transitions = audit_real_transitions()
          closure = evaluate_ba_qm8_closure()

          data_status = real["stage_results"]["DATA"]["status"]
          if data_status == "PARTIAL":
              assert real["w10_status"] == "sealed"
              assert "scanner_input_provenance_missing" in real["stage_results"]["DATA"]["gaps"]
              assert "DATA" in real["closure_blockers"]
              assert real["closure_eligible"] is False

              assert transitions["status"] == "REAL_TRANSITIONS_PARTIAL_DATA_PROVENANCE_BLOCKED"
              assert transitions["transition_pass_count"] == 9
              assert transitions["transition_blocked_count"] == 1
              assert transitions["closure_eligible"] is False

              assert closure["status"] == "PENDING_PROSPECTIVE_SNAPSHOT"
              assert closure["engineering_closure_eligible"] is False
              assert closure["engineering_closure_performed"] is False
          elif data_status == "PASS":
              assert real["status"] == "REAL_STAGE_BINDINGS_PASS"
              assert real["w10_status"] == "sealed"
              assert real["closure_blockers"] == []
              assert real["closure_eligible"] is True

              assert transitions["status"] == "REAL_TRANSITIONS_PASS"
              assert transitions["transition_pass_count"] == 10
              assert transitions["transition_blocked_count"] == 0
              assert transitions["closure_eligible"] is True
              assert transitions["all_executed_transitions_cover_all_seven_classes"] is True

              assert closure["status"] == "ELIGIBLE_FOR_BA_QM8_ENGINEERING_CLOSURE"
              assert closure["engineering_closure_eligible"] is True
              assert closure["engineering_closure_performed"] is False
          else:
              raise AssertionError(f"unexpected DATA stage status: {data_status!r}")

          # In both states, audit safety and the independent Lag-1 governance block
          # must remain unchanged.
          assert real["guessed_lineage_added"] is False
          assert real["missing_treated_as_neutral"] is False
          assert transitions["historical_lineage_backfilled"] is False
          assert transitions["missing_treated_as_neutral"] is False
          assert closure["lag1_evidence_impact"] == "PROMOTION_BLOCKED"
          assert closure["ba_qm8_may_release_lag1_block"] is False
          assert closure["automatic_release_allowed"] is False
          assert closure["empirical_validation_claimed"] is False
          assert closure["empirical_promotion_performed"] is False

          print(foundation)
          print(real)
          print(transitions)
          print(closure)
          PY
