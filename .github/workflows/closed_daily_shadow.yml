name: Closed bars full-universe shadow comparison
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/compare_closed_daily_scanner.py'
      - '.github/workflows/closed_daily_shadow.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e ".[test]"
      - name: Compute shadow comparison
        id: compare
        continue-on-error: true
        run: python scripts/compare_closed_daily_scanner.py
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-bars-whole-universe-shadow
          path: artifacts/research/closed_bar_shadow/
          if-no-files-found: warn
      - name: Persist summary only on research branch
        if: steps.compare.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/research/closed_bar_shadow/comparison.json
          git diff --cached --quiet || (git commit -m "research: archive all-universe closed-bars shadow comparison" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")
      - name: Require comparison
        if: steps.compare.outcome != 'success'
        run: exit 1
