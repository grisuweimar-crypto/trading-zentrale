name: Phase 8I-H Production Readiness Final Review

on:
  workflow_dispatch:
  push:
    branches:
      - phase8i-decision-layer-extension
    paths:
      - "configs/external_evidence_8i_production_readiness_final_review_v1.json"
      - "src/scanner/research/external_evidence/production_readiness_final_review_8i.py"
      - "tests/test_external_evidence_8i_production_readiness_final_review.py"
      - "docs/external_evidence_8i_production_readiness_final_review.md"
      - ".github/workflows/external_evidence_8i_production_readiness_final_review.yml"
      - "configs/external_evidence_8i_prospective_validation_entry_gate_v1.json"
      - "src/scanner/research/external_evidence/prospective_validation_entry_gate_8i.py"
      - "configs/decision_validation_promotion_v1.json"
      - "configs/decision_portfolio_action_v1.json"
      - "configs/external_evidence_8i_decision_extension_contract_v1.json"
  pull_request:
    paths:
      - "configs/external_evidence_8i_production_readiness_final_review_v1.json"
      - "src/scanner/research/external_evidence/production_readiness_final_review_8i.py"
      - "tests/test_external_evidence_8i_production_readiness_final_review.py"
      - "docs/external_evidence_8i_production_readiness_final_review.md"
      - ".github/workflows/external_evidence_8i_production_readiness_final_review.yml"
      - "configs/external_evidence_8i_prospective_validation_entry_gate_v1.json"
      - "src/scanner/research/external_evidence/prospective_validation_entry_gate_8i.py"
      - "configs/decision_validation_promotion_v1.json"
      - "configs/decision_portfolio_action_v1.json"
      - "configs/external_evidence_8i_decision_extension_contract_v1.json"

permissions:
  contents: read

jobs:
  production-readiness-final-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Guard Phase 8I-G validation boundary
        run: pytest -q tests/test_external_evidence_8i_prospective_validation_entry_gate.py

      - name: Validate Phase 8I-H final review gate
        run: pytest -q tests/test_external_evidence_8i_production_readiness_final_review.py

      - name: Prove current real 8I-H gate is closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.external_evidence.production_readiness_final_review_8i import evaluate_final_review_entry_gate

          contract = json.loads(Path("configs/external_evidence_8i_production_readiness_final_review_v1.json").read_text())
          g_contract = json.loads(Path("configs/external_evidence_8i_prospective_validation_entry_gate_v1.json").read_text())
          result = evaluate_final_review_entry_gate(contract, g_contract)

          assert result["state"] == "BLOCKED_WAITING_FOR_8I_G_EMPIRICAL_COMPLETION"
          assert result["eligible_to_begin_final_review"] is False
          assert result["final_review_complete"] is False
          assert result["productive_integration_enabled"] is False
          assert result["decision_effect"] == "NO_CHANGE_TO_PHASE7_DECISION"
          assert result["portfolio_action_change_authorized"] is False
          assert result["orders_or_trades_authorized"] is False
          assert result["real_outcome_values_read_by_8i_h_gate"] is False
          print(json.dumps({"state": result["state"], "blockers": result["blockers"]}, sort_keys=True))
          PY

      - name: Guard manual final review and separate production change
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("configs/external_evidence_8i_production_readiness_final_review_v1.json").read_text())
          assert contract["scope"]["automatic_production_promotion_allowed"] is False
          assert contract["scope"]["final_review_may_enable_production_directly"] is False
          assert contract["scope"]["separate_explicit_production_change_required_after_approval"] is True
          assert contract["final_review_decision_model"]["automatic_state_change_allowed"] is False
          assert contract["final_review_decision_model"]["approval_is_production_activation"] is False
          assert contract["production_change_boundary"]["8i_h_itself_may_modify_production_runtime"] is False
          assert contract["production_change_boundary"]["8i_h_itself_may_enable_broker_execution"] is False
          print("8I-H manual review cannot activate production directly")
          PY

      - name: Guard Phase 7 fallback and execution boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p7 = json.loads(Path("configs/decision_validation_promotion_v1.json").read_text())
          portfolio = json.loads(Path("configs/decision_portfolio_action_v1.json").read_text())
          a = json.loads(Path("configs/external_evidence_8i_decision_extension_contract_v1.json").read_text())
          assert p7["promotion_policy"]["automatic_promotion_allowed"] is False
          assert p7["promotion_policy"]["productive_integration_requires_separate_explicit_change_after_review"] is True
          assert portfolio["guards"]["no_broker_order_generation"] is True
          assert portfolio["guards"]["execution_allowed"] is False
          assert a["production_gate"]["state"] == "CLOSED"
          assert a["production_gate"]["may_change_portfolio_action"] is False
          assert a["production_gate"]["may_generate_orders"] is False
          print("Phase 7 remains authoritative and execution remains closed")
          PY

      - name: Guard production namespace
        run: |
          set -euo pipefail
          refs=$(grep -R -l --exclude-dir=research \
            -e "external_evidence_8i_production_readiness_final_review_v1" \
            -e "production_readiness_final_review_8i" \
            src/scanner 2>/dev/null || true)
          if [ -n "$refs" ]; then
            echo "8I-H referenced outside research namespace:"
            echo "$refs"
            exit 1
          fi
          echo "No production-facing 8I-H references found."
