name: Phase 8F Macro Exposure Context

on:
  pull_request:
    paths:
      - "configs/external_evidence_8f_*"
      - "src/scanner/research/external_evidence/**"
      - "scripts/*external_evidence_8f*"
      - "tests/test_external_evidence_8f_*"
      - "docs/external_evidence_8f_*"
      - ".github/workflows/external_evidence_8f_macro_exposure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate Phase 8F foundation and mapping contracts
        run: >-
          python -m pytest -q
          tests/test_external_evidence_8f_macro_exposure.py
          tests/test_external_evidence_8f_source_candidates.py
          tests/test_external_evidence_8f_market_proxies.py
          tests/test_external_evidence_8f_series_catalog.py
          tests/test_external_evidence_8f_source_adapters.py
          tests/test_external_evidence_8f_macro_ledger.py
          tests/test_external_evidence_8f_prospective_collector.py
          tests/test_external_evidence_8f_exposure_domain.py
          tests/test_external_evidence_8f_exposure_review_queue.py
          tests/test_external_evidence_8f_exposure_map_store.py
          tests/test_external_evidence_8f_mapping_candidates.py
          tests/test_external_evidence_8f_mapping_review.py
          tests/test_external_evidence_8f_mapping_candidates_b3.py
          tests/test_external_evidence_8f_mapping_candidates_b4.py
          tests/test_external_evidence_8f_mapping_candidates_b5.py
          tests/test_external_evidence_8f_mapping_candidates_b6.py
          tests/test_external_evidence_8f_mapping_candidates_b7.py
          tests/test_external_evidence_8f_mapping_candidates_b8.py
          tests/test_external_evidence_8f_mapping_candidates_b9.py
          tests/test_external_evidence_8f_mapping_candidates_b10.py
          tests/test_external_evidence_8f_mapping_candidates_b11.py
          tests/test_external_evidence_8f_completion.py
      - name: Verify Phase 8F CLIs
        run: |
          python scripts/run_external_evidence_8f_contract_gate.py --help
          python scripts/run_external_evidence_8f_macro_ledger.py --help
          python scripts/collect_external_evidence_8f_prospective.py --help
          python scripts/run_external_evidence_8f_exposure_domain_audit.py --help
          python scripts/run_external_evidence_8f_exposure_review_queue.py --help
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --help
          python scripts/run_external_evidence_8f_mapping_review.py --help
          python scripts/run_external_evidence_8f_completion_gate.py --help
      - name: Execute Phase 8F foundation contract gate against effective map
        run: python scripts/run_external_evidence_8f_contract_gate.py --output /tmp/external_evidence_8f_contract_gate.json
      - name: Build frozen research-domain audit against effective map
        run: python scripts/run_external_evidence_8f_exposure_domain_audit.py --output /tmp/external_evidence_8f_exposure_domain_audit.json
      - name: Build frozen 207-subject exposure review queue
        run: python scripts/run_external_evidence_8f_exposure_review_queue.py --output /tmp/external_evidence_8f_exposure_review_queue.json
      - name: Validate documentary mapping candidate batch B1
        run: python scripts/run_external_evidence_8f_mapping_candidate_gate.py --output /tmp/external_evidence_8f_mapping_candidate_gate_b1.json
      - name: Replay committed B1 human review idempotently
        run: python scripts/run_external_evidence_8f_mapping_review.py --output /tmp/external_evidence_8f_mapping_review_b1.json
      - name: Validate and replay B2 human review
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b2_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b2.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b2_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b2_v1.json --output /tmp/external_evidence_8f_mapping_review_b2.json
      - name: Validate and replay B3 human review
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b3_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b3.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b3_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b3_v1.json --output /tmp/external_evidence_8f_mapping_review_b3.json
      - name: Validate and replay B4 human review
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b4_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b4.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b4_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b4_v1.json --output /tmp/external_evidence_8f_mapping_review_b4.json
      - name: Validate and replay B5 human review through effective map
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b5_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b5.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b5_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b5_v1.json --output /tmp/external_evidence_8f_mapping_review_b5.json
      - name: Validate and replay B6 human review through effective map
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b6_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b6.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b6_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b6_v1.json --output /tmp/external_evidence_8f_mapping_review_b6.json
      - name: Validate and replay B7 human review through effective map
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b7_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b7.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b7_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b7_v1.json --output /tmp/external_evidence_8f_mapping_review_b7.json
      - name: Validate and replay B8 human review through effective map
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b8_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b8.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b8_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b8_v1.json --output /tmp/external_evidence_8f_mapping_review_b8.json
      - name: Validate and replay B9 human review through effective map
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b9_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b9.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b9_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b9_v1.json --output /tmp/external_evidence_8f_mapping_review_b9.json
      - name: Validate and replay B10 human review through effective map
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b10_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b10.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b10_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b10_v1.json --output /tmp/external_evidence_8f_mapping_review_b10.json
      - name: Validate and replay B11 human review through effective map
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --candidates configs/external_evidence_8f_mapping_candidates_b11_v1.json --output /tmp/external_evidence_8f_mapping_candidate_gate_b11.json
          python scripts/run_external_evidence_8f_mapping_review.py --candidates configs/external_evidence_8f_mapping_candidates_b11_v1.json --review configs/external_evidence_8f_mapping_review_decisions_b11_v1.json --output /tmp/external_evidence_8f_mapping_review_b11.json
      - name: Confirm current Phase 8F state is not falsely frozen
        run: python scripts/run_external_evidence_8f_completion_gate.py --output /tmp/external_evidence_8f_completion_gate.json

# CI performs no live macro-source or market-price requests.
# The live collector is tested only with deterministic fixture payloads in CI.
# Research-domain membership is frozen independently of mappings and outcomes.
# Documentary candidate mappings cannot enter the effective exposure map automatically.
# B1-B4 remain materialized in the 60-mapping base map; B5-B11 are append-only human-reviewed overlays.
# The effective map contains 160 reviewed mappings after B11; 47 frozen-domain subjects remain unaccounted.
# B1-B11 human-review replay must be idempotent against the effective map.
# Human-review promotion is idempotent for equivalent mapping semantics; conflicting duplicates fail closed.
# No backdating, market direction, signed exposure, weights, thresholds, outcome research,
# cross-factor research, Phase-7 integration or production external-evidence enablement is allowed here.
