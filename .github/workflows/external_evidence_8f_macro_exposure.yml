name: Phase 8F Macro Exposure Context

on:
  pull_request:
    paths:
      - "configs/external_evidence_8f_*"
      - "src/scanner/research/external_evidence/**"
      - "scripts/*external_evidence_8f*"
      - "tests/test_external_evidence_8f_*"
      - "docs/external_evidence_8f_*"
      - ".github/workflows/external_evidence_8f_macro_exposure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Validate Phase 8F foundation and mapping contracts
        run: python -m pytest -q tests/test_external_evidence_8f_*.py

      - name: Verify Phase 8F CLIs
        run: |
          python scripts/run_external_evidence_8f_contract_gate.py --help
          python scripts/run_external_evidence_8f_macro_ledger.py --help
          python scripts/collect_external_evidence_8f_prospective.py --help
          python scripts/run_external_evidence_8f_exposure_domain_audit.py --help
          python scripts/run_external_evidence_8f_exposure_review_queue.py --help
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --help
          python scripts/run_external_evidence_8f_mapping_review.py --help
          python scripts/run_external_evidence_8f_completion_gate.py --help

      - name: Execute Phase 8F foundation contract gate against effective map
        run: python scripts/run_external_evidence_8f_contract_gate.py --output /tmp/external_evidence_8f_contract_gate.json

      - name: Build frozen research-domain audit against effective map
        run: python scripts/run_external_evidence_8f_exposure_domain_audit.py --output /tmp/external_evidence_8f_exposure_domain_audit.json

      - name: Build frozen 207-subject exposure review queue
        run: python scripts/run_external_evidence_8f_exposure_review_queue.py --output /tmp/external_evidence_8f_exposure_review_queue.json

      - name: Validate and replay B1 human review idempotently
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py --output /tmp/external_evidence_8f_mapping_candidate_gate_b1.json
          python scripts/run_external_evidence_8f_mapping_review.py --output /tmp/external_evidence_8f_mapping_review_b1.json

      - name: Validate and replay active B2-B15 human reviews
        run: |
          set -euo pipefail
          for b in {2..15}; do
            candidates="configs/external_evidence_8f_mapping_candidates_b${b}_v1.json"
            review="configs/external_evidence_8f_mapping_review_decisions_b${b}_v1.json"
            python scripts/run_external_evidence_8f_mapping_candidate_gate.py \
              --candidates "$candidates" \
              --output "/tmp/external_evidence_8f_mapping_candidate_gate_b${b}.json"
            python scripts/run_external_evidence_8f_mapping_review.py \
              --candidates "$candidates" \
              --review "$review" \
              --output "/tmp/external_evidence_8f_mapping_review_b${b}.json"
          done

      - name: Validate B16 documentary candidates without promotion
        run: |
          python scripts/run_external_evidence_8f_mapping_candidate_gate.py \
            --candidates configs/external_evidence_8f_mapping_candidates_b16_v1.json \
            --output /tmp/external_evidence_8f_mapping_candidate_gate_b16.json
          python scripts/run_external_evidence_8f_mapping_review.py \
            --candidates configs/external_evidence_8f_mapping_candidates_b16_v1.json \
            --review configs/external_evidence_8f_mapping_review_decisions_b16_v1.json \
            --output /tmp/external_evidence_8f_mapping_review_b16_pending.json

      - name: Confirm current Phase 8F state is not falsely frozen
        run: python scripts/run_external_evidence_8f_completion_gate.py --output /tmp/external_evidence_8f_completion_gate.json

# CI performs no live macro-source or market-price requests.
# The live collector is tested only with deterministic fixture payloads in CI.
# Research-domain membership is frozen independently of mappings and outcomes.
# Documentary candidate mappings cannot enter the effective exposure map automatically.
# B1-B4 remain materialized in the 60-mapping base map; B5-B15 are append-only human-reviewed overlays.
# B16 contains documentary candidates only and remains pending human review; it must not change the effective map.
# Seven explicitly registered later re-reviews (six in B8, one SHOP/fx in B10) preserve their audit trail but are not double-counted.
# The effective map remains at 176 unique reviewed mappings while B16 is pending; 31 frozen-domain subjects remain unaccounted.
# B1-B15 human-review replay must be idempotent against the effective map, including registered redundant re-reviews.
# B16 pending-review replay must be idempotent and non-mutating.
# Unregistered conflicting duplicates remain fail-closed.
# No backdating, market direction, signed exposure, weights, thresholds, outcome research,
# cross-factor research, Phase-7 integration or production external-evidence enablement is allowed here.
