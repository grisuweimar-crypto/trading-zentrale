name: Phase 8F Macro Exposure Context

on:
  pull_request:
    paths:
      - "configs/external_evidence_8f_macro_exposure_v1.json"
      - "configs/external_evidence_8f_exposure_map_v1.json"
      - "configs/external_evidence_8f_source_candidates_v1.json"
      - "configs/external_evidence_8f_market_proxies_v1.json"
      - "configs/external_evidence_8f_completion_v1.json"
      - "src/scanner/research/external_evidence/macro_exposure_8f.py"
      - "src/scanner/research/external_evidence/source_candidates_8f.py"
      - "src/scanner/research/external_evidence/market_proxies_8f.py"
      - "src/scanner/research/external_evidence/series_catalog_8f.py"
      - "src/scanner/research/external_evidence/bls_cpi_8f.py"
      - "src/scanner/research/external_evidence/eia_energy_8f.py"
      - "src/scanner/research/external_evidence/fed_h15_8f.py"
      - "src/scanner/research/external_evidence/ecb_fx_8f.py"
      - "src/scanner/research/external_evidence/macro_ledger_8f.py"
      - "src/scanner/research/external_evidence/completion_8f.py"
      - "scripts/run_external_evidence_8f_contract_gate.py"
      - "scripts/run_external_evidence_8f_macro_ledger.py"
      - "scripts/run_external_evidence_8f_completion_gate.py"
      - "tests/test_external_evidence_8f_macro_exposure.py"
      - "tests/test_external_evidence_8f_source_candidates.py"
      - "tests/test_external_evidence_8f_market_proxies.py"
      - "tests/test_external_evidence_8f_series_catalog.py"
      - "tests/test_external_evidence_8f_source_adapters.py"
      - "tests/test_external_evidence_8f_macro_ledger.py"
      - "tests/test_external_evidence_8f_completion.py"
      - "docs/external_evidence_8f_macro_exposure.md"
      - "docs/external_evidence_8f_market_proxies.md"
      - ".github/workflows/external_evidence_8f_macro_exposure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate Phase 8F foundation, adapters, ledger, completion, routing and proxy guards
        run: >-
          python -m pytest -q
          tests/test_external_evidence_8f_macro_exposure.py
          tests/test_external_evidence_8f_source_candidates.py
          tests/test_external_evidence_8f_market_proxies.py
          tests/test_external_evidence_8f_series_catalog.py
          tests/test_external_evidence_8f_source_adapters.py
          tests/test_external_evidence_8f_macro_ledger.py
          tests/test_external_evidence_8f_completion.py
      - name: Verify Phase 8F contract gate CLI
        run: python scripts/run_external_evidence_8f_contract_gate.py --help
      - name: Verify Phase 8F macro ledger CLI
        run: python scripts/run_external_evidence_8f_macro_ledger.py --help
      - name: Verify Phase 8F completion gate CLI
        run: python scripts/run_external_evidence_8f_completion_gate.py --help
      - name: Execute Phase 8F foundation contract gate
        run: python scripts/run_external_evidence_8f_contract_gate.py --output /tmp/external_evidence_8f_contract_gate.json
      - name: Confirm current Phase 8F state is not falsely frozen
        run: python scripts/run_external_evidence_8f_completion_gate.py --output /tmp/external_evidence_8f_completion_gate.json

# CI intentionally performs no live macro-source or market-price requests.
# BLS historical PIT is accepted only from an archived release with an independently proven exact timestamp.
# EIA, Fed H.15 and ECB current-history data remain prospective-only unless separate historical archive proof is introduced.
# Macro observations are stored append-only; later revisions may not overwrite prior vintages.
# The completion gate must remain BLOCKED until a real ledger, reviewed exposure mappings and explicit research-domain accounting exist.
# FRED/ALFRED remains explicitly blocked under the currently reviewed terms.
# Uranium/lithium ETFs, physical-trust NAVs and futures are challenger proxies only; they are not relabelled as spot.
# No macro factor direction, signed asset exposure, outcome research, threshold/weight selection,
# cross-factor interaction research, Phase-7 integration or production enablement is allowed here.
