name: QM-B Project Investability

on:
  pull_request:
    paths:
      - "configs/qm_b_project_investability_v1.json"
      - "src/scanner/research/governance/qm_b_project_investability.py"
      - "scripts/qm_b_project_investability.py"
      - "tests/test_qm_b_project_investability.py"
      - "docs/qm_b_project_investability.md"
      - ".github/workflows/qm_b_project_investability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b-project-investability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run project investability tests
        run: PYTHONPATH=src python -m pytest -q tests/test_qm_b_project_investability.py
      - name: Audit current durable membership snapshot
        run: |
          MEMBERSHIP="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/research/qm/qm_b_membership/latest.json').read_text())
          print(p['normalized_snapshot_path'])
          PY
          )"
          PYTHONPATH=src python scripts/qm_b_project_investability.py --membership "$MEMBERSHIP" --output /tmp/qm_b_investability.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qm_b_investability.json'))
          assert p['instrument_count'] == 207
          assert p['status_counts'] == {'UNKNOWN': 207}
          assert p['strict_universe_promotion_ready_count'] == 0
          assert p['evidence_gap_counts']['stable_identity'] == 0
          assert p['evidence_gap_counts']['project_membership'] == 0
          for k in ['listing_state','market_tradability','execution_channel','project_restrictions']:
              assert p['evidence_gap_counts'][k] == 207
          print(json.dumps({
            'instrument_count': p['instrument_count'],
            'status_counts': p['status_counts'],
            'evidence_gap_counts': p['evidence_gap_counts'],
            'strict_universe_promotion_ready_count': p['strict_universe_promotion_ready_count'],
          }, indent=2, sort_keys=True))
          PY
