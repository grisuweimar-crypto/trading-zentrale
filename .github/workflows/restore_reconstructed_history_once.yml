name: Restore reconstructed score history once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore_reconstructed_history_once.yml'

permissions:
  contents: write

concurrency:
  group: restore-reconstructed-history-once
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch verified reconstruction source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chatgpt-history-reconstruction-20260916:refs/remotes/origin/chatgpt-history-reconstruction-20260916
          git show origin/chatgpt-history-reconstruction-20260916:artifacts/reconstruction_temp/score_history_reconstructed.csv > "$RUNNER_TEMP/score_history_reconstructed.csv"
          git show origin/chatgpt-history-reconstruction-20260916:artifacts/reconstruction_temp/reconstruction_report.json > "$RUNNER_TEMP/reconstruction_report.json"

      - name: Merge only reconstructed blanks into production archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          source = Path('artifacts/snapshots/score_history.csv')
          reconstructed = Path(os.environ['RUNNER_TEMP']) / 'score_history_reconstructed.csv'
          report_path = Path(os.environ['RUNNER_TEMP']) / 'reconstruction_report.json'
          recent_path = Path('artifacts/snapshots/score_history_recent.csv')

          targets = ['close', 'volatility', 'drawdown', 'rs3m', 'trend200']
          identity = ['date', 'symbol', 'name']
          expected_filled = {
              'close': 0,
              'volatility': 32988,
              'drawdown': 32988,
              'rs3m': 10,
              'trend200': 10,
          }
          expected_missing = {
              'close': 0,
              'volatility': 390,
              'drawdown': 390,
              'rs3m': 11,
              'trend200': 327,
          }

          def read_csv(path):
              with path.open('r', encoding='utf-8-sig', newline='') as handle:
                  reader = csv.reader(handle, strict=True)
                  rows = list(reader)
              if not rows:
                  raise RuntimeError(f'Empty CSV: {path}')
              return rows[0], rows[1:]

          header, original_rows = read_csv(source)
          recon_header, recon_rows = read_csv(reconstructed)
          if header != recon_header:
              raise RuntimeError('Reconstruction schema differs from production archive')
          if len(original_rows) != 33825 or len(recon_rows) != len(original_rows):
              raise RuntimeError(f'Unexpected row count: production={len(original_rows)} reconstruction={len(recon_rows)}')

          idx = {name: header.index(name) for name in header}
          fills = {name: 0 for name in targets}
          merged_rows = []

          for number, (old, new) in enumerate(zip(original_rows, recon_rows), start=2):
              if len(old) != len(header) or len(new) != len(header):
                  raise RuntimeError(f'Field-count mismatch at CSV row {number}')
              for key in identity:
                  if old[idx[key]] != new[idx[key]]:
                      raise RuntimeError(f'Row identity mismatch at CSV row {number}: {key}')

              merged = list(old)
              for field in targets:
                  col = idx[field]
                  if not old[col].strip() and new[col].strip():
                      merged[col] = new[col]
                      fills[field] += 1
              merged_rows.append(merged)

          if fills != expected_filled:
              raise RuntimeError(f'Unexpected fill counts: {fills} != {expected_filled}')

          missing = {
              field: sum(1 for row in merged_rows if not row[idx[field]].strip())
              for field in targets
          }
          if missing != expected_missing:
              raise RuntimeError(f'Unexpected final missing counts: {missing} != {expected_missing}')

          # Integrity gate: no pre-existing value and no non-target field may change.
          for number, (old, merged) in enumerate(zip(original_rows, merged_rows), start=2):
              for col, field in enumerate(header):
                  protected = field not in targets or bool(old[col].strip())
                  if protected and old[col] != merged[col]:
                      raise RuntimeError(f'Protected cell changed at CSV row {number}, column {field}')

          with source.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.writer(handle, lineterminator='\n')
              writer.writerow(header)
              writer.writerows(merged_rows)

          # Rebuild the production 12-week recent archive from the restored full archive.
          parsed_dates = [date.fromisoformat(row[idx['date']]) for row in merged_rows]
          newest = max(parsed_dates)
          cutoff = newest - timedelta(weeks=12)
          filtered = [row for row, dt in zip(merged_rows, parsed_dates) if dt >= cutoff]
          last_position = {}
          for pos, row in enumerate(filtered):
              last_position[(row[idx['date']], row[idx['symbol']])] = pos
          recent_rows = [
              row for pos, row in enumerate(filtered)
              if last_position[(row[idx['date']], row[idx['symbol']])] == pos
          ]
          if len(recent_rows) != 14521:
              raise RuntimeError(f'Unexpected recent-row count: {len(recent_rows)}')
          recent_path.parent.mkdir(parents=True, exist_ok=True)
          with recent_path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.writer(handle, lineterminator='\n')
              writer.writerow(header)
              writer.writerows(recent_rows)

          report = json.loads(report_path.read_text(encoding='utf-8'))
          unresolved = report.get('unresolved_after', {})
          for field, count in expected_missing.items():
              if unresolved.get(field) != count:
                  raise RuntimeError(f'Reconstruction report mismatch for {field}: {unresolved.get(field)} != {count}')

          print('Rows:', len(merged_rows))
          print('Filled:', fills)
          print('Remaining blanks:', missing)
          print('Recent rows:', len(recent_rows), 'from', cutoff.isoformat(), 'to', newest.isoformat())
          PY

      - name: Refresh read-only research mirror and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          root = Path.cwd()
          script = root / 'scripts' / 'generate_history_research.py'
          spec = importlib.util.spec_from_file_location('history_research_restore', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          metadata = module.build_research(root)

          full = root / 'artifacts' / 'snapshots' / 'score_history.csv'
          research = root / 'artifacts' / 'research' / 'history_research.csv'
          if full.read_bytes() != research.read_bytes():
              raise RuntimeError('Research mirror is not byte-identical to restored score history')
          sha = hashlib.sha256(full.read_bytes()).hexdigest()
          if metadata.get('source_sha256') != sha:
              raise RuntimeError('Research metadata source hash does not match restored history')
          if metadata.get('source_row_count') != 33825:
              raise RuntimeError(f"Unexpected research row count: {metadata.get('source_row_count')}")
          print('Research source SHA256:', sha)
          print('Research validation:', json.dumps(metadata.get('validation', {}), ensure_ascii=False))
          PY

      - name: Commit restored production history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub Action Bot'
          git config user.email 'action@github.com'
          git add -- artifacts/snapshots/score_history.csv artifacts/snapshots/score_history_recent.csv artifacts/research/history_research.csv artifacts/research/history_research_metadata.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Restore reconstructed scanner history [skip ci]'
          git push origin HEAD:main
