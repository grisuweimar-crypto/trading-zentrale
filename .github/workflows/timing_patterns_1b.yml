name: Phase 1B Timing Patterns

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/scanner/reports/timing_patterns.py'
      - 'scripts/run_timing_patterns_1b.py'
      - 'tests/test_timing_patterns.py'
      - 'docs/timing_patterns_1b.md'
      - '.github/workflows/timing_patterns_1b.yml'
  push:
    branches: [main]
    paths:
      - 'src/scanner/reports/timing_patterns.py'
      - 'scripts/run_timing_patterns_1b.py'
      - 'tests/test_timing_patterns.py'
      - 'artifacts/research/history_analysis.csv'
      - 'artifacts/research/price_backfill.csv'
      - '.github/workflows/timing_patterns_1b.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Regression tests
        run: python -m pytest -q tests/test_timing_patterns.py
      - name: Run Phase 1B
        run: python scripts/run_timing_patterns_1b.py
      - name: Print summary
        run: |
          python - <<'PY'
          import json
          with open('artifacts/research/timing_patterns_1b.json', encoding='utf-8') as f:
              p=json.load(f)
          print('COVERAGE', json.dumps(p['coverage'], sort_keys=True))
          for h in ('5','20','40','60'):
              s=p['horizons'][h]
              discovery=s['continuous_changes'].get('discovery', {})
              validation=s['continuous_changes'].get('validation', {})
              d_ranked=sorted(discovery.items(), key=lambda kv: abs(kv[1].get('spearman') or 0), reverse=True)[:8]
              v_ranked=sorted(validation.items(), key=lambda kv: abs(kv[1].get('spearman') or 0), reverse=True)[:8]
              pat=s['patterns']
              print('HORIZON',h)
              print('CONT_DISCOVERY_TOP', json.dumps(d_ranked, sort_keys=True))
              print('CONT_VALIDATION_TOP', json.dumps(v_ranked, sort_keys=True))
              print('FROZEN_POS', json.dumps(pat.get('frozen_positive', [])[:8], sort_keys=True))
              print('FROZEN_NEG', json.dumps(pat.get('frozen_negative', [])[:8], sort_keys=True))
              print('VALIDATION_CONFIRMED', json.dumps(pat.get('validation_confirmed', [])[:12], sort_keys=True))
              print('CATEGORICAL_DISCOVERY', json.dumps(s['categorical_states'].get('discovery', {}), sort_keys=True))
              print('CATEGORICAL_VALIDATION', json.dumps(s['categorical_states'].get('validation', {}), sort_keys=True))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: timing-patterns-1b
          path: artifacts/research/timing_patterns_1b.json
          if-no-files-found: error
