name: BA-QM6 Elliott Challenger Research

on:
  pull_request:
    paths:
      - "src/scanner/research/governance/qm_g_*.py"
      - "configs/qm_g_*.json"
      - "configs/ba_qm6_qm_g_closure_v1.json"
      - "src/scanner/research/governance/qm_f_closure.py"
      - "configs/ba_qm5_qm_f_closure_v1.json"
      - "src/scanner/research/governance/qm_c*.py"
      - "configs/qm_c*.json"
      - "src/scanner/research/governance/qm_i_*.py"
      - "configs/qm_i_evidence_lineage_v1.json"
      - "src/scanner/research/governance/qm_f_*.py"
      - "configs/qm_f_decision_ablation_v1.json"
      - "src/scanner/research/elliott_vnext/output.py"
      - "src/scanner/research/decision_layer/phase6_elliott.py"
      - "src/scanner/research/decision_layer/depot_action_policy.py"
      - "tests/test_qm_g_*.py"
      - "tests/test_qm_f_closure.py"
      - "tests/test_w6_elliott_6h_to_7f.py"
      - "tests/test_w8_action_matrix.py"
      - "docs/qm_g_elliott_challengers.md"
      - ".github/workflows/qm_g_elliott_challenger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run QM-G and frozen boundary regressions
        run: >-
          python -m pytest -q
          tests/test_qm_g_elliott_challengers.py
          tests/test_qm_g_scenario_stability.py
          tests/test_qm_g_challenger_evaluation.py
          tests/test_qm_g_closure.py
          tests/test_qm_f_decision_ablation.py
          tests/test_qm_f_closure.py
          tests/test_qm_i_lineage.py
          tests/test_w6_elliott_6h_to_7f.py
          tests/test_w8_action_matrix.py
      - name: Validate BA-QM6 closure
        run: python -c "from scanner.research.governance.qm_g_closure import validate_closure_file; print(validate_closure_file()['business_area_status'])"
