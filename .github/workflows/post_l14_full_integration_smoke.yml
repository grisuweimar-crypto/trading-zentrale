name: Post-L14 Full Integration Smoke

on:
  push:
    branches:
      - test/post-l14-full-integration-2026-10-07
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/post_l14_full_integration_smoke.yml"

permissions:
  contents: read

jobs:
  full-integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify new universe members
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          rows=list(csv.DictReader(open("data/inputs/universe_master.csv", encoding="utf-8")))
          counts=Counter(r["symbol"] for r in rows if r.get("active") == "1")
          assert counts["GOOGL"] == 1, counts["GOOGL"]
          assert counts["AVGO"] == 1, counts["AVGO"]
          assert counts["ANET"] == 1, counts["ANET"]
          print({"active_rows": sum(counts.values()), "GOOGL": counts["GOOGL"], "AVGO": counts["AVGO"], "ANET": counts["ANET"]})
          PY

      - name: Run Pattern Discovery L0-L14 regression
        run: >-
          python -m pytest -q
          tests/pattern_discovery/test_l0_boundary.py
          tests/pattern_discovery/test_l1_run_contract.py
          tests/pattern_discovery/test_l2_feature_library.py
          tests/pattern_discovery/test_l3_search_engine.py
          tests/pattern_discovery/test_l4_statistical_guard.py
          tests/pattern_discovery/test_l5_candidate_registry.py
          tests/pattern_discovery/test_l6_dependency_graph.py
          tests/pattern_discovery/test_l7_prospective_capture.py
          tests/pattern_discovery/test_l8_outcome_maturation.py
          tests/pattern_discovery/test_l9_confirmation_engine.py
          tests/pattern_discovery/test_l10_rating_engine.py
          tests/pattern_discovery/test_l11_pattern_library.py
          tests/pattern_discovery/test_l12_promotion_gate.py
          tests/pattern_discovery/test_l13_decision_challenger.py
          tests/pattern_discovery/test_l14_continuous_operations.py

      - name: Prepare real scanner run
        env:
          SCANNER_REQUIRE_PROVENANCE: "1"
          SCANNER_FETCH_YAHOO: "1"
        run: python scripts/generate_research_views.py --begin-run --receipt "$RUNNER_TEMP/scanner-run.json"

      - name: Run real scanner without publication
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TELEGRAM_ENABLED: "0"
          SCANNER_FETCH_YAHOO: "1"
          SCANNER_REQUIRE_PROVENANCE: "1"
        run: python -m scanner.app.run_daily

      - name: Build real research views
        env:
          SCANNER_REQUIRE_PROVENANCE: "1"
        run: |
          EXPECTED_SYMBOL_COUNT="$(python - <<'PY'
          import csv
          rows=list(csv.DictReader(open("data/inputs/universe_master.csv", encoding="utf-8")))
          print(len({r["symbol"] for r in rows if r.get("active") == "1"}))
          PY
          )"
          echo "Expected active unique symbols: $EXPECTED_SYMBOL_COUNT"
          python scripts/generate_research_views.py --receipt "$RUNNER_TEMP/scanner-run.json" --scanner-status success --expected-symbol-count "$EXPECTED_SYMBOL_COUNT"
          python scripts/prefetch_market_history.py --minimum-sessions 300
          python scripts/generate_research_views.py --refresh-prices
          python scripts/generate_daily_research.py
          python scripts/build_current_decision_evidence_7a.py --archive

      - name: Verify AVGO and ANET survived scanner/research pipeline
        run: |
          python - <<'PY'
          import csv, json
          rows=list(csv.DictReader(open("artifacts/research/latest_scanner.csv", encoding="utf-8")))
          def symbol(row):
              return row.get("symbol") or row.get("Symbol") or row.get("ticker") or row.get("Ticker")
          counts={}
          for row in rows:
              s=symbol(row)
              counts[s]=counts.get(s,0)+1
          assert counts.get("GOOGL") == 1, counts.get("GOOGL")
          assert counts.get("AVGO") == 1, counts.get("AVGO")
          assert counts.get("ANET") == 1, counts.get("ANET")
          meta=json.load(open("artifacts/research/history_metadata.json", encoding="utf-8"))
          assert meta["latest_run_complete"] is True
          assert meta["validation"]["status"] == "ok"
          assert meta["validation"]["symbol_count"] == len(rows), (meta["validation"]["symbol_count"], len(rows))
          print({
              "snapshot_id": meta["snapshot_id"],
              "scanner_rows": len(rows),
              "GOOGL": counts.get("GOOGL"),
              "AVGO": counts.get("AVGO"),
              "ANET": counts.get("ANET"),
          })
          PY

      - name: Run L14 against freshly generated real artifacts
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from scanner.research.pattern_discovery import build_operations_cycle, verify_operations_cycle
          now=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
          cycle=build_operations_cycle(".", evaluated_at=now)
          verified=verify_operations_cycle(cycle)
          print(json.dumps({
              "pre_assert_cycle_status": cycle["cycle_status"],
              "pre_assert_blocking_reasons": cycle["blocking_reasons"],
              "pre_assert_qm_audit": cycle["qm_audit"],
          }, sort_keys=True))
          assert verified["valid"] is True
          assert cycle["cycle_status"] != "BLOCKED_FAIL_CLOSED", cycle["blocking_reasons"]
          assert cycle["boundaries"]["l12_promotion_performed"] is False
          assert cycle["boundaries"]["l13_regular_integration_performed"] is False
          assert cycle["boundaries"]["productive_decision_change_performed"] is False
          negative=[x for x in cycle["work_items"] if x["stage"]=="NEGATIVE_RESULT_AUDIT"][0]
          assert negative["authority"] == "QM-C5"
          assert negative["parallel_registry_created"] is False
          print(json.dumps({
              "cycle_hash": cycle["cycle_hash"],
              "cycle_status": cycle["cycle_status"],
              "blocking_reasons": cycle["blocking_reasons"],
              "discovery_trigger": cycle["discovery"]["trigger"],
              "laboratory_state": cycle["laboratory_state"],
              "work_items": [{"stage":x["stage"],"status":x["status"]} for x in cycle["work_items"]],
              "decay_alert_count": len(cycle["decay_alerts"]),
          }, sort_keys=True))
          PY

      - name: Validate research coherence
        run: |
          python scripts/generate_research_views.py --validate-only
          python scripts/validate_contract.py
# one-shot trigger commit
