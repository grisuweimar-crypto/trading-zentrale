name: Pattern Discovery L14 Continuous Operations

on:
  pull_request:
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "src/scanner/research/governance/**"
      - "tests/pattern_discovery/**"
      - "tests/test_qm_c*.py"
      - "tests/test_ba_qm12_continuous_qm.py"
      - "docs/pattern_discovery/**"
      - "scripts/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l14.yml"
  push:
    branches: [main]
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "src/scanner/research/governance/**"
      - "tests/pattern_discovery/**"
      - "docs/pattern_discovery/**"
      - "scripts/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l14.yml"
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-discovery-l14-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l14-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Pattern Discovery L0-L14 tests
        run: >-
          python -m pytest -q
          tests/pattern_discovery/test_l0_boundary.py
          tests/pattern_discovery/test_l1_run_contract.py
          tests/pattern_discovery/test_l2_feature_library.py
          tests/pattern_discovery/test_l3_search_engine.py
          tests/pattern_discovery/test_l4_statistical_guard.py
          tests/pattern_discovery/test_l5_candidate_registry.py
          tests/pattern_discovery/test_l6_dependency_graph.py
          tests/pattern_discovery/test_l7_prospective_capture.py
          tests/pattern_discovery/test_l8_outcome_maturation.py
          tests/pattern_discovery/test_l9_confirmation_engine.py
          tests/pattern_discovery/test_l10_rating_engine.py
          tests/pattern_discovery/test_l11_pattern_library.py
          tests/pattern_discovery/test_l12_promotion_gate.py
          tests/pattern_discovery/test_l13_decision_challenger.py
          tests/pattern_discovery/test_l14_continuous_operations.py

      - name: Run L13 seal regression
        run: python -m pytest -q tests/pattern_discovery/test_l13_decision_challenger.py

      - name: Run QM-C governance regressions
        run: >-
          PYTHONPATH=src python -m pytest -q
          tests/test_qm_c_hypothesis_registry.py
          tests/test_qm_c_analysis_plan.py
          tests/test_qm_c_six_step_structure.py

      - name: Run BA-QM12 continuous-QM compatibility
        run: python -m pytest -q tests/test_ba_qm12_continuous_qm.py

      - name: Verify L14 workflow contains a real schedule
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/pattern_discovery_l14.yml').read_text()
          assert 'schedule:' in text
          assert 'workflow_dispatch:' in text
          assert 'run_l14_operations.py cycle' in text
          PY

  scheduled-cycle:
    permissions:
      contents: write
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
      && github.ref == 'refs/heads/main'
    needs: l14-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Build and persist L14 operations cycle
        run: |
          evaluated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/pattern_discovery/run_l14_operations.py cycle             --evaluated-at "$evaluated_at"             --persist             --actor-id "github-actions"             --actor-role "research_automation"             > /tmp/l14-cycle.json
          cat /tmp/l14-cycle.json
      - name: Verify real L14 cycle, pointer and hash chain before publishing
        run: |
          python scripts/pattern_discovery/run_l14_operations.py verify-registry
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.pattern_discovery import verify_operations_cycle
          result = json.loads(Path('/tmp/l14-cycle.json').read_text())
          assert result['persisted']['valid'] is True
          pointer_path = Path(result['persisted']['latest_path'])
          pointer = json.loads(pointer_path.read_text())
          assert pointer['cycle_hash'] == result['cycle_hash']
          cycle_path = Path(pointer['cycle_path'])
          assert cycle_path.is_file()
          cycle = json.loads(cycle_path.read_text())
          assert verify_operations_cycle(cycle)['valid'] is True
          assert cycle['cycle_status'] == result['cycle_status']
          assert cycle['discovery']['manifest_count'] == len(list(Path(
              'artifacts/research/pattern_discovery/discovery_runs'
          ).glob('*/manifest.json')))
          print({
              'cycle_hash': cycle['cycle_hash'],
              'status': cycle['cycle_status'],
              'frozen_patterns': cycle['laboratory_state']['frozen_pattern_count'],
              'prospective_claims': cycle['laboratory_state']['claim_count'],
              'matured_outcomes': cycle['laboratory_state']['matured_outcome_count'],
              'discovery_manifest_count': cycle['discovery']['manifest_count'],
          })
          PY
      - name: Persist operations receipt on main
        run: |
          # Stage new immutable cycle artifacts as well as changes to the registry/pointer.
          # An unstaged git diff never sees untracked first-run receipts.
          git add -A -- artifacts/research/pattern_discovery/operations/
          if git diff --cached --quiet -- artifacts/research/pattern_discovery/operations/; then
            echo "No L14 receipt changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "🧪 Publish Pattern Discovery L14 operations receipt [skip ci]"
          git push origin HEAD:main
      - name: Enforce fail-closed cycle result
        run: |
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/l14-cycle.json'))
          assert payload['cycle_status'] != 'BLOCKED_FAIL_CLOSED', payload
          PY
