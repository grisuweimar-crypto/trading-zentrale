name: Phase 8C-H Semantic Challenger

on:
  pull_request:
    paths:
      - "configs/external_evidence_8c_semantic_challenger_v1.json"
      - "src/scanner/research/external_evidence/semantic_challenger.py"
      - "scripts/run_external_evidence_8c_semantic_challenger.py"
      - "tests/test_external_evidence_8c_semantic_challenger.py"
      - "docs/external_evidence_8c_h_semantic_challenger.md"
      - ".github/workflows/external_evidence_8c_h_semantic_challenger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 8C-H semantic challenger guards
        run: python -m pytest -q tests/test_external_evidence_8c_semantic_challenger.py
      - name: Run semantic challenger self-test
        run: python scripts/run_external_evidence_8c_semantic_challenger.py --self-test
