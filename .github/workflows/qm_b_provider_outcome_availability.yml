name: QM-B Provider Outcome Availability

on:
  pull_request:
    paths:
      - "configs/qm_b_provider_outcome_availability_v1.json"
      - "src/scanner/research/governance/qm_b_provider_outcome_availability.py"
      - "scripts/qm_b_provider_outcome_availability.py"
      - "scripts/qm_b_provider_outcome_diagnostics.py"
      - "scripts/qm_b_market_date_semantics_diagnostics.py"
      - "tests/test_qm_b_provider_outcome_availability.py"
      - "docs/qm_b_provider_outcome_availability.md"
      - ".github/workflows/qm_b_provider_outcome_availability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b-provider-outcome-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest -q tests/test_qm_b_provider_outcome_availability.py
      - name: Run frozen provider/outcome audit
        run: |
          PYTHONPATH=src python scripts/qm_b_provider_outcome_availability.py --output /tmp/qm_b_provider_outcome.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/qm_b_provider_outcome.json'))
          assert p['audit_gate_status'] == 'PASS'
          assert p['historical_retrojection_permitted'] is False
          assert p['missing_or_unknown_outcomes_enter_denominator'] is False
          assert p['strict_provider_coverage_ledger_promoted'] is False
          assert p['strict_outcome_availability_ledger_promoted'] is False
          assert p['provider_coverage']['current_symbol_count'] > 0
          assert p['outcome_availability']['scanner_event_count'] > 0
          for horizon, row in p['outcome_availability']['horizons'].items():
              assert row['event_count'] == p['outcome_availability']['scanner_event_count']
              assert row['denominator_eligible_count'] == row['availability_counts']['AVAILABLE']
              assert row['denominator_excluded_count'] == row['availability_counts']['MISSING'] + row['availability_counts']['UNKNOWN']
              assert row['availability_counts']['AVAILABLE'] > 0
          print(json.dumps({
              'provider': p['provider_coverage']['classification_counts'],
              'events': p['outcome_availability']['scanner_event_count'],
              'horizons': {h:r['availability_counts'] for h,r in p['outcome_availability']['horizons'].items()},
              'price_diagnostics': p['outcome_availability']['price_diagnostics'],
          }, indent=2, sort_keys=True))
          PY
      - name: Decompose missing start prices and unresolved targets
        run: PYTHONPATH=src python scripts/qm_b_provider_outcome_diagnostics.py --output /tmp/qm_b_provider_outcome_diagnostics.json
      - name: Trace market_date semantics
        run: PYTHONPATH=src python scripts/qm_b_market_date_semantics_diagnostics.py --output /tmp/qm_b_market_date_semantics.json
