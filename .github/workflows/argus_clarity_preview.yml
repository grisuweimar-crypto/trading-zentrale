name: ARGUS Clarity Preview

on:
  pull_request:
    branches: [main]
    paths:
      - "argus-preview/index.html"
      - "argus-preview/argus-theme.css"
      - "argus-preview/argus-shell.js"
      - "argus-preview/assets/**"
      - "argus-preview/v7/**"
      - "argus-preview/observations/**"
      - "tests/test_argus_clarity_preview.py"
      - "tests/test_argus_site_shell.py"
      - "tests/fixtures/argus_shell_acceptance.html"
      - "tests/test_argus_observation_render.js"
      - "tests/argus_real_browser_smoke.py"
      - "tests/fixtures/argus_editorial_preview.html"
      - ".github/workflows/argus_clarity_preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: |
          node --check argus-preview/argus-shell.js
          node --check argus-preview/v7/research-lab.js
          node --check argus-preview/v7/external-thesis-lab.js
          node --check argus-preview/v7/qm-monitor.js
          node --check argus-preview/observations/external-thesis-watch.js
          node --check argus-preview/observations/argus-help.js
      - name: Render historic external-thesis cards with mocked published sources
        run: node tests/test_argus_observation_render.js
      - name: Verify unchanged research and source boundaries
        run: python -m unittest discover -s tests -p 'test_argus_clarity_preview.py' -v
      - name: Verify footer, original logo and theme boundaries
        run: python -m unittest discover -s tests -p 'test_argus_site_shell.py' -v
      - name: Render actual ARGUS cards in Chrome at desktop and mobile sizes
        run: python tests/argus_real_browser_smoke.py
      - name: Upload visual comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-visual-check
          path: artifacts/ui-visual-check/*.png
          if-no-files-found: warn
