name: QM-B Prospective Identity Match

on:
  pull_request:
    paths:
      - "configs/qm_b_prospective_identity_match_v1.json"
      - "src/scanner/research/governance/qm_b_prospective_identity_match.py"
      - "scripts/qm_b_prospective_identity_match.py"
      - "tests/test_qm_b_prospective_identity_match.py"
      - "docs/qm_b_prospective_identity_match.md"
      - ".github/workflows/qm_b_prospective_identity_match.yml"
      - "src/scanner/research/governance/qm_b_identity_reconciliation.py"
      - "data/inputs/universe_master.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b-prospective-identity-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run prospective identity-match tests
        run: |
          PYTHONPATH=src python -m pytest -q tests/test_qm_b_prospective_identity_match.py
      - name: Verify current universe can be fingerprinted without promotion
        run: |
          PYTHONPATH=src python - <<'PY'
          from scanner.research.governance.qm_b_prospective_identity_match import load_universe_snapshot
          rows, digest = load_universe_snapshot('data/inputs/universe_master.csv')
          assert rows
          assert len(digest) == 64
          print({'row_count': len(rows), 'sha256': digest})
          PY
