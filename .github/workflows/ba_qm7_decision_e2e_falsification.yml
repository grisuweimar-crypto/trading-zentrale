name: BA-QM7 Decision and E2E Falsification

on:
  pull_request:
    paths:
      - "configs/qm_j_decision_e2e_falsification_v1.json"
      - "src/scanner/research/governance/qm_j_decision_e2e.py"
      - "src/scanner/research/governance/qm_j_negative_controls.py"
      - "src/scanner/research/decision_layer/**"
      - "scripts/run_qm_j_decision_e2e_falsification.py"
      - "tests/test_qm_j_decision_e2e.py"
      - "artifacts/research/daily_research.json"
      - "artifacts/research/decision_evidence_7a.jsonl"
      - "artifacts/research/decision_snapshot_w10.json"
      - ".github/workflows/ba_qm7_decision_e2e_falsification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-e2e-falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run QM-J and Decision/W11/W12 regressions
        run: >-
          python -m pytest -q
          tests/test_qm_j_decision_e2e.py
          tests/test_qm_j_negative_controls.py
          tests/test_w11_end_to_end_acceptance.py
          tests/test_w12_ferrari_regression.py
      - name: Run frozen Decision and E2E falsification
        run: >-
          python scripts/run_qm_j_decision_e2e_falsification.py
          --output /tmp/qm_j_decision_e2e_falsification.json
      - name: Upload falsification result
        uses: actions/upload-artifact@v4
        with:
          name: qm-j-decision-e2e-falsification
          path: /tmp/qm_j_decision_e2e_falsification.json
          retention-days: 14
