name: Decision Watch Integration Pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decision_watch_pipeline.yml'
      - 'scripts/build_integrated_decision_evidence_7a.py'
      - 'scripts/run_w10_snapshot_orchestration.py'
      - 'scripts/build_elliott_w6_source.py'
      - 'src/scanner/research/decision_layer/current_evidence.py'
      - 'src/scanner/research/decision_layer/evidence_archive.py'
      - 'src/scanner/research/decision_layer/w10_orchestration.py'
      - 'src/scanner/research/decision_layer/phase6_elliott.py'
  workflow_run:
    workflows: ['Phase 2 Probability Calibration', 'Phase 5E Adaptive Shadow and Promotion', 'Module 6 Elliott Prospective Shadow']
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/decision_watch_pipeline.yml'
      - 'scripts/build_integrated_decision_evidence_7a.py'
      - 'scripts/run_confidence_vnext_research_4.py'
      - 'scripts/run_w10_snapshot_orchestration.py'
      - 'scripts/build_elliott_w6_source.py'
      - 'scripts/run_depot_watch_orchestrated.py'
      - 'src/scanner/research/decision_layer/integrated_evidence.py'
      - 'src/scanner/research/decision_layer/phase4_confidence.py'
      - 'src/scanner/research/decision_layer/phase5_shadow.py'
      - 'src/scanner/research/decision_layer/depot_watch_orchestrator.py'
      - 'src/scanner/research/decision_layer/phase6_elliott.py'
      - 'src/scanner/research/decision_layer/w10_orchestration.py'
      - 'tests/test_decision_integrated_evidence.py'
      - 'tests/test_w4_confidence_snapshot_identity.py'
      - 'tests/test_w5_phase5_shadow_integration.py'
      - 'tests/test_decision_depot_watch_orchestration.py'
      - 'tests/test_w6_elliott_6h_to_7f.py'
      - 'tests/test_w10_snapshot_orchestration.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('decision-watch-integration-pr-{0}', github.event.pull_request.number) || 'decision-watch-integration-main' }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run Decision integration regressions
        run: >-
          pytest -q
          tests/test_decision_integrated_evidence.py
          tests/test_w4_confidence_snapshot_identity.py
          tests/test_w5_phase5_shadow_integration.py
          tests/test_decision_depot_watch_orchestration.py
          tests/test_decision_depot_watch_prospective_gate.py
          tests/test_decision_universal_stance_7d.py
          tests/test_decision_state_transitions_7e.py
          tests/test_decision_portfolio_action_7f.py
          tests/test_decision_reliability_explainability_7g.py
          tests/test_decision_depot_watch_7h.py
          tests/test_w6_elliott_6h_to_7f.py
          tests/test_w10_snapshot_orchestration.py

      - name: Validate current isolated Phase 5E shadow report
        run: |
          PHASE5_PATH='artifacts/research/confidence_vnext_promotion_5e.json'
          git fetch origin phase4e-shadow-data:refs/remotes/origin/phase4e-shadow-data --force
          PHASE5_COMMIT=$(git log -1 --format=%H origin/phase4e-shadow-data -- "$PHASE5_PATH")
          test -n "$PHASE5_COMMIT"
          PHASE5_AVAILABLE_FROM=$(git show -s --format=%cI "$PHASE5_COMMIT")
          git show "$PHASE5_COMMIT:$PHASE5_PATH" > "$RUNNER_TEMP/confidence_vnext_promotion_5e.json"
          PHASE5_COMMIT="$PHASE5_COMMIT" PHASE5_AVAILABLE_FROM="$PHASE5_AVAILABLE_FROM" python - <<'PY'
          import json, os
          from pathlib import Path
          from scanner.research.decision_layer.phase5_shadow import phase5_shadow_context

          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'confidence_vnext_promotion_5e.json').read_text(encoding='utf-8'))
          normalized = phase5_shadow_context(
              report,
              source_commit=os.environ['PHASE5_COMMIT'],
              available_from=os.environ['PHASE5_AVAILABLE_FROM'],
          )
          context = normalized['context']
          assert context['production_change_performed'] is False
          assert context['current_symbol_shadow_policy_evaluated'] is False
          assert context['changes_universal_stance'] is False
          assert context['changes_portfolio_action'] is False
          assert set(context['insufficient_evidence_horizons']) | set(context['eligible_horizons_for_separate_promotion_review']) == {5, 20, 40, 60}
          print('W5 live Phase 5E shadow contract ok:', normalized['integration_mode'])
          PY

  integrate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[test]'

      - name: Validate authoritative scanner snapshot
        run: python scripts/generate_daily_research.py --validate-only

      - name: Initialize W10 same-snapshot lineage and bind persisted Phase 2
        run: |
          python scripts/run_w10_snapshot_orchestration.py init
          python scripts/run_w10_snapshot_orchestration.py record-git \
            --stage phase2_probability \
            --artifact artifacts/research/probability_calibration_2.json \
            --require-snapshot-match

      - name: Run unchanged Phase 3 Risk vNext for the current snapshot
        run: python scripts/run_risk_vnext_3.py --output "$RUNNER_TEMP/risk_vnext_3.json"

      - name: Record actual Phase 3 availability
        run: >-
          python scripts/run_w10_snapshot_orchestration.py record-runtime
          --stage phase3_risk
          --artifact "$RUNNER_TEMP/risk_vnext_3.json"

      - name: Run unchanged Phase 4 risk-scale guard
        run: python scripts/audit_phase4_risk_scale.py --output "$RUNNER_TEMP/confidence_vnext_risk_scale_4.json"

      - name: Build guarded Phase 4 current registry with exact snapshot identity
        run: >-
          python scripts/run_confidence_vnext_research_4.py
          --phase2 artifacts/research/probability_calibration_2.json
          --risk "$RUNNER_TEMP/risk_vnext_3.json"
          --risk-scale "$RUNNER_TEMP/confidence_vnext_risk_scale_4.json"
          --output "$RUNNER_TEMP/confidence_vnext_research_4.json"

      - name: Record actual Phase 4 availability
        run: >-
          python scripts/run_w10_snapshot_orchestration.py record-runtime
          --stage phase4_confidence
          --artifact "$RUNNER_TEMP/confidence_vnext_research_4.json"

      - name: Restore exact isolated Phase 5E shadow report and provenance
        run: |
          PHASE5_PATH='artifacts/research/confidence_vnext_promotion_5e.json'
          git fetch origin phase4e-shadow-data:refs/remotes/origin/phase4e-shadow-data --force
          PHASE5_COMMIT=$(git log -1 --format=%H origin/phase4e-shadow-data -- "$PHASE5_PATH")
          test -n "$PHASE5_COMMIT" || { echo 'Phase 5E shadow report provenance missing'; exit 1; }
          PHASE5_AVAILABLE_FROM=$(git show -s --format=%cI "$PHASE5_COMMIT")
          git show "$PHASE5_COMMIT:$PHASE5_PATH" > "$RUNNER_TEMP/confidence_vnext_promotion_5e.json"
          echo "PHASE5_SOURCE_COMMIT=$PHASE5_COMMIT" >> "$GITHUB_ENV"
          echo "PHASE5_AVAILABLE_FROM=$PHASE5_AVAILABLE_FROM" >> "$GITHUB_ENV"

      - name: Record real Phase 5 governance availability from Git provenance
        run: >-
          python scripts/run_w10_snapshot_orchestration.py record-git
          --stage phase5_governance
          --artifact "$RUNNER_TEMP/confidence_vnext_promotion_5e.json"
          --source-commit "$PHASE5_SOURCE_COMMIT"

      - name: Restore matching prospective Elliott capture and build temporary W6 source
        id: elliott
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_PATH='artifacts/research/elliott_vnext_prospective_current_6h.json'
          CAPTURE_FILE="$RUNNER_TEMP/elliott_vnext_prospective_current_6h.json"
          SOURCE_FILE="$RUNNER_TEMP/decision_elliott_6h_source_v1.json"
          echo "source_path=" >> "$GITHUB_OUTPUT"
          echo "capture_commit=" >> "$GITHUB_OUTPUT"

          git fetch origin elliott-vnext-shadow-data:refs/remotes/origin/elliott-vnext-shadow-data --force || true
          if ! git show-ref --verify --quiet refs/remotes/origin/elliott-vnext-shadow-data; then
            echo 'No Elliott shadow branch yet; Phase 6 remains not_supplied.'
            exit 0
          fi
          if ! git cat-file -e "origin/elliott-vnext-shadow-data:$CAPTURE_PATH" 2>/dev/null; then
            echo 'No prospective Elliott capture yet; Phase 6 remains not_supplied.'
            exit 0
          fi

          CAPTURE_COMMIT=$(git log -1 --format=%H origin/elliott-vnext-shadow-data -- "$CAPTURE_PATH")
          test -n "$CAPTURE_COMMIT"
          CAPTURE_AVAILABLE_FROM=$(git show -s --format=%cI "$CAPTURE_COMMIT")
          git show "$CAPTURE_COMMIT:$CAPTURE_PATH" > "$CAPTURE_FILE"

          set +e
          CAPTURE_FILE="$CAPTURE_FILE" python - <<'PY'
          import json
          import os
          from pathlib import Path

          daily = json.loads(Path('artifacts/research/daily_research.json').read_text(encoding='utf-8'))
          capture = json.loads(Path(os.environ['CAPTURE_FILE']).read_text(encoding='utf-8'))
          same = (
              str(capture.get('snapshot_id') or '') == str(daily.get('snapshot_id') or '')
              and str(capture.get('as_of') or '') == str(daily.get('as_of') or '')
          )
          if not same:
              raise SystemExit(1)
          if int(capture.get('output_count') or 0) <= 0:
              raise SystemExit(2)
          PY
          CAPTURE_STATE=$?
          set -e

          if [[ "$CAPTURE_STATE" -eq 0 ]]; then
            python scripts/build_elliott_w6_source.py \
              --capture "$CAPTURE_FILE" \
              --source-commit "$CAPTURE_COMMIT" \
              --evidence-available-from "$CAPTURE_AVAILABLE_FROM" \
              --output "$SOURCE_FILE"
            echo "source_path=$SOURCE_FILE" >> "$GITHUB_OUTPUT"
            echo "capture_commit=$CAPTURE_COMMIT" >> "$GITHUB_OUTPUT"
            echo "capture_available_from=$CAPTURE_AVAILABLE_FROM" >> "$GITHUB_OUTPUT"
          elif [[ "$CAPTURE_STATE" -eq 2 ]]; then
            echo 'Matching Elliott capture contains zero 6H outputs; Phase 6 remains not_supplied.'
          else
            echo 'Prospective Elliott capture belongs to another scanner snapshot; Phase 6 remains not_supplied.'
          fi

      - name: Resolve Phase 6 boundary explicitly before final 7A
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.elliott.outputs.source_path }}" ]]; then
            python scripts/run_w10_snapshot_orchestration.py resolve-phase6               --artifact "${{ steps.elliott.outputs.source_path }}"
          else
            python scripts/run_w10_snapshot_orchestration.py resolve-phase6
          fi

      - name: Freeze complete W10 upstream set before final 7A
        run: python scripts/run_w10_snapshot_orchestration.py freeze

      - name: Build final same-snapshot Phase 7A evidence with Phase 5 shadow context
        run: >-
          python scripts/build_integrated_decision_evidence_7a.py
          --phase4-report "$RUNNER_TEMP/confidence_vnext_research_4.json"
          --phase5-report "$RUNNER_TEMP/confidence_vnext_promotion_5e.json"
          --phase5-source-commit "$PHASE5_SOURCE_COMMIT"
          --phase5-available-from "$PHASE5_AVAILABLE_FROM"
          --archive
          --force-revision

      - name: Seal W10 final 7A and archive after upstream freeze
        run: |
          python scripts/run_w10_snapshot_orchestration.py seal
          python scripts/run_w10_snapshot_orchestration.py validate

      - name: Validate final packet set without portfolio data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          daily = json.loads(Path('artifacts/research/daily_research.json').read_text(encoding='utf-8'))
          packets = json.loads(Path('artifacts/research/current_decision_packets_7a.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('artifacts/research/decision_snapshot_w10.json').read_text(encoding='utf-8'))
          assert packets['snapshot_id'] == daily['snapshot_id'] == manifest['snapshot_id']
          assert manifest['status'] == 'sealed'
          assert manifest['guards']['later_evidence_backdating_allowed'] is False
          assert manifest['guards']['phase6_missing_is_neutral_evidence'] is False
          assert manifest['guards']['private_position_data_persisted'] is False
          assert manifest['stages']['phase6_elliott']['status'] in {'available', 'not_supplied'}
          phase6 = manifest['stages']['phase6_elliott']
          if phase6['status'] == 'available':
              assert phase6['snapshot_identity_state'] == 'verified'
              assert phase6['source_capture_id']
              assert phase6['output_count'] >= phase6['symbol_count'] >= 1
              assert phase6['multi_degree_reducer_used'] is False
              assert phase6['elliott_direction_used_as_vote'] is False
              assert phase6['decision_effect'] == 'review_only_downstream_of_7d_7e'
          else:
              assert phase6['decision_effect'] == 'none'
          assert packets['packet_count'] == daily['universe_size']
          assert packets['semantics']['integrated_evidence_v1'] is True
          assert packets['semantics']['phase2_phase3_phase4_outputs_consumed'] is True
          assert packets['semantics']['phase2_probability_source_preserved'] is True
          assert packets['semantics']['phase3_risk_source_preserved'] is True
          assert packets['semantics']['phase4_confidence_annotations_attached'] is True
          assert packets['semantics']['confidence_is_directional_vote'] is False
          assert packets['semantics']['confidence_encodes_attractiveness'] is False
          assert packets['validation']['phase4_same_snapshot_verified'] is True
          assert packets['validation']['phase4_snapshot_id'] == daily['snapshot_id']
          assert packets['semantics']['phase5_shadow_context_attached'] is True
          assert packets['semantics']['phase5_shadow_integration_mode'] in {'shadow_only', 'eligible_after_promotion_review'}
          assert packets['semantics']['phase5_current_symbol_policy_evaluated'] is False
          assert packets['semantics']['phase5_production_change_performed'] is False
          assert packets['semantics']['phase5_unpromoted_changes_decision'] is False
          assert packets['validation']['phase5_source_commit']
          assert packets['validation']['phase5_report_is_market_snapshot_evidence'] is False
          assert packets['semantics']['elliott_unpromoted_changes_decision'] is False
          assert packets['semantics']['external_evidence_phase8_activated'] is False
          assert {p['as_of'] for p in packets['packets']} == {packets['as_of']}
          assert all(p.get('orchestration_stage') == 'integrated_current_evidence_v1' for p in packets['packets'])
          for packet in packets['packets']:
              claim_ids = [row['claim_id'] for row in packet['evidence']]
              assert len(claim_ids) == len(set(claim_ids))
              phase5 = []
              for row in packet['evidence']:
                  if row['family'] == 'confidence':
                      payload_text = json.dumps(row['payload'], sort_keys=True)
                      assert '"direction"' not in payload_text
                      assert '"stance"' not in payload_text
                      assert '"vote"' not in payload_text
                      assert '"attractiveness"' not in payload_text
                      if row['payload'].get('context_type') == 'phase5_confidence_shadow_governance_v1':
                          phase5.append(row)
              assert len(phase5) == 1
              shadow = phase5[0]
              assert shadow['integration_mode'] in {'shadow_only', 'eligible_after_promotion_review'}
              assert shadow['payload']['production_change_performed'] is False
              assert shadow['payload']['current_symbol_shadow_policy_evaluated'] is False
              assert shadow['payload']['changes_universal_stance'] is False
              assert shadow['payload']['changes_portfolio_action'] is False
          print(json.dumps({
              'snapshot_id': packets['snapshot_id'],
              'packet_count': packets['packet_count'],
              'phase4_symbol_count': packets.get('phase4_symbol_count'),
              'phase4_confidence_claim_count': packets.get('phase4_confidence_claim_count'),
              'phase5_shadow_claim_count': packets.get('phase5_shadow_claim_count'),
              'phase5_shadow_integration_mode': packets['semantics']['phase5_shadow_integration_mode'],
              'phase6_status': manifest['stages']['phase6_elliott']['status'],
              'w10_pre_7a_frozen_at': manifest['pre_7a_frozen_at'],
              'w10_sealed_at': manifest['sealed_at'],
              'path_review_count': packets.get('path_review_count'),
              'decision_as_of': packets['as_of'],
          }, indent=2))
          PY

      - name: Refuse stale publication if main advanced during integration
        run: |
          git fetch origin main --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main advanced while Decision evidence was being built; refuse stale current publication'
            exit 1
          }

      - name: Persist final public Decision evidence and W10 lineage only
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action Bot'
          git rm -f --ignore-unmatch artifacts/research/decision_evidence_7a.jsonl
          git add \
            artifacts/research/current_decision_packets_7a.json \
            artifacts/research/decision_evidence_7a.jsonl.gz \
            artifacts/research/decision_snapshot_w10.json
          if ! git diff --cached --quiet; then
            git commit -m '🧭 Finalize Decision Watch evidence [skip ci]'
            git push origin HEAD:main
          fi
