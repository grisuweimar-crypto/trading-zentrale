name: W11 All-Long Privacy Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_w11_all_long_probe.py'
      - '.github/workflows/w11_all_long_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Run real W11 all-long privacy probe
        run: python scripts/run_w11_all_long_probe.py
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: w11-all-long-probe-result
          path: w11_all_long_probe_result.json
          if-no-files-found: error
          retention-days: 1
