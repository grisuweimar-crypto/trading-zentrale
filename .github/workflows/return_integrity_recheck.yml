name: Return Integrity Recheck

on:
  pull_request:
    paths:
      - 'scripts/prefetch_market_history.py'
      - 'src/scanner/data/price_history.py'
      - 'src/scanner/reports/research_views.py'
      - 'src/scanner/reports/research_validation.py'
      - 'src/scanner/reports/selection_timing.py'
      - 'src/scanner/reports/timing_patterns.py'
      - 'tests/test_market_history.py'
      - 'tests/test_price_pipeline.py'
      - 'tests/test_research_views.py'
      - 'tests/test_selection_timing.py'
      - 'tests/test_timing_patterns.py'
      - '.github/workflows/return_integrity_recheck.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/prefetch_market_history.py'
      - 'src/scanner/data/price_history.py'
      - 'src/scanner/reports/research_views.py'
      - 'src/scanner/reports/research_validation.py'
      - 'src/scanner/reports/selection_timing.py'
      - 'src/scanner/reports/timing_patterns.py'
      - '.github/workflows/return_integrity_recheck.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: return-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Targeted return-integrity tests
        run: |
          python -m pytest -q \
            tests/test_market_history.py \
            tests/test_price_pipeline.py \
            tests/test_research_views.py \
            tests/test_selection_timing.py \
            tests/test_timing_patterns.py

      - name: Full regression suite
        run: python -m pytest -q

      - name: Refresh split-adjusted Yahoo history
        run: python scripts/prefetch_market_history.py --minimum-sessions 300

      - name: Migrate and validate price_backfill
        run: python scripts/generate_research_views.py --refresh-prices

      - name: Run corrected Phase 1A
        run: python scripts/run_selection_timing_1a.py

      - name: Run corrected Phase 1B
        run: python scripts/run_timing_patterns_1b.py

      - name: Validate strict JSON reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('selection_timing_1a.json', 'timing_patterns_1b.json'):
              path = Path('artifacts/research') / name
              payload = json.loads(path.read_text(encoding='utf-8'))
              json.dumps(payload, allow_nan=False)
              print(name, 'strict-json-ok')
          PY

      - name: Upload corrected research reports
        uses: actions/upload-artifact@v4
        with:
          name: corrected-selection-timing-research
          path: |
            artifacts/research/selection_timing_1a.json
            artifacts/research/timing_patterns_1b.json
          if-no-files-found: error

      - name: Regenerate daily research after main migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/generate_daily_research.py

      - name: Persist one-time adjusted-price migration on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action Bot'
          git add \
            artifacts/market_data/yahoo_ohlcv.csv \
            artifacts/market_data/price_fetch_state.json \
            artifacts/research/price_backfill.csv \
            artifacts/research/history_metadata.json \
            artifacts/research/daily_research.json
          if ! git diff --cached --quiet; then
            git commit -m '📊 Migrate research prices to adjusted close [skip ci]'
            git push
          fi
