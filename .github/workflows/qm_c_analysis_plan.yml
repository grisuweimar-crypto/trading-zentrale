name: QM-C Analysis Plan Freeze

on:
  pull_request:
    paths:
      - "configs/qm_c_analysis_plan_v1.json"
      - "configs/qm_c2_closure_v1.json"
      - "src/scanner/research/governance/qm_c_analysis_plan.py"
      - "src/scanner/research/governance/qm_c2_closure.py"
      - "tests/test_qm_c*.py"
      - "tests/test_qm_a*.py"
      - "tests/test_qm_b_closure.py"
      - "docs/qm_c_analysis_plan.md"
      - ".github/workflows/qm_c_analysis_plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-c2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run QM-C1/QM-C2 and cross-module governance tests
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_qm_c*.py \
            tests/test_qm_a_research_governance.py \
            tests/test_qm_a_concurrency_guard.py \
            tests/test_qm_b_closure.py
      - name: Validate QM-C2 closure manifest
        run: |
          PYTHONPATH=src python - <<'PY'
          from scanner.research.governance.qm_c2_closure import validate_closure_file
          p = validate_closure_file()
          assert p['display_status'] == 'QM-C2 COMPLETE — ANALYSIS PLAN FREEZE GATE ACTIVE'
          print(p['display_status'])
          PY
