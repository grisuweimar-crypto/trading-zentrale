name: ChatGPT temporary history reconstruction

on:
  push:
    branches:
      - chatgpt-history-reconstruction-20260916
    paths:
      - '.github/workflows/chatgpt_history_reconstruction_temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-history-reconstruction-20260916
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas yfinance
      - name: Fill legacy crypto aliases
        run: python scripts/fill_crypto_history_temp.py
      - name: Commit completed reconstruction on temporary branch
        run: |
          git config user.name 'ChatGPT Reconstruction Bot'
          git config user.email 'action@github.com'
          git add artifacts/reconstruction_temp/
          git commit -m 'Complete legacy crypto reconstruction [skip ci]' || true
          git push origin HEAD:chatgpt-history-reconstruction-20260916
      - name: Upload reconstructed CSV and logs
        uses: actions/upload-artifact@v4
        with:
          name: score-history-reconstruction-complete
          path: |
            artifacts/reconstruction_temp/score_history_reconstructed.csv
            artifacts/reconstruction_temp/reconstruction_log.csv
            artifacts/reconstruction_temp/reconstruction_report.json
          retention-days: 1
