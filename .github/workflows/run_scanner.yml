name: Scanner_vNext Autopilot

on:
  schedule:
    - cron: '0 15 * * *' # 17:00 Uhr Berlin waehrend der Sommerzeit (GitHub cron laeuft in UTC)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: History-Regressionstests
        run: python -m unittest discover -s tests -v

      - name: Historische Marktanalyse aktualisieren
        run: |
          python scripts/prefetch_market_history.py AVAV ROL --minimum-days 300
          python scripts/publish_history_analysis.py

      - name: Scanner ausführen (run_daily)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TELEGRAM_ENABLED: '0'
          # Ensure Yahoo market data refresh happens on every scheduled run.
          SCANNER_FETCH_YAHOO: '1'
        run: |
          python -m scanner.app.run_daily


      - name: History Delta erzeugen (Scanner-interne Verläufe)
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_history_delta.py

      - name: Segment Monitor erzeugen
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_segment_monitor.py

      - name: Reality Check erzeugen
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_reality_check.py

      - name: Macro Chain Signal erzeugen
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_macro_chain_signal.py

      - name: Briefing erzeugen (deterministic)
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_briefing.py

      - name: Briefing & Realities erzeugen
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_briefing_realities.py

      - name: UI generieren
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python -m scanner.ui.generator

      - name: Quality Gates (light)
        run: |
          python scripts/validate_contract.py

      - name: Ergebnisse speichern (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add artifacts/ || true
          git commit -m "📊 Autopilot: artifacts update [skip ci]" || echo "Keine Änderungen zum Speichern"
          git push
