name: Scanner_vNext Autopilot

on:
  push:
    branches: [main]
    paths:
      - ".github/ba_qm8_force_scan_once.txt"
  schedule:
    # Frueher Primaertermin fuer die 17:15-Watch plus Nachholtermine bei
    # verspaeteten/ausgefallenen GitHub-Starts.
    - cron: '7 16 * * *'
      timezone: Europe/Berlin
    - cron: '7 17 * * *'
      timezone: Europe/Berlin
    - cron: '37 18,20 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-daily-publication
  cancel-in-progress: false

jobs:
  autorun:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Wartende Laeufe muessen den zuletzt publizierten Stand lesen.
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Bereits publizierten gueltigen Tageslauf pruefen
        id: check
        run: python scripts/autorun_state.py

  build:
    needs: autorun
    if: needs.autorun.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Python installieren
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: History-Regressionstests
        # Produktions-Gate fuer die scannernahe History-/Research-Kette.
        # Governance-/QM-Suiten laufen in ihren eigenen Workflows und duerfen
        # einen ansonsten gueltigen Tageslauf nicht blockieren.
        run: |
          python -m pytest tests/test_history_delta_completion.py \
            tests/test_daily_research.py \
            tests/test_history_query_and_daily_research.py \
            tests/test_history_research.py \
            tests/test_recent_history.py \
            tests/test_research_views.py \
            -v

      - name: Daily-Lauf vorbereiten
        env:
          SCANNER_REQUIRE_PROVENANCE: '1'
          SCANNER_FETCH_YAHOO: '1'
        run: python scripts/generate_research_views.py --begin-run --receipt "$RUNNER_TEMP/scanner-run.json"

      - name: Scanner ausführen (run_daily)
        id: scan
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TELEGRAM_ENABLED: '0'
          # Ensure Yahoo market data refresh happens on every scheduled run.
          SCANNER_FETCH_YAHOO: '1'
          SCANNER_REQUIRE_PROVENANCE: '1'
        run: |
          python -m scanner.app.run_daily

      - name: Aktuellen Scan validieren und Research-Views erzeugen
        id: research
        env:
          SCANNER_REQUIRE_PROVENANCE: '1'
        run: python scripts/generate_research_views.py --receipt "$RUNNER_TEMP/scanner-run.json" --scanner-status "${{ steps.scan.outcome }}"

      - name: CY-02 Zyklus-Bar-/Quality-Contract vor Publikation prüfen
        if: steps.research.outputs.complete == 'true'
        run: python scripts/audit_cycle_current.py

      - name: Marktpreise fuer das vollstaendige aktuelle Universum aktualisieren
        if: steps.research.outputs.complete == 'true'
        run: python scripts/prefetch_market_history.py --minimum-sessions 300

      - name: Price Backfill aktualisieren und Research-Bundle validieren
        if: steps.research.outputs.complete == 'true'
        run: python scripts/generate_research_views.py --refresh-prices

      - name: Daily Research erzeugen und validieren
        if: steps.research.outputs.complete == 'true'
        run: python scripts/generate_daily_research.py

      - name: CY-03 neue Zyklusbeobachtungen unveränderlich historisieren
        if: steps.research.outputs.complete == 'true'
        run: python scripts/record_cycle_history.py

      - name: Aktuelle Phase-7A Decision-Evidence archivieren
        id: decision_evidence
        if: steps.research.outputs.complete == 'true'
        continue-on-error: true
        run: python scripts/build_current_decision_evidence_7a.py --archive

      - name: Decision-Evidence Ausfall fail-closed markieren
        if: steps.research.outputs.complete == 'true' && steps.decision_evidence.outcome != 'success'
        run: |
          echo "::warning::Phase-7A Decision-Evidence konnte fuer diesen Snapshot nicht archiviert werden. Scanner-Publikation bleibt gueltig; Depot-Watch muss fuer diesen Snapshot fail-closed bleiben."

      - name: History Delta erzeugen (Scanner-interne Verläufe)
        if: steps.research.outputs.complete == 'true'
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_history_delta.py --report-only

      - name: Segment Monitor erzeugen
        if: steps.research.outputs.complete == 'true'
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_segment_monitor.py

      - name: Reality Check erzeugen
        if: steps.research.outputs.complete == 'true'
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_reality_check.py

      - name: Macro Chain Signal erzeugen
        if: steps.research.outputs.complete == 'true'
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_macro_chain_signal.py

      - name: Briefing erzeugen (deterministic)
        if: steps.research.outputs.complete == 'true'
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_briefing.py

      - name: Briefing & Realities erzeugen
        if: steps.research.outputs.complete == 'true'
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python scripts/generate_briefing_realities.py

      - name: UI generieren
        if: steps.research.outputs.complete == 'true'
        env:
          TELEGRAM_ENABLED: '0'
        run: |
          python -m scanner.ui.generator

      - name: Quality Gates (light)
        if: steps.research.outputs.complete == 'true'
        run: |
          python scripts/validate_contract.py

      - name: Research-Kohaerenz vor Veroeffentlichung pruefen
        run: python scripts/generate_research_views.py --validate-only

      - name: Publication base unveraendert pruefen
        if: steps.research.outputs.complete == 'true'
        run: python scripts/check_publication_base.py

      - name: Erfolgreichen gueltigen Tageslauf vormerken
        if: steps.research.outputs.complete == 'true'
        # Marker und Ergebnisse werden gemeinsam publiziert; ein fehlgeschlagener
        # Push oder unvollstaendiger Scan darf keinen Nachholtermin unterdruecken.
        run: python scripts/autorun_state.py --record

      - name: Ergebnisse speichern (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "📊 Autopilot: artifacts update [skip ci]"
          fi
          git push

      - name: Unvollstaendigen Scan als Fehler melden
        if: steps.research.outputs.complete != 'true'
        run: |
          echo "Scannerlauf unvollstaendig; Fehlermetadaten wurden publiziert, letzte gueltige Research-Views bleiben erhalten."
          exit 1
