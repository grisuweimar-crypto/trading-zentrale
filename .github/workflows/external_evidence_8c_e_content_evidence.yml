name: Phase 8C-E Content Evidence Contract

on:
  pull_request:
    paths:
      - "configs/external_evidence_8c_content_evidence_v1.json"
      - "src/scanner/research/external_evidence/content_evidence.py"
      - "tests/test_external_evidence_8c_content_evidence.py"
      - "docs/external_evidence_8c_e_content_evidence.md"
      - ".github/workflows/external_evidence_8c_e_content_evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 8C-E content evidence guards
        run: python -m pytest -q tests/test_external_evidence_8c_content_evidence.py
