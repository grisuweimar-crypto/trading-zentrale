name: Phase 8C-C Current Universe SEC Coverage

on:
  pull_request:
    paths:
      - "configs/external_evidence_8c_current_universe_coverage_v1.json"
      - "src/scanner/research/external_evidence/universe_coverage.py"
      - "scripts/run_external_evidence_8c_universe_coverage.py"
      - "tests/test_external_evidence_8c_universe_coverage.py"
      - ".github/workflows/external_evidence_8c_current_universe_coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run universe coverage guards
        run: python -m pytest -q tests/test_external_evidence_8c_universe_coverage.py
      - name: Run coverage runner self-test
        run: python scripts/run_external_evidence_8c_universe_coverage.py --self-test

  live-current-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Run current scanner universe SEC coverage
        run: >-
          python scripts/run_external_evidence_8c_universe_coverage.py
          --scanner artifacts/research/latest_scanner.csv
          --output artifacts/research/external_evidence_8c_current_universe_coverage.json
          --minimum-interval-seconds 0.22
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-evidence-8c-current-universe-coverage
          path: artifacts/research/external_evidence_8c_current_universe_coverage.json
          if-no-files-found: warn
          retention-days: 14
