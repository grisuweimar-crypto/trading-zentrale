name: Pattern Discovery L6 Dependency Graph

on:
  push:
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "tests/pattern_discovery/**"
      - "docs/pattern_discovery/**"
      - "scripts/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l6.yml"
  pull_request:
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "tests/pattern_discovery/**"
      - "docs/pattern_discovery/**"
      - "scripts/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l6.yml"
  workflow_dispatch:

jobs:
  l6-dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Pattern Discovery L0-L6 tests
        run: python -m pytest -q tests/pattern_discovery/test_l0_boundary.py tests/pattern_discovery/test_l1_run_contract.py tests/pattern_discovery/test_l2_feature_library.py tests/pattern_discovery/test_l3_search_engine.py tests/pattern_discovery/test_l4_statistical_guard.py tests/pattern_discovery/test_l5_candidate_registry.py tests/pattern_discovery/test_l6_dependency_graph.py
      - name: Run QM-C1/QM-C2 compatibility tests
        run: PYTHONPATH=src python -m pytest -q tests/test_qm_c_hypothesis_registry.py tests/test_qm_c_analysis_plan.py
