name: Phase 8C-F Filing Content Acquisition

on:
  pull_request:
    paths:
      - "configs/external_evidence_8c_content_acquisition_v1.json"
      - "src/scanner/research/external_evidence/filing_documents.py"
      - "src/scanner/research/external_evidence/sec_identity_bootstrap.py"
      - "src/scanner/research/external_evidence/sec_snapshot.py"
      - "src/scanner/research/external_evidence/bulk_content_completion.py"
      - "scripts/collect_external_evidence_8c_sec_snapshot.py"
      - "scripts/collect_external_evidence_8c_bulk_content.py"
      - "tests/test_external_evidence_8c_filing_documents.py"
      - "tests/test_external_evidence_8c_sec_identity_bootstrap.py"
      - "tests/test_external_evidence_8c_sec_snapshot.py"
      - "tests/test_external_evidence_8c_bulk_content_completion.py"
      - "docs/external_evidence_8c_f_content_acquisition.md"
      - ".github/workflows/external_evidence_8c_f_content_acquisition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 8C-F acquisition and snapshot guards
        run: >-
          python -m pytest -q
          tests/test_external_evidence_8c_filing_documents.py
          tests/test_external_evidence_8c_sec_identity_bootstrap.py
          tests/test_external_evidence_8c_sec_snapshot.py
          tests/test_external_evidence_8c_bulk_content_completion.py
      - name: Verify collector CLIs only
        run: >-
          python scripts/collect_external_evidence_8c_sec_snapshot.py --help &&
          python scripts/collect_external_evidence_8c_bulk_content.py --help

# No live SEC calls are permitted on GitHub-hosted Actions.
