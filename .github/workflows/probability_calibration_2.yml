name: Phase 2 Probability Calibration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/scanner/reports/probability_calibration.py'
      - 'scripts/run_probability_calibration_2.py'
      - 'tests/test_probability_calibration.py'
      - 'docs/probability_calibration_2.md'
      - '.github/workflows/probability_calibration_2.yml'
      - 'artifacts/research/history_analysis.csv'
      - 'artifacts/research/price_backfill.csv'
  push:
    branches: [main]
    paths:
      - 'artifacts/research/history_analysis.csv'
      - 'artifacts/research/price_backfill.csv'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Phase 2 tests
        run: python -m pytest -q tests/test_probability_calibration.py tests/test_timing_patterns.py tests/test_selection_timing.py
      - name: Run Phase 2
        run: python scripts/run_probability_calibration_2.py
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/research/probability_calibration_2.json').read_text(encoding='utf-8'))
          assert p['phase'] == '2_probability_calibration'
          assert set(p['horizons']) == {'5','20','40','60'}
          for h in ('5','20','40','60'):
              x=p['horizons'][h]
              print('HORIZON', h)
              print('SELECTION_VALIDATION', json.dumps(x['selection'].get('validation', {}), sort_keys=True))
              supported=x['timing_patterns'].get('validation_supported', [])
              print('TIMING_VALIDATION_SUPPORTED', json.dumps(supported, sort_keys=True))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: probability-calibration-2
          path: artifacts/research/probability_calibration_2.json
          if-no-files-found: error
