name: CY-03 v2 independent review verifier
on:
  pull_request:
    paths:
      - "src/scanner/research/pattern_discovery/cycle_cy03_v2_review.py"
      - "configs/cycle_direction/cy03_v2_review_authorities.json"
      - "configs/cycle_direction/reviewer_keys/**"
      - "tests/pattern_discovery/test_cy03_v2_review.py"
      - ".github/workflows/cycle_dir_v2_review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: openssl version
      - run: python -m pytest -q tests/pattern_discovery/test_cy03_v2_review.py tests/pattern_discovery/test_cy05_cycle_archive_adapter.py
