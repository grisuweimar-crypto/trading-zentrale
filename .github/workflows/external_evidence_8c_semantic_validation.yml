name: Phase 8C-I Semantic Challenger Validation

on:
  pull_request:
    paths:
      - "configs/external_evidence_8c_semantic_validation_v1.json"
      - "src/scanner/research/external_evidence/semantic_validation.py"
      - "scripts/run_external_evidence_8c_semantic_validation.py"
      - "scripts/prepare_external_evidence_8c_semantic_audit.py"
      - "scripts/hydrate_external_evidence_8c_candidate_audit.py"
      - "tests/test_external_evidence_8c_semantic_validation.py"
      - "tests/test_external_evidence_8c_candidate_audit_hydration.py"
      - "docs/external_evidence_8c_i_semantic_validation.md"
      - ".github/workflows/external_evidence_8c_semantic_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 8C-I validation guards
        run: |
          python -m pytest -q tests/test_external_evidence_8c_semantic_validation.py
          python -m pytest -q tests/test_external_evidence_8c_candidate_audit_hydration.py
      - name: Verify validation CLIs
        run: |
          python scripts/run_external_evidence_8c_semantic_validation.py --help
          python scripts/prepare_external_evidence_8c_semantic_audit.py --help
          python scripts/hydrate_external_evidence_8c_candidate_audit.py --help
