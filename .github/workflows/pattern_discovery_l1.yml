name: Pattern Discovery L1 Run Contract

on:
  push:
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "tests/pattern_discovery/**"
      - "docs/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l1.yml"
  pull_request:
    paths:
      - "configs/pattern_discovery/**"
      - "src/scanner/research/pattern_discovery/**"
      - "tests/pattern_discovery/**"
      - "docs/pattern_discovery/**"
      - ".github/workflows/pattern_discovery_l1.yml"
  workflow_dispatch:

jobs:
  l1-run-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run L0 and L1 Pattern Discovery tests
        run: python -m pytest -q tests/pattern_discovery/test_l0_boundary.py tests/pattern_discovery/test_l1_run_contract.py
