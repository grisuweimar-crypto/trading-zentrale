name: A-Watch evidence explanation
on:
  pull_request:
    paths:
      - "src/scanner/research/decision_layer/watch_explainability.py"
      - "tests/test_watch_explainability.py"
      - "scripts/render_depot_watch_explainability.py"
      - ".github/workflows/watch_explainability.yml"
      - "scripts/audit_uran_ab_readiness.py"
      - "tests/test_uran_ab_readiness.py"
  workflow_dispatch:
jobs:
  explanation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest numpy pandas
      - name: Test snapshot-bound read-only explanation
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_watch_explainability.py tests/test_uran_ab_readiness.py
      - name: Audit current uranium A/B readiness
        env:
          PYTHONPATH: src
        run: python scripts/audit_uran_ab_readiness.py --output /tmp/uran_ab_readiness.json
