name: Phase 8I-G Prospective Validation Entry Gate

on:
  workflow_dispatch:
  push:
    branches:
      - phase8i-decision-layer-extension
    paths:
      - "configs/external_evidence_8i_prospective_validation_entry_gate_v1.json"
      - "src/scanner/research/external_evidence/prospective_validation_entry_gate_8i.py"
      - "tests/test_external_evidence_8i_prospective_validation_entry_gate.py"
      - "docs/external_evidence_8i_prospective_validation_entry_gate.md"
      - ".github/workflows/external_evidence_8i_prospective_validation_entry_gate.yml"
      - "configs/external_evidence_8i_extended_stance_entry_gate_v1.json"
      - "src/scanner/research/external_evidence/extended_stance_entry_gate_8i.py"
      - "configs/decision_validation_promotion_v1.json"
      - "configs/decision_research_dataset_v1.json"
      - "configs/external_evidence_8i_decision_extension_contract_v1.json"
  pull_request:
    paths:
      - "configs/external_evidence_8i_prospective_validation_entry_gate_v1.json"
      - "src/scanner/research/external_evidence/prospective_validation_entry_gate_8i.py"
      - "tests/test_external_evidence_8i_prospective_validation_entry_gate.py"
      - "docs/external_evidence_8i_prospective_validation_entry_gate.md"
      - ".github/workflows/external_evidence_8i_prospective_validation_entry_gate.yml"
      - "configs/external_evidence_8i_extended_stance_entry_gate_v1.json"
      - "src/scanner/research/external_evidence/extended_stance_entry_gate_8i.py"
      - "configs/decision_validation_promotion_v1.json"
      - "configs/decision_research_dataset_v1.json"
      - "configs/external_evidence_8i_decision_extension_contract_v1.json"

permissions:
  contents: read

jobs:
  prospective-validation-entry-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Guard Phase 8I-F entry boundary
        run: pytest -q tests/test_external_evidence_8i_extended_stance_entry_gate.py

      - name: Validate Phase 8I-G prospective validation entry gate
        run: pytest -q tests/test_external_evidence_8i_prospective_validation_entry_gate.py

      - name: Prove current real 8I-G gate is closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.external_evidence.prospective_validation_entry_gate_8i import evaluate_validation_entry_gate

          contract = json.loads(Path("configs/external_evidence_8i_prospective_validation_entry_gate_v1.json").read_text())
          f_contract = json.loads(Path("configs/external_evidence_8i_extended_stance_entry_gate_v1.json").read_text())
          result = evaluate_validation_entry_gate(contract, f_contract)

          assert result["state"] == "BLOCKED_WAITING_FOR_8I_F_STANCE_PREREGISTRATION"
          assert result["eligible_to_freeze_8i_g_validation_plan"] is False
          assert "8I_F_STANCE_PREREGISTRATION_INCOMPLETE" in result["blockers"]
          assert "8I_F_HAS_NOT_RELEASED_8I_G" in result["blockers"]
          assert result["validation_plan_frozen"] is False
          assert result["prospective_validation_started"] is False
          assert result["holdout_opened"] is False
          assert result["real_outcomes_opened"] is False
          assert result["real_outcome_values_read_by_8i_g_gate"] is False
          assert result["extended_stance_enabled"] is False
          assert result["decision_effect"] == "NO_CHANGE_TO_PHASE7_DECISION"
          assert result["portfolio_action_change_authorized"] is False
          assert result["orders_or_trades_authorized"] is False
          print(json.dumps({"state": result["state"], "blockers": result["blockers"]}, sort_keys=True))
          PY

      - name: Guard fresh-evidence and one-shot holdout boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("configs/external_evidence_8i_prospective_validation_entry_gate_v1.json").read_text())
          guards = contract["validation_design_guards"]
          assert guards["fresh_evidence_start_must_be_after_8i_f_rule_freeze"] is True
          assert guards["backdating_fresh_evidence_start_forbidden"] is True
          assert guards["8i_e_design_evidence_is_not_fresh_8i_g_confirmation"] is True
          assert guards["validation_may_tune_rule"] is False
          assert guards["holdout_may_tune_rule"] is False
          assert guards["holdout_may_select_rule"] is False
          assert guards["repeated_interim_significance_looks_allowed"] is False
          assert guards["automatic_promotion_from_significance_forbidden"] is True
          assert contract["holdout_policy"]["holdout_outcomes_open_once"] is True
          assert contract["holdout_policy"]["holdout_success_is_automatic_production_promotion"] is False
          print("8I-G fresh-evidence and one-shot holdout boundary verified")
          PY

      - name: Guard no premature Portfolio Action or execution path
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("configs/external_evidence_8i_prospective_validation_entry_gate_v1.json").read_text())
          assert contract["extended_stance_enabled"] is False
          assert contract["phase7_mutation_enabled"] is False
          assert contract["portfolio_action_change_enabled"] is False
          assert contract["orders_or_trades_enabled"] is False
          assert contract["scope"]["portfolio_action_bridge_in_scope"] is False
          assert contract["decision_layer_guards"]["external_evidence_to_portfolio_action_shortcut_forbidden"] is True
          assert contract["decision_layer_guards"]["validation_result_to_order_shortcut_forbidden"] is True
          assert contract["completion_gate"]["8i_h_may_start_now"] is False
          print("8I-G decision and execution boundaries remain closed")
          PY

      - name: Guard production namespace
        run: |
          set -euo pipefail
          refs=$(grep -R -l --exclude-dir=research \
            -e "external_evidence_8i_prospective_validation_entry_gate_v1" \
            -e "prospective_validation_entry_gate_8i" \
            src/scanner 2>/dev/null || true)
          if [ -n "$refs" ]; then
            echo "8I-G entry gate referenced outside research namespace:"
            echo "$refs"
            exit 1
          fi
          echo "No production-facing 8I-G references found."
