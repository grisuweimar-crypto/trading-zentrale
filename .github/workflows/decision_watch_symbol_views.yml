name: Decision Watch Symbol Views

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_watch_symbol_views.py'
      - 'src/scanner/research/decision_layer/elliott_readonly_display.py'
      - 'docs/elliott_vnext_watch_display_stage2.md'
      - '.github/workflows/decision_watch_symbol_views.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_watch_symbol_views.py'
      - 'src/scanner/research/decision_layer/elliott_readonly_display.py'
      - 'tests/test_elliott_vnext_watch_display.py'
      - 'docs/elliott_vnext_watch_display_stage2.md'
      - '.github/workflows/decision_watch_symbol_views.yml'
  workflow_run:
    workflows:
      - 'Decision Watch Runtime Publish'
      - 'Module 6 Elliott Prospective Shadow'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: decision-watch-symbol-views-main
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Prove Elliott Watch display is read-only and fail-closed
        run: >-
          pytest -q
          tests/test_elliott_vnext_watch_display.py
          tests/test_watch_runtime_transport.py
          tests/test_decision_depot_watch_orchestration.py
      - name: Build current symbol views without an Elliott capture
        run: python scripts/build_watch_symbol_views.py
      - name: Validate missing capture stays explicit and decision-free
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('artifacts/research/watch_runtime/symbols/index.json').read_text(encoding='utf-8'))
          assert index['elliott_vnext_display']['capture_supplied'] is False
          assert index['elliott_vnext_display']['w10_source_emitted'] is False
          assert index['elliott_vnext_display']['decision_logic_changed'] is False
          first = next(iter(index['summary_files'].values()))
          summary = json.loads((Path('artifacts/research/watch_runtime/symbols') / first).read_text(encoding='utf-8'))
          display = summary['elliott_vnext_research']
          assert display['status'] == 'prospective_capture_not_supplied'
          assert display['outputs'] == []
          assert display['decision_effect'] == 'none'
          assert display['changes_universal_stance'] is False
          assert display['changes_portfolio_action'] is False
          PY

  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Resolve optional current Elliott shadow capture
        id: elliott
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin elliott-vnext-shadow-data:refs/remotes/origin/elliott-vnext-shadow-data --force || true
          path="$RUNNER_TEMP/elliott_vnext_prospective_current_6h.json"
          if git cat-file -e "origin/elliott-vnext-shadow-data:artifacts/research/elliott_vnext_prospective_current_6h.json" 2>/dev/null; then
            git show "origin/elliott-vnext-shadow-data:artifacts/research/elliott_vnext_prospective_current_6h.json" > "$path"
            echo "path=$path" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build per-symbol views from validated runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.elliott.outputs.path }}" ]]; then
            python scripts/build_watch_symbol_views.py --elliott-capture "${{ steps.elliott.outputs.path }}"
          else
            python scripts/build_watch_symbol_views.py
          fi

      - name: Validate symbol-view identity and privacy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          runtime = json.loads(Path('artifacts/research/watch_runtime/manifest.json').read_text(encoding='utf-8'))
          index = json.loads(Path('artifacts/research/watch_runtime/symbols/index.json').read_text(encoding='utf-8'))
          assert index['snapshot_id'] == runtime['snapshot_id']
          assert index['decision_as_of'] == runtime['decision_as_of']
          assert index['symbol_count'] == runtime['symbol_count']
          assert index['packet_count'] == runtime['packet_count']
          assert index['private_position_data_included'] is False
          assert index['decision_logic_changed'] is False
          assert index['source_runtime_projection_sha256'] == runtime['runtime_projection_sha256']
          elliott_meta = index['elliott_vnext_display']
          assert elliott_meta['research_only'] is True
          assert elliott_meta['read_only_presentation'] is True
          assert elliott_meta['w10_source_emitted'] is False
          assert elliott_meta['decision_logic_changed'] is False
          for symbol, filename in index['symbol_files'].items():
              row = json.loads((Path('artifacts/research/watch_runtime/symbols') / filename).read_text(encoding='utf-8'))
              assert row['symbol'] == symbol
              assert row['snapshot_id'] == runtime['snapshot_id']
              assert row['private_position_data_included'] is False
              assert row['decision_logic_changed'] is False
              assert row['packets']
              assert all(packet['symbol'] == symbol for packet in row['packets'])
              assert row['packets'][-1]['source_snapshot_id'] == runtime['snapshot_id']
          for symbol, filename in index['summary_files'].items():
              row = json.loads((Path('artifacts/research/watch_runtime/symbols') / filename).read_text(encoding='utf-8'))
              assert row['symbol'] == symbol
              assert row['snapshot_id'] == runtime['snapshot_id']
              assert row['private_position_data_included'] is False
              assert row['portfolio_action_computed'] is False
              assert row['decision_logic_changed'] is False
              display = row['elliott_vnext_research']
              assert display['research_only'] is True
              assert display['read_only_presentation'] is True
              assert display['w10_source_emitted'] is False
              assert display['changes_universal_stance'] is False
              assert display['changes_portfolio_action'] is False
              assert display['direct_ordering_allowed'] is False
              assert display['decision_effect'] == 'none'
          print({'symbol_count': index['symbol_count'], 'packet_count': index['packet_count']})
          PY

      - name: Refuse stale publication if main advanced
        run: |
          git fetch origin main --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main advanced while symbol views were being built; refuse stale publication'
            exit 1
          }

      - name: Persist public symbol views only
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action Bot'
          git add artifacts/research/watch_runtime/symbols
          if ! git diff --cached --quiet; then
            git commit -m '🧭 Publish per-symbol Decision Watch runtime [skip ci]'
            git push origin HEAD:main
          fi
