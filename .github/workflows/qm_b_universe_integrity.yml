name: QM-B Universe Integrity

on:
  pull_request:
    paths:
      - "configs/qm_b_universe_integrity_v1.json"
      - "configs/external_universe_coverage_contract_v1.json"
      - "configs/qm_b_closure_v1.json"
      - "src/scanner/research/governance/qm_b.py"
      - "src/scanner/research/governance/qm_b_closure.py"
      - "src/scanner/reports/historical_matches.py"
      - "scripts/qm_b_universe_integrity.py"
      - "tests/test_historical_matches.py"
      - "tests/test_qm_b*.py"
      - "docs/qm_b_asof_universe_integrity.md"
      - "docs/historical_matches.md"
      - ".github/workflows/qm_b_universe_integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run QM-B and HistoricalMatcher closure tests
        run: PYTHONPATH=src python -m pytest -q tests/test_historical_matches.py tests/test_qm_b*.py
      - name: Validate final QM-B closure manifest
        run: |
          PYTHONPATH=src python - <<'PY'
          from scanner.research.governance.qm_b_closure import validate_closure_file
          p = validate_closure_file()
          assert p['display_status'] == 'QM-B COMPLETE — STRICT PROMOTION BLOCKED BY EXTERNAL EVIDENCE'
          print(p['display_status'])
          PY
      - name: Inventory current universe without historical inference
        run: |
          PYTHONPATH=src python scripts/qm_b_universe_integrity.py \
            inventory-current \
            --universe data/inputs/universe_master.csv \
            --output /tmp/qm_b_current_universe_inventory.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/qm_b_current_universe_inventory.json', encoding='utf-8'))
          assert p['scope'] == 'CURRENT_STATE_ONLY_NOT_HISTORICAL_MEMBERSHIP'
          assert p['historical_membership_inferred'] is False
          assert p['historical_identity_inferred'] is False
          print(json.dumps({
              'active_row_count': p['active_row_count'],
              'unique_active_symbol_count': p['unique_active_symbol_count'],
              'duplicate_symbol_count': len(p['duplicate_symbols']),
              'duplicate_isin_count': len(p['duplicate_isins']),
              'missing_isin_count': len(p['missing_isin_rows']),
          }, indent=2, sort_keys=True))
          PY
