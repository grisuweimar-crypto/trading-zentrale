name: BA-QM7 Negative Controls and Falsification

on:
  pull_request:
    paths:
      - "src/scanner/research/governance/qm_j_*.py"
      - "configs/qm_j_*.json"
      - "src/scanner/research/governance/qm_h_*.py"
      - "configs/qm_h_*.json"
      - "src/scanner/research/governance/qm_i_*.py"
      - "configs/qm_i_*.json"
      - "src/scanner/research/governance/qm_g_*.py"
      - "configs/ba_qm6_qm_g_closure_v1.json"
      - "src/scanner/research/decision_layer/w10_orchestration.py"
      - "tests/test_qm_j_*.py"
      - "tests/test_qm_h_*.py"
      - "tests/test_qm_i_*.py"
      - "tests/test_qm_g_closure.py"
      - "tests/test_w10_snapshot_orchestration.py"
      - "docs/qm_j_negative_controls.md"
      - ".github/workflows/qm_j_negative_controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qm-j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run QM-J and predecessor / boundary regressions
        run: >-
          python -m pytest -q
          tests/test_qm_j_negative_controls.py
          tests/test_qm_g_closure.py
          tests/test_qm_h_capa.py
          tests/test_qm_i_lineage.py
          tests/test_w10_snapshot_orchestration.py
