name: Phase 8C-B Full History and Coverage

on:
  pull_request:
    paths:
      - "configs/external_evidence_8c_coverage_contract_v1.json"
      - "src/scanner/research/external_evidence/sec_history.py"
      - "scripts/run_external_evidence_8c_probe.py"
      - "tests/test_external_evidence_8c_history.py"
      - "docs/external_evidence_8c_history_coverage.md"
      - ".github/workflows/external_evidence_8c_history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 8C-B full-history coverage guards
        run: python -m pytest -q tests/test_external_evidence_8c_history.py
      - name: Smoke-test Phase 8C live probe interface
        run: python scripts/run_external_evidence_8c_probe.py --self-test
