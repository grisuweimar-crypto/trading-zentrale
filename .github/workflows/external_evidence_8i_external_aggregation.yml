name: Phase 8I-C Outcome-Blind External Aggregation

on:
  workflow_dispatch:
  push:
    paths:
      - "configs/external_evidence_8i_external_aggregation_design_v1.json"
      - "src/scanner/research/external_evidence/external_aggregation_8i.py"
      - "tests/test_external_evidence_8i_external_aggregation.py"
      - "docs/external_evidence_8i_external_aggregation_design.md"
      - ".github/workflows/external_evidence_8i_external_aggregation.yml"
      - "configs/external_evidence_8i_decision_extension_contract_v1.json"
      - "configs/external_evidence_8i_promotion_provenance_binding_v1.json"
      - "src/scanner/research/external_evidence/decision_binding_8i.py"
      - "configs/external_conflict_matrix_v1.json"
  pull_request:
    paths:
      - "configs/external_evidence_8i_external_aggregation_design_v1.json"
      - "src/scanner/research/external_evidence/external_aggregation_8i.py"
      - "tests/test_external_evidence_8i_external_aggregation.py"
      - "docs/external_evidence_8i_external_aggregation_design.md"
      - ".github/workflows/external_evidence_8i_external_aggregation.yml"
      - "configs/external_evidence_8i_decision_extension_contract_v1.json"
      - "configs/external_evidence_8i_promotion_provenance_binding_v1.json"
      - "src/scanner/research/external_evidence/decision_binding_8i.py"
      - "configs/external_conflict_matrix_v1.json"

permissions:
  contents: read

jobs:
  aggregation-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Guard Phase 8I-A baseline
        run: pytest -q tests/test_external_evidence_8i_decision_extension_contract.py

      - name: Guard Phase 8I-B binding boundary
        run: pytest -q tests/test_external_evidence_8i_promotion_provenance_binding.py

      - name: Validate Phase 8I-C aggregation design
        run: pytest -q tests/test_external_evidence_8i_external_aggregation.py

      - name: Prove current fail-closed state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner.research.external_evidence.external_aggregation_8i import current_aggregation_status

          contract = json.loads(Path("configs/external_evidence_8i_external_aggregation_design_v1.json").read_text())
          binding = json.loads(Path("configs/external_evidence_8i_promotion_provenance_binding_v1.json").read_text())
          matrix = json.loads(Path("configs/external_conflict_matrix_v1.json").read_text())
          state = current_aggregation_status(contract, binding, matrix)
          assert state["state"] == "BLOCKED_BY_8I_B_UPSTREAM_SOURCE_IDENTITY_CONTRACT"
          assert state["bound_component_ids"] == []
          assert state["external_direction_state"] == "INSUFFICIENT_EXTERNAL"
          assert state["decision_effect"] == "NO_CHANGE_TO_PHASE7_DECISION"
          assert state["real_aggregation_authorized"] is False
          assert state["external_decision_influence_enabled"] is False
          assert state["portfolio_action_change_authorized"] is False
          assert state["orders_or_trades_authorized"] is False
          print("8I-C current fail-closed invariant verified")
          PY

      - name: Guard no real aggregation activation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("configs/external_evidence_8i_external_aggregation_design_v1.json").read_text())
          assert contract["scope"]["real_bound_component_aggregation_enabled_now"] is False
          assert contract["scope"]["real_component_direction_state_generation_enabled_now"] is False
          assert contract["component_direction_boundary"]["real_direction_adapter_current_state"] == "NOT_YET_FROZEN"
          assert contract["productive_integration_enabled"] is False
          assert contract["phase7_mutation_enabled"] is False
          assert contract["extended_reliability_enabled"] is False
          assert contract["extended_stance_enabled"] is False
          assert contract["portfolio_action_change_enabled"] is False
          assert contract["orders_or_trades_enabled"] is False
          print("8I-C real aggregation and production boundaries remain closed")
          PY

      - name: Guard production namespace
        run: |
          set -euo pipefail
          refs=$(grep -R -l --exclude-dir=research \
            -e "external_evidence_8i_external_aggregation_design_v1" \
            -e "external_aggregation_8i" \
            src/scanner 2>/dev/null || true)
          if [ -n "$refs" ]; then
            echo "8I-C referenced outside research namespace:"
            echo "$refs"
            exit 1
          fi
          echo "No production-facing 8I-C references found."
