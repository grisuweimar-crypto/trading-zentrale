name: Phase 7E Hysteresis and State Transitions

on:
  pull_request:
    paths:
      - "configs/decision_state_transition_v1.json"
      - "src/scanner/research/decision_layer/**"
      - "tests/test_decision_universal_stance_7d.py"
      - "tests/test_decision_state_transitions_7e.py"
      - "scripts/run_state_transition_7e.py"
      - "docs/decision_layer_7e.md"
      - ".github/workflows/decision_layer_7e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 7D and 7E regression tests
        run: >-
          pytest -q
          tests/test_decision_universal_stance_7d.py
          tests/test_decision_state_transitions_7e.py
      - name: Smoke-test 7E CLI
        run: python scripts/run_state_transition_7e.py --help
