name: Phase 3 Risk vNext Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/scanner/reports/risk_vnext.py'
      - 'scripts/run_risk_vnext_3.py'
      - 'tests/test_risk_vnext.py'
      - 'docs/risk_vnext_3.md'
      - '.github/workflows/risk_vnext_3.yml'
      - 'artifacts/research/history_analysis.csv'
      - 'artifacts/research/price_backfill.csv'

permissions:
  contents: read

concurrency:
  group: phase3-risk-vnext-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Phase 3 tests
        run: python -m pytest -q tests/test_risk_vnext.py tests/test_selection_timing.py tests/test_timing_patterns.py
      - name: Run Phase 3 audit
        run: python scripts/run_risk_vnext_3.py --bootstrap-reps 250
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/research/risk_vnext_3.json').read_text(encoding='utf-8'))
          assert report['phase'] == '3_risk_vnext_audit'
          assert report['semantics']['research_only'] is True
          assert report['semantics']['production_risk_weights_changed'] is False
          assert report['semantics']['confidence_changed'] is False
          assert set(report['horizons']) == {'5', '20', '40', '60'}

          print('EVENTS', report['events'])
          print('COVERAGE')
          for name, stats in report['coverage']['features'].items():
              print(name, json.dumps(stats, sort_keys=True))
          for horizon in ('5', '20', '40', '60'):
              block = report['horizons'][horizon]
              print('HORIZON', horizon, 'VALIDATION', json.dumps(block['validation_maturity'], sort_keys=True))
              for split in ('discovery', 'validation'):
                  for feature, stats in block[split].items():
                      if stats and stats.get('quantile_status') == 'available':
                          print(horizon, split, feature, json.dumps({
                              'N': stats['N'],
                              'risk_vs_adverse': stats['spearman_risk_vs_adverse_excursion'],
                              'risk_vs_peer': stats['spearman_risk_vs_peer_excess'],
                              'protection_gap': stats['protection_gap_high_minus_low_adverse_excursion'],
                              'alpha_advantage': stats['low_risk_alpha_advantage'],
                          }, sort_keys=True))
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: risk-vnext-3
          path: artifacts/research/risk_vnext_3.json
          if-no-files-found: error
