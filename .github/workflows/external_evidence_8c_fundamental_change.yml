name: Phase 8C-C Fundamental Change Engine

on:
  pull_request:
    paths:
      - "configs/external_evidence_8c_fundamental_change_v1.json"
      - "src/scanner/research/external_evidence/fundamental_change.py"
      - "src/scanner/research/external_evidence/fundamental_coverage.py"
      - "src/scanner/research/external_evidence/bulk_fundamental_evaluation.py"
      - "src/scanner/research/external_evidence/__init__.py"
      - "scripts/run_external_evidence_8c_bulk_fundamentals.py"
      - "tests/test_external_evidence_8c_fundamental_change.py"
      - "tests/test_external_evidence_8c_fundamental_extensions.py"
      - "tests/test_external_evidence_8c_bulk_fundamental_evaluation.py"
      - "docs/external_evidence_8c_fundamental_change.md"
      - ".github/workflows/external_evidence_8c_fundamental_change.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 8C-C fundamental change guards
        run: >-
          python -m pytest -q
          tests/test_external_evidence_8c_fundamental_change.py
          tests/test_external_evidence_8c_fundamental_extensions.py
          tests/test_external_evidence_8c_bulk_fundamental_evaluation.py
