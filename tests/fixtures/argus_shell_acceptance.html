<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARGUS Shell Browser QA</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#051724}
#argus{width:100%;height:100vh;border:0}
#argus-test-status{position:absolute;top:0;left:0;background:#1c3549;color:white;
 font:12px system-ui;z-index:100;padding:3px 9px;opacity:.93}</style></head>
<body><div id="argus-test-status">ARGUS_UI_PENDING</div>
<iframe id="argus" title="ARGUS-Testansicht" src="../../argus-preview/index.html"></iframe>
<script>
(()=>{
const args=new URLSearchParams(location.search);
const view=args.get('view')||'about',theme=args.get('theme')||'dark';
const iframe=document.getElementById('argus'),status=document.getElementById('argus-test-status');
let tries=0;
const poll=setInterval(()=>{
 if(++tries>160){clearInterval(poll);status.textContent='ARGUS_UI_FAIL: timeout';return}
 const w=iframe.contentWindow,d=w?.document;
 const selection=d?.getElementById('argusThemeChoice');
 const tab=d?.querySelector('nav.nav button[data-view="'+view+'"]');
 const banner=d?.querySelector('#about .aboutBanner');
 if(!selection||!tab||!banner||!banner.complete||!banner.naturalWidth)return;
 clearInterval(poll);
 try{
  tab.click();
  selection.value=theme;
  selection.dispatchEvent(new Event('change',{bubbles:true}));
  setTimeout(()=>{
   const nav=d.querySelector('nav.nav');
   const active=nav.querySelector('button.active');
   const vr=active?.getBoundingClientRect(),nr=nav.getBoundingClientRect();
   const visible=vr&&vr.left>=nr.left-3&&vr.right<=nr.right+3;
   const footers=d.querySelectorAll('footer').length;
   const badFooter=d.querySelectorAll('#start .smallfoot').length;
   const actualTheme=d.documentElement.getAttribute('data-argus-theme');
   const correct=(actualTheme===theme)&&(footers===1)&&(badFooter===0)&&
     (view!=='about'||banner.naturalWidth>0)&&visible&&d.querySelector('#about .aboutBanner')?.currentSrc.includes('about-argus-artwork.svg');
   status.textContent=correct?'ARGUS_UI_OK':'ARGUS_UI_FAIL'+JSON.stringify({actualTheme,footers,badFooter,visible,banner:banner.naturalWidth});
  },380);
 }catch(e){status.textContent='ARGUS_UI_FAIL '+e.message}
},75);
})();
</script></body></html>
