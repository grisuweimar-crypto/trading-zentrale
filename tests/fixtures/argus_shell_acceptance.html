<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARGUS dark-only rollback browser QA</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#061321}
#argus{width:100%;height:100vh;border:0}
#argus-test-status{position:absolute;top:0;left:0;background:#1c3549;color:#fff;z-index:100;
 font:12px system-ui;padding:3px 9px;opacity:.94}</style></head>
<body><div id="argus-test-status">ARGUS_UI_PENDING</div>
<iframe id="argus" title="ARGUS-Testansicht" src="../../argus-preview/index.html"></iframe>
<script>
(()=>{
const args=new URLSearchParams(location.search),view=args.get('view')||'about';
const iframe=document.getElementById('argus'),status=document.getElementById('argus-test-status');
if(args.get('mobile')==='1')iframe.style.width='390px';
let count=0;
const t=setInterval(()=>{
 if(++count>180){clearInterval(t);status.textContent='ARGUS_UI_FAIL: timeout';return}
 const w=iframe.contentWindow,d=w?.document;
 const tab=d?.querySelector('nav.nav button[data-view="'+view+'"]');
 const image=d?.querySelector('#about img.aboutBanner');
 if(!tab||!image||!image.complete||!image.naturalWidth)return;
 clearInterval(t);
 tab.click();
 setTimeout(()=>{
  const active=d.querySelector('nav.nav button.active');
  const navigation=d.querySelector('nav.nav');
  const r=active?.getBoundingClientRect(),n=navigation?.getBoundingClientRect();
  const navOk=!!(r&&n&&r.left>=n.left-4&&r.right<=n.right+4&&r.left>=-4&&r.right<=w.innerWidth+4);
  const footers=d.querySelectorAll('body > footer.footer').length;
  const noDuplicate=d.querySelectorAll('#start .smallfoot').length===0;
  const noSelector=!d.querySelector('#argusThemeChoice,.argusThemeControl');
  const original=/about-argus-original-before-pr301\.png$/.test(image.src);
  const dark=d.documentElement.style.colorScheme==='dark';
  const noNewGraphics=!d.querySelector('#about img[src*="about-argus-artwork.svg"],#about .argusApprovedIdentity');
  const all=navOk&&footers===1&&noDuplicate&&noSelector&&original&&dark&&noNewGraphics;
  status.textContent=all?'ARGUS_UI_OK':'ARGUS_UI_FAIL '+JSON.stringify({
   view,navOk,footers,noDuplicate,noSelector,original,dark,noNewGraphics,
   width:w.innerWidth,active:r?.left+'..'+r?.right,nav:n?.left+'..'+n?.right
  });
 },300);
},70);
})();
</script></body></html>
